[upstream] # Source of software & tooling
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "f4de33d06dada4edcf5076dded10e9c303cf597e"

[stack]
use = "rust"
runtime_packages = [
    "socat",
    "pkgconf",
    "openssl",
    "linux_headers",
    "zlib",
    "protobuf",
    "skopeo",
    "coreutils",
    "git",
]

[defaults]
state_key = "dev"

[session]
packages = ["just", "shellcheck", "python", "cargo-nextest"]

[tasks.build]
description = "Builds the minimal CLI"
exec = "cargo build --verbose"
inherit_cwd = true

[tasks.build-smoke]
description = "Smoke-test that a task can build something"
exec = "cargo build -p common"
inherit_cwd = true

[tasks.test]
exec = "cargo test --verbose"
inherit_cwd = true

[tasks.startup-time]
exec = "date"

[tasks.fmt-check]
exec = "cargo fmt -- --check"
inherit_cwd = true

[tasks.clippy]
exec = "cargo clippy --all-targets -- -D warnings"
inherit_cwd = true

# Mutation-test the graph wire decoder. Runs in the Linux sandbox, where the
# graph baseline test suite is green (the spec_hasher hash assertions that fail
# on macOS pass here), which cargo-mutants requires. Scoped to wire.rs to keep
# the run bounded; widen -f / drop it to cover more.
[tasks.mutants]
description = "Mutation-test the graph wire decoder with cargo-mutants"
inherit_cwd = true
bash = """
set -e
command -v cargo-mutants >/dev/null 2>&1 || cargo install cargo-mutants --locked
cargo mutants -p graph -f wire.rs --timeout 120
"""

[tasks.ci]
inherit_cwd = true
bash = """
set -e
cargo test --verbose
# cargo fmt -- --check
# cargo clippy --all-targets -- -D warnings
"""

# The agent runtime runs this one on the coder's files and amends the result
# into its last commit (runner/runner/jobs/implement.py, `run_fmt`). It must be
# `bash = `: a `spec.get("bash")` that is not a string reads as "no fmt task",
# and the PR then lands red on CI's `fmt` job for whitespace.
[tasks.fmt]
description = "rustfmt across the workspace; the runtime amends it into the coder's commit"
inherit_cwd = true
bash = """
set -e
cargo fmt --all
"""

# `min task run verify` — this repository's own word for "does this tree pass",
# run in a fresh clone at the pushed sha under a 10-minute budget
# (probeWallClockSeconds, worker/src/config.ts). Without this block the
# runtime falls back to the plan survey's `just test-one`, which has no
# filter to run.
#
# It was rustfmt only, because a COLD `cargo clippy --all-targets` on this
# workspace does not fit that budget. The runtime stopped running this task
# cold on 2026-09-20 (gominimal/agent-runtime#122): it is wrapped now, with
# the job's shared `CARGO_TARGET_DIR` and sccache, so it starts from the
# graph the task's own `test:` lines just built rather than from nothing.
#
# What that bought, and why the gate is wider now — canary 1569 on this
# repository, 2026-09-20, needed two coder jobs after the first:
#
#   Round 1: `clippy` red. The fix was `fix: remove redundant .into() in
#   policy test`. 29 minutes of a second job to delete two words, because
#   `[tasks.clippy]` sat right here and the gate did not run it.
#
#   Round 2: `unit` red. A box spec accepted ingress on HostNet. The task's
#   three `test:` lines in `-p sessions` all passed — they name single
#   tests, which is what the plan format requires — and the crate's own
#   suite is what caught it.
#
# So: clippy, then the suite of each crate the coder touched. Not the
# workspace's suite; `MINIMAL_CHANGED_PATHS` is what the runtime hands this
# task (one path per line) and the crates are read off it, so the gate is
# the size of the work. Empty means the runtime told us nothing, which is
# "no scope" — clippy still runs.
#
# Both mirror a CI job exactly, which is the point: CI is the gate that
# decides, and a signal that disagrees with it costs a whole job.
[tasks.verify]
description = "the cheap gate the agent runtime runs after a task's test lines"
inherit_cwd = true
bash = """
set -e
cargo fmt --all -- --check
cargo clippy --all-targets -- -D warnings

# The crates the coder touched, from the paths the runtime handed us:
# `crates/<name>/...` is the only layout this workspace has. Sorted and
# deduplicated, and a path outside `crates/` contributes nothing.
crates=$(printf '%s\\n' "${MINIMAL_CHANGED_PATHS:-}" \\
  | sed -n 's|^crates/\\([^/][^/]*\\)/.*|\\1|p' \\
  | sort -u)

if [ -n "$crates" ]; then
  args=""
  for c in $crates; do args="$args -p $c"; done
  # shellcheck disable=SC2086 - the package flags are meant to split
  cargo nextest run $args
fi
"""

[outputs.bash-img]
type = "oci-image"
packages = ["bash", "coreutils", "diffutils", "findutils", "tar"]
env_vars.test = "ello"
cmd = ["/usr/bin/bash", "-l"]

# Raw (uncompressed) kernel Image from the upstream virtio-kernel-raw package,
# loaded via KRUN_KERNEL_FORMAT_RAW (no in-VMM gzip decompress) for faster boot.
[outputs.virtio-kernel]
type = "raw-file"
packages = ["virtio-kernel-raw"]
path = "usr/share/virtio-linux/Image"

# Guest rootfs ext4 image from the upstream microvm-rootfs package.
[outputs.minvmd-rootfs]
type = "raw-file"
packages = ["microvm-rootfs"]
path = "usr/share/microvm-rootfs/rootfs.img"

# libkrun KVM backend (shared lib + its libkrunfw firmware) from the upstream
# libkrun package. Materialized as an OCI image whose layers carry the full
# runtime closure; scripts/fetch-libkrun.sh extracts just libkrun.so* and
# libkrunfw.so* into a link/runtime prefix. This replaces the former from-source
# build — libkrunfw compiles a guest kernel, far too heavy to rebuild in CI on
# every run.
[outputs.libkrun]
type = "oci-image"
packages = ["libkrun"]

