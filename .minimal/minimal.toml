[upstream] # Source of software & tooling
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "e4305e616ec4ecda17ab5ab8ad7a0e75cd4b538d"

[harness]
use = "rust"

[defaults]
profile = "dev"
state_key = "dev"

[tasks.claude]
interactive = true
exec = "claude --dangerously-skip-permissions"

[tasks.build]
exec = "cargo build --verbose"
inherit_cwd = true

[tasks.test]
exec = "cargo test --verbose"
inherit_cwd = true

[tasks.shell]
interactive = true
exec = "bash --noprofile -l"

[tasks.startup-time]
exec = "date"

[outputs.bash-img]
type = "oci-image"
packages = ["bash", "coreutils", "diffutils", "findutils", "tar"]
env_vars.test = "ello"
cmd = ["/usr/bin/bash", "-l"]

[tasks.vim]
profile = "demo"
state_key = ""
exec = "vim"

[tasks.btop]
profile = "demo"
state_key = ""
exec = "btop"

[tasks.demo-shell]
profile = "demo"
state_key = "demo"
exec = "bash -l"

[tasks.python]
profile = "demo"
state_key = "demo"
exec = "python3"


[tasks.ci]
inherit_cwd = true
bash = """
set -e
cargo test --verbose
cargo fmt -- --check
cargo clippy --all-targets -- -D warnings
"""

[tasks.fmt-check]
exec = "cargo fmt -- --check"
inherit_cwd = true

[tasks.clippy]
exec = "cargo clippy --all-targets -- -D warnings"
inherit_cwd = true

[tasks.env-smoketest]
inherit_cwd = true
bash = """
echo 'env:' && env && echo "pwd: $(pwd)"
"""
