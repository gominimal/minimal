[upstream] # Source of software & tooling
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "f641cfa4665c1d063936e1750d2e80a12a5161cc"

[harness]
use = "rust"

[defaults]
profile = "dev"
state_key = "dev"

[tasks.claude]
cmd = "claude"

[tasks.test]
cmd = "cargo test"

[tasks.shell]
cmd = "bash -l"

[outputs.bash-img]
type = "oci-image"
packages = ["bash", "coreutils", "diffutils", "findutils", "tar"]
env_vars.test = "ello"
cmd = ["/usr/bin/bash", "-l"]

[tasks.vim]
profile = "demo"
state_key = ""
cmd = "vim"

[tasks.btop]
profile = "demo"
state_key = ""
cmd = "btop"

[tasks.demo-shell]
profile = "demo"
state_key = "demo"
cmd = "bash -l"

[tasks.python]
profile = "demo"
state_key = "demo"
cmd = "python3"


[tasks.env-smoketest]
inherit_cwd = true
cmd = """
bash -c "echo 'env:' && env && echo \\"pwd: $(pwd)\\""
"""

[stdlib]
repo = "https://github.com/gominimal/std"
branch = "main"
locked_commit = "9e0003d800446d45d645c33f1c1d4590687ef7e0"
