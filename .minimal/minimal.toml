[upstream] # Source of software & tooling
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "64e6866"

[harness]
use = "rust"
runtime_packages = ["socat"]

[defaults]
profile = "dev"
state_key = "dev"

[tasks.claude]
interactive = true
exec = "claude --dangerously-skip-permissions"

[tasks.build]
description = "Builds the minimal CLI"
exec = "cargo build --verbose"
inherit_cwd = true

[tasks.build-smoke]
description = "Smoke-test that `minimal run` can build the CLI"
exec = "cargo build -p minimal"
inherit_cwd = true

[tasks.test]
exec = "cargo test --verbose"
inherit_cwd = true

[tasks.shell]
interactive = true
exec = "bash --noprofile -l"

[tasks.startup-time]
exec = "date"

[outputs.bash-img]
type = "oci-image"
packages = ["bash", "coreutils", "diffutils", "findutils", "tar"]
env_vars.test = "ello"
cmd = ["/usr/bin/bash", "-l"]

# Raw (uncompressed) kernel Image from the upstream virtio-kernel-raw package,
# loaded via KRUN_KERNEL_FORMAT_RAW (no in-VMM gzip decompress) for faster boot.
[outputs.virtio-kernel]
type = "raw-file"
packages = ["virtio-kernel-raw"]
path = "usr/share/virtio-linux/Image"

# Guest rootfs ext4 image from the LOCAL minvmd-rootfs package. Stage 2 needs a
# minimald-capable rootfs (the /var/lib/minimal mountpoint + e2fsprogs at runtime
# so minimald can mke2fs the writable data disk), which the generic upstream
# microvm-rootfs deliberately omits — so the rootfs stays local here.
[outputs.minvmd-rootfs]
type = "raw-file"
packages = ["minvmd-rootfs"]
path = "usr/share/minvmd-rootfs/rootfs.img"

[tasks.vim]
profile = "demo"
state_key = ""
exec = "vim"

[tasks.btop]
profile = "demo"
state_key = ""
exec = "btop"

[tasks.demo-shell]
profile = "demo"
state_key = "demo"
exec = "bash -l"

[tasks.python]
profile = "demo"
state_key = "demo"
exec = "python3"


[tasks.ci]
inherit_cwd = true
bash = """
set -e
cargo test --verbose
cargo fmt -- --check
cargo clippy --all-targets -- -D warnings
"""

[tasks.fmt-check]
exec = "cargo fmt -- --check"
inherit_cwd = true

[tasks.clippy]
exec = "cargo clippy --all-targets -- -D warnings"
inherit_cwd = true

[tasks.arg-smoketest]
args = {
    input_str = "string"
}
bash = """
echo Input was: %{input_str}
"""
