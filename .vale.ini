# Prose linting for the repo's markdown. `just lint-prose` fetches the packages
# below on first use (or run `vale sync` by hand); `vale <file.md>` lints one file.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Minimal

Packages = ai-tells, https://github.com/amoslives/vale-ste/releases/download/v0.1.1/ste.zip

[*.md]
BasedOnStyles = Vale, ste, ai-tells
# The vocabulary exists to accept project terms in Spelling, not to police
# casing: Vale.Terms enforces the exact casing in accept.txt with no
# sentence-start tolerance, flagging correct prose ("Config" opening a
# sentence, "Loadouts" as a heading) whenever a common noun is listed.
Vale.Terms = NO
