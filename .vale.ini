# Prose linting for the repo's markdown. The rules live in the shared package
# gominimal/prose-rules, pinned to a reviewed release so lint results only move
# when this file changes. `just lint-prose` fetches it on first use (or run
# `vale sync` by hand); `vale <file.md>` lints one file.
StylesPath = styles
Packages = https://github.com/gominimal/prose-rules/releases/download/v1.1.0/prose-rules.zip
