# Prose linting for the repo's markdown. The third-party styles (`ste` and
# `ai-tells`) are pinned to reviewed releases; the project vocabulary and the
# first-party `inventory` rule are tracked under `styles/`. `just lint-prose`
# fetches the packages on first use (or run `vale sync` by hand);
# `vale <file.md>` lints one file.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Minimal

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip, https://github.com/amoslives/vale-ste/releases/download/v0.1.1/ste.zip

[*.md]
BasedOnStyles = Vale, ste, ai-tells, inventory
# The vocabulary exists to accept project terms in Spelling, not to police
# casing: Vale.Terms enforces the exact casing in accept.txt with no
# sentence-start tolerance, flagging correct prose ("Config" opening a
# sentence, "Loadouts" as a heading) whenever a common noun is listed.
Vale.Terms = NO
