# Clippy configuration for the workspace.
#
# The `*-in-tests` keys below exempt test code for five lints: the panic sources
# (`unwrap`, `expect`, `panic`), plus `indexing_slicing` and `dbg_macro`. In test
# code a panicking unwrap or a literal index is the idiomatic way to fail a
# test, and a leftover `dbg!` is a deliberate probe. None of the five is in
# `[workspace.lints]`, because the tree is not clean for them yet; they run only
# on changed lines, via `just clippy-strict`. See scripts/clippy-strict.sh.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# Per-function complexity thresholds for the metrics pipeline's lints
# (`clippy::cognitive_complexity`, `too_many_lines`, `too_many_arguments`,
# enabled by scripts/metrics/run.sh, not by `just clippy`). The values are
# mirrored in metrics/thresholds.toml `[clippy]`; scripts/metrics_test.sh
# fails when the two disagree.
cognitive-complexity-threshold = 25
too-many-lines-threshold = 100
too-many-arguments-threshold = 7

# `Entry::unpack` resolves a hardlink's link name against the process CWD, not
# the destination root, so a contained entry path can still write outside it.
# Clippy reads only the nearest clippy.toml above a crate's manifest, so every
# per-crate clippy.toml (crates/minimald/clippy.toml) must restate these entries.
disallowed-methods = [
    { path = "tar::Entry::unpack", reason = "resolves hardlink targets against the process CWD, escaping the destination root; use `Archive::unpack` or intercept hardlinks (see `common::archive::extract_tar_impl`)" },
    { path = "async_tar::Entry::unpack", reason = "resolves hardlink targets against the process CWD, escaping the destination root; use `Archive::unpack` or intercept hardlinks (see `common::archive::extract_tar_impl`)" },
]
