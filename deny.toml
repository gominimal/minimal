[advisories]
ignore = ["RUSTSEC-2024-0014"]

[licenses]
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-3.0 WITH LGPL-3.0-linking-exception",
    "LGPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

