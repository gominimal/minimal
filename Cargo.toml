[workspace]
members = [
    "crates/lcache",
    "crates/rcache",
    "crates/check",
    "crates/checkouts",
    "crates/common",
    "crates/decode",
    "crates/graph",
    "crates/mctx",
    "crates/mfile",
    "crates/multi",
    "crates/op",
    "crates/ot",
    "crates/orchestrator",
    "crates/minimal",
    "crates/remote-client",
    "crates/remote-proto",
    "crates/sandbox2",
    "crates/stdlib",
]
resolver = "3"

package.edition = "2024"
package.publish = false

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.100"
blake3 = { version = "1", features = ["serde"] }
bytes = "1.11.0" # keep in sync with reqwest
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5" }
codespan-reporting = { version = "0.13", features = ["serialization"] } # Keep in sync with nickel-lang-core
copy_dir = "0.1.3"
dirs = "6"
either = { version = "1.15", default-features = false }
flate2 = "1.1"
futures = "0.3"
generational-arena = {version = "^0.2", features = ["serde"] }
google-cloud-gax = "1.9"
google-cloud-auth = "1.3"
google-cloud-storage = "1.5"
hakoniwa = { git = "https://github.com/souk4711/hakoniwa", branch = "main", features = ["cgroups"] }
http-body = "1"
hex = "0.4"
indicatif = "0.18"
indoc = "^2.0"
jaq-all = "0.1.0"
lzma-rs = "0.3"
nickel-lang-core = { version = "0.17.0", default-features = false, features = ["format"] }
object = { version = "0.39", default-features = false, features = ["archive", "elf", "read_core", "std"] }
oci-spec = "0.9.0"
path-absolutize = "^3.1"
rand = "0.10"
rayon = "1.12"
regex = "1" # keep in sync with nickel-lang-core
reqwest = { version = "0.13", features = ["stream"], default-features = false } # keep in sync with google-cloud-gax
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive", "rc"] } # Keep within the same minor version as nickel-lang-core
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
resolv-conf = "0.7"
serde_json = { version = "1.0" }
sha2 = "0.11"
shlex = "1.3"
size = "0.5"
smallvec = {version = "1.15", features = ["serde"]}
tar = "0.4"
tempfile = "3.23"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "1.1"
toml_edit = "0.25"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2" # keep in sync with reqwest
uuid = { version = "1.23", features = ["v4", "serde"] }
zstd = "0.13"

globset = "0.4"
walkdir = "2.5"

petgraph = "0.8"

# our crates
graph = { version = "0.0.1", path = "crates/graph" }
lcache = { version = "0.0.1", path = "crates/lcache" }
rcache = { version = "0.0.1", path = "crates/rcache" }
check = { version = "0.0.1", path = "crates/check" }
checkouts = { version = "0.0.1", path = "crates/checkouts" }
common = { version = "0.0.1", path = "crates/common" }
decode = { version = "0.0.1", path = "crates/decode" }
mctx = { version = "0.0.1", path = "crates/mctx" }
mfile = { version = "0.0.1", path = "crates/mfile" }
multi = { version = "0.0.1", path = "crates/multi" }
op = { version = "0.0.1", path = "crates/op" }
ot = { version = "0.0.1", path = "crates/ot" }
orchestrator = { version = "0.0.1", path = "crates/orchestrator" }
remote-proto = { version = "0.0.1", path = "crates/remote-proto" }
remote-client = { version = "0.0.1", path = "crates/remote-client" }
sandbox2 = { version = "0.0.1", path = "crates/sandbox2" }

stdlib = { version = "0.0.9", path = "crates/stdlib" }
