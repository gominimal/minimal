[workspace]
members = ["crates/build-sandbox", "crates/minimal", "crates/graph"]
resolver = "3"

[workspace.dependencies]
indoc = "^2.0"
generational-arena = "^0.2"
blake3 = "1"
fxhash = "0.2"

nickel-lang-core = "0.13"

# Keep within the same minor version as nickel-lang-core
serde = { version = "1.0", features = ["derive"] }

# our crates
build-sandbox = { path = "crates/build-sandbox" }
graph = { version = "0.0.1", path = "crates/graph" }
