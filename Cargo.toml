[workspace]
members = [
    "crates/args",
    "crates/async-dialog",
    "crates/lcache",
    "crates/rcache",
    "crates/check",
    "crates/checkouts",
    "crates/common",
    "crates/decode",
    "crates/diagnostics",
    "crates/graph",
    "crates/mctx",
    "crates/mfile",
    "crates/op",
    "crates/ot",
    "crates/orchestrator",
    "crates/paths",
    "crates/mip",
    "crates/minimal",
    "crates/minimal-client",
    "crates/minimal-tui",
    "crates/minimald",
    "crates/minimald-rpc",
    "crates/minvmd",
    "crates/mlog",
    "crates/remote-client",
    "crates/remote-proto",
    "crates/sandbox2",
    "crates/sessions",
    "crates/stdlib",
    "crates/switch",
    "crates/version",
]
resolver = "3"

package.edition = "2024"
package.publish = false
package.license = "Apache-2.0"
# Minimum supported Rust version, verified by the nightly `msrv` job
# (`cargo hack check --rust-version`). Every crate inherits this via
# `rust-version.workspace = true`; bump here, in one place, when the floor moves.
# 1.95 is the dependency-driven floor (sysinfo 0.39 requires rustc 1.95); no
# resolved dependency requires newer. The build toolchain pin is 1.97.0.
package.rust-version = "1.95"
# Shared base version for the workspace. This is the fallback the `version` crate
# reports when no `v*` git tag is reachable; the real release version comes from
# `git describe` at build time. See crates/version/build.rs.
package.version = "0.5.0-rc1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Fast-compiling profile for the Stage-2 guest initramfs minimald. The release
# profile's full LTO + codegen-units=1 dominate the cross-compile time, and the
# initramfs binary doesn't need them (it just reaches READY + serves a session).
# Drops the cross-compile from ~13 min toward a few minutes.
[profile.initramfs]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16

[workspace.dependencies]
anyhow = "1.0"
arbitrary = "1"
async-compression = { version = "0.4", features = ["tokio", "zstd", "zstdmt"] }
async-tar = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23"
blake3 = { version = "1", features = ["serde"] }
# WireGuard mesh peer (Unit 4, behind the `networking-wg` feature). Pure-Rust
# WireGuard avoids a Go/cgo toolchain dependency (spec Design Considerations).
boringtun = { version = "0.7", default-features = false }
bytes = "1.12" # keep in sync with reqwest
bzip2 = "0.6"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = { version = "4.6" }
codespan-reporting = { version = "0.13", features = ["serialization"] } # Keep in sync with nickel-lang-core
constcat = "0.6"
copy_dir = "0.1.3"
chrono = {version = "0.4", features = ["serde", "std"]}
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
fd-lock = "4"
either = { version = "1.17", default-features = false }
flate2 = "1.1"
futures = "0.3"
generational-arena = {version = "0.2", features = ["serde"] }
google-cloud-gax = "1.13"
google-cloud-auth = "1.15"
google-cloud-storage = "1.17"

# Tracked as a git rev, not the crates.io release, update when they publish next.
# Current rev is master @ 2026-08-03.
hakoniwa = { features = ["cgroups", "rustslirp"], git = "https://github.com/souk4711/hakoniwa.git", rev = "0810ffa37620ef5c57de263c8eaa1f4d7633c14a" }
http-body = "1"
hex = "0.4"
indicatif = "0.18"
indoc = "^2.0"
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }
insta = "1.48"
jaq-all = "0.3.0"
json-subscriber = "0.3"
libc = "0.2"
lzma-rs = "0.3"

# Tracked as a git rev, not the crates.io release: crates.io lags master by a
# long way (0.18.0 is the newest published, and master has moved well past it).
# Bump the rev to pick up upstream fixes; revisit crates.io only once its
# releases catch up. Current rev is master @ 2026-08-03.
nickel-lang-core = { git = "https://github.com/nickel-lang/nickel.git", rev = "21decd294fe404d67d1545d11563016af6ea4090", default-features = false, features = ["format"] }

opentelemetry-semantic-conventions = "0.32"
# `socket` + `time`: the guest's vsock timekeep listener binds an AF_VSOCK
# datagram socket and steps CLOCK_REALTIME from the host's updates.
nix = { version = "0.31", features = ["fs", "sched", "socket", "time", "user"] }
nutype = { version = "0.7", features = ["serde"] }
object = { version = "0.40", default-features = false, features = ["archive", "elf", "read_core", "std"] }
oci-spec = "0.10"
path-absolutize = "4.0"
rand = "0.10"
# rand_core 0.6 (not 0.10) to match boringtun/x25519-dalek's RNG traits for
# WireGuard keypair generation (`networking-wg`).
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.12"
ratatui = "0.30"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1" # keep in sync with nickel-lang-core
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
reqwest = { version = "0.13.4", features = ["stream"], default-features = false } # keep in sync with google-cloud-gax
rustc-hash = "2.1.3"
serde = { version = "1.0", features = ["derive", "rc"] } # Keep within the same minor version as nickel-lang-core
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
resolv-conf = "0.7"
russh = { version = "0.62", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = "2.4"
serde_json_lenient = { version = "0.2" }
serial_test = "4"
sha2 = "0.11"
shlex = "2.0"
size = "0.5"
smallvec = {version = "1.15", features = ["serde"]}
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tokio-vsock = "0.7"
tokio-util = "0.7"
toml = "1.1"
toml_edit = "0.25"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2"
unicode-width = "0.2"
url = "2" # keep in sync with reqwest
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
vt100-ctt = { version = "0.17", default-features = false }
zstd = "0.13"

moka = { version = "0.12", default-features = false, features = ["sync"] }
globset = "0.4"
walkdir = "2.5"

petgraph = "0.8"

# Our crates. These are path deps in a `publish = false` workspace, so no
# `version` requirement is needed (or used) — cargo resolves them by path. Adding
# one would just be a pin to keep in sync with each crate's own version.
args = { path = "crates/args" }
async-dialog = { path = "crates/async-dialog" }
graph = { path = "crates/graph" }
lcache = { path = "crates/lcache" }
rcache = { path = "crates/rcache" }
check = { path = "crates/check" }
checkouts = { path = "crates/checkouts" }
common = { path = "crates/common" }
decode = { path = "crates/decode" }
diagnostics = { path = "crates/diagnostics" }
mctx = { path = "crates/mctx" }
minimal-client = { path = "crates/minimal-client" }
minimal-tui = { path = "crates/minimal-tui" }
minimald-rpc = { path = "crates/minimald-rpc" }
mlog = { path = "crates/mlog" }
mfile = { path = "crates/mfile" }
op = { path = "crates/op" }
ot = { path = "crates/ot" }
orchestrator = { path = "crates/orchestrator" }
paths = { path = "crates/paths" }
remote-proto = { path = "crates/remote-proto" }
remote-client = { path = "crates/remote-client" }
sandbox2 = { path = "crates/sandbox2" }
sessions = { path = "crates/sessions" }
switch = { path = "crates/switch" }
version = { path = "crates/version" }

stdlib = { path = "crates/stdlib" }

# Lifts the wasm-bindgen ceiling.
#
# nickel-lang-core's `format` feature (what `mip check --fix` formats .ncl
# files with, crates/check/src/lib.rs) reaches topiary-core ->
# topiary-tree-sitter-facade -> topiary-web-tree-sitter-sys. Released 0.7.3
# pins an exact `wasm-bindgen = "=0.2.100"` *untargeted*, so it constrains
# resolution even though we never build wasm32 — capping wasm-bindgen at
# 0.2.100 and js-sys/web-sys at 0.3.77 for the entire graph. That in turn
# pinned google-cloud-auth/storage, reqwest and russh-sftp well below their
# current releases, and forced duplicate copies of the RustCrypto 0.10 stack
# (sha2/digest/block-buffer/crypto-common) alongside our 0.11.
#
# Upstream already fixed it — master moved to a caret `wasm-bindgen = "0.2"`
# and target-gates topiary-web-tree-sitter-sys behind
# `cfg(target_arch = "wasm32")` — but has not cut a release carrying it.
# Master's workspace version is still 0.7.3, so this patch satisfies
# nickel's `topiary-core = "^0.7"` unchanged.
#
# Only the two wasm crates are patched: topiary-core has no wasm-bindgen
# dependency of its own and stays on crates.io 0.7.3, so .ncl formatting
# output is untouched. Drop this section once topiary publishes >0.7.3.
[patch.crates-io]
topiary-tree-sitter-facade = { git = "https://github.com/tweag/topiary.git", rev = "838c74ab4058f82bc3c6a12380f22c10f22ac814" }
topiary-web-tree-sitter-sys = { git = "https://github.com/tweag/topiary.git", rev = "838c74ab4058f82bc3c6a12380f22c10f22ac814" }
