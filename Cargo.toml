[workspace]
members = [
    "crates/args",
    "crates/lcache",
    "crates/rcache",
    "crates/check",
    "crates/checkouts",
    "crates/common",
    "crates/decode",
    "crates/graph",
    "crates/mctx",
    "crates/mfile",
    "crates/op",
    "crates/ot",
    "crates/orchestrator",
    "crates/paths",
    "crates/minimal",
    "crates/minimal2",
    "crates/minimald",
    "crates/minimald-rpc",
    "crates/minvmd",
    "crates/remote-client",
    "crates/remote-proto",
    "crates/sandbox2",
    "crates/sessions",
    "crates/stdlib",
]
resolver = "3"

package.edition = "2024"
package.publish = false

[profile.release]
strip = true
lto = true
codegen-units = 1

# Fast-compiling profile for the Stage-2 guest initramfs minimald. The release
# profile's full LTO + codegen-units=1 dominate the cross-compile time, and the
# initramfs binary doesn't need them (it just reaches READY + serves a session).
# Drops the cross-compile from ~13 min toward a few minutes.
[profile.initramfs]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16

[workspace.dependencies]
anyhow = "1.0"
blake3 = { version = "1", features = ["serde"] }
bytes = "1.11" # keep in sync with reqwest
bzip2 = "0.6"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = { version = "4.6" }
codespan-reporting = { version = "0.13", features = ["serialization"] } # Keep in sync with nickel-lang-core
constcat = "0.6"
copy_dir = "0.1.3"
chrono = {version = "0.4", features = ["serde", "std"]}
dirs = "6"
fd-lock = "4"
either = { version = "1.16", default-features = false }
flate2 = "1.1"
futures = "0.3"
generational-arena = {version = "0.2", features = ["serde"] }
google-cloud-gax = "1.13"
google-cloud-auth = "1.5"
google-cloud-storage = "1.7"
# Revert back to crates.io dep once new version is released.
hakoniwa = { git = "https://github.com/souk4711/hakoniwa.git", rev = "41ce36e087fa1fcf28d17123042d150e71c09705", features = ["cgroups"] }
http-body = "1"
hex = "0.4"
indicatif = "0.18"
indoc = "^2.0"
jaq-all = "0.2.0"
libc = "0.2"
lzma-rs = "0.3"

nickel-lang-core = { version = "0.18", default-features = false, features = ["format"] }

nix = { version = "0.31", features = ["fs"] }
nutype = { version = "0.7", features = ["serde"] }
object = { version = "0.39", default-features = false, features = ["archive", "elf", "read_core", "std"] }
oci-spec = "0.10"
path-absolutize = "3.1"
rand = "0.10"
rayon = "1.12"
regex = "1" # keep in sync with nickel-lang-core
reqwest = { version = "0.13", features = ["stream"], default-features = false } # keep in sync with google-cloud-gax
rustc-hash = "2.1.2"
serde = { version = "1.0", features = ["derive", "rc"] } # Keep within the same minor version as nickel-lang-core
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
resolv-conf = "0.7"
russh = "0.61"
russh-sftp = "2.1"
serde_json = { version = "1.0" }
serial_test = "3"
sha2 = "0.11"
shlex = "2.0"
size = "0.5"
smallvec = {version = "1.15", features = ["serde"]}
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1"
tokio-vsock = "0.7"
tokio-util = "0.7"
toml = "1.1"
toml_edit = "0.25"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
url = "2" # keep in sync with reqwest
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
vt100-ctt = "0.17"
zstd = "0.13"

moka = { version = "0.12", default-features = false, features = ["sync"] }
globset = "0.4"
walkdir = "2.5"

petgraph = "0.8"

# our crates
args = { version = "0.0.1", path = "crates/args" }
graph = { version = "0.0.1", path = "crates/graph" }
lcache = { version = "0.0.1", path = "crates/lcache" }
rcache = { version = "0.0.1", path = "crates/rcache" }
check = { version = "0.0.1", path = "crates/check" }
checkouts = { version = "0.0.1", path = "crates/checkouts" }
common = { version = "0.0.1", path = "crates/common" }
decode = { version = "0.0.1", path = "crates/decode" }
mctx = { version = "0.0.1", path = "crates/mctx" }
minimald-rpc = { version = "0.0.1", path = "crates/minimald-rpc" }
mfile = { version = "0.0.1", path = "crates/mfile" }
op = { version = "0.0.1", path = "crates/op" }
ot = { version = "0.0.1", path = "crates/ot" }
orchestrator = { version = "0.0.1", path = "crates/orchestrator" }
paths = { version = "0.0.1", path = "crates/paths" }
remote-proto = { version = "0.0.1", path = "crates/remote-proto" }
remote-client = { version = "0.0.1", path = "crates/remote-client" }
sandbox2 = { version = "0.0.1", path = "crates/sandbox2" }
sessions = { version = "0.0.1", path = "crates/sessions" }

stdlib = { version = "0.0.15", path = "crates/stdlib" }
