[workspace]
members = [
    "crates/build-sandbox",
    "crates/cache",
    "crates/common",
    "crates/minimal",
    "crates/graph",
]
resolver = "3"

package.edition = "2024"
package.publish = false

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.99"
blake3 = "1"
bytes = "1.10.1" # keep in sync with reqwest
clap = { version = "4.4", features = ["derive"] }
codespan-reporting = { version = "0.12", features = [
    "serialization",
] } # Keep in sync with nickel-lang-core
dirs = "6"
docker_credential = "1.3"
flate2 = "1.0"
futures = "0.3"
generational-arena = "^0.2"
google-cloud-gax = "1.0.0"
google-cloud-storage = "1.0.0"
hakoniwa = { git = "https://github.com/souk4711/hakoniwa.git", rev = "3aa3f99d9c7a2f81a2d31255ab878b34b5effbd7" }
hex = "0.4"
indoc = "^2.0"
nickel-lang-core = { version = "0.14", default-features = false, features = [
    "format",
] }
oci-client = { version = "0.15.0", features = [
    "rustls-tls",
], default-features = false }
oci-spec = "0.8.2"
path-absolutize = "^3.1"
rayon = "1.11"
regex = "1" # keep in sync with nickel-lang-core
reqwest = { version = "0.12", features = [
    "stream",
] } # keep in sync with google-cloud-gax
rustc-hash = "2.1.1"
serde = { version = "1.0", features = [
    "derive",
] } # Keep within the same minor version as nickel-lang-core
serde_json = { version = "1.0" }
sha2 = "0.10.9"
shlex = "1.3"
size = "0.5"
smallvec = "1.14"
tar = "0.4"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.47.1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-indicatif = "0.3.13"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5" # keep in sync with reqwest
zstd = "0.13"

globset = "0.4"

# our crates
build-sandbox = { path = "crates/build-sandbox" }
graph = { version = "0.0.1", path = "crates/graph" }
cache = { version = "0.0.1", path = "crates/cache" }
common = { version = "0.0.1", path = "crates/common" }

[patch.crates-io]
nickel-lang-core = { git = "https://github.com/gominimal/nickel", branch = "minimal" }
