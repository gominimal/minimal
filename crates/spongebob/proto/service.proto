syntax = "proto3";

package spongebob.v1;

service SpongeBobService {
  rpc CreateInvokation(CreateInvokationRequest) returns (Invokation) {}
  rpc CreateFile(CreateFileRequest) returns (File) {}
}

message Invokation {
  string name = 1;
}

message CreateInvokationRequest {
  string invokation_id = 1;
  Invokation invokation = 2;
}

message File {
  string name = 1;
  bytes contents = 2;
}

message CreateFileRequest {
  string parent = 1;
  string file_id = 2;
  File file = 3;
}
