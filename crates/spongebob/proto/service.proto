syntax = "proto3";

package spongebob.v1;

service SpongeBobService {
  rpc CreateInvocation(CreateInvocationRequest) returns (Invocation) {}
  rpc CreateFile(CreateFileRequest) returns (File) {}
}

message Invocation {
  string name = 1;
}

message CreateInvocationRequest {
  string invocation_id = 1;
  Invocation invocation = 2;
}

message File {
  string name = 1;
  bytes contents = 2;
}

message CreateFileRequest {
  string parent = 1;
  string file_id = 2;
  File file = 3;
}
