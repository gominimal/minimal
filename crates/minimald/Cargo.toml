[package]
name = "minimald"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[features]
# Enables the B8 HTTPS reverse proxy with mTLS termination (R4.4–R4.7) in front
# of the shared B5 routing core. Requires the rustls/rcgen/tokio-rustls deps.
networking-proxy = ["dep:rcgen", "dep:rustls", "dep:tokio-rustls"]
# WireGuard mesh peer and its CLI/RPC plumbing (Unit 4). Off by default so the
# default `minimald` build pulls in no WireGuard code and pays no binary-size or
# startup cost (R4.7); enable with `--features networking-wg`.
networking-wg = ["dep:boringtun", "dep:base64", "dep:rand_core"]

[dependencies]
async-compression.workspace = true
async-tar.workspace = true
bytes.workspace = true
camino.workspace = true
clap.workspace = true
clap_complete.workspace = true
constcat.workspace = true
either.workspace = true
futures.workspace = true
hakoniwa.workspace = true
libc.workspace = true
russh.workspace = true
russh-sftp.workspace = true
path-absolutize.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
vt100-ctt.workspace = true

tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# WireGuard mesh peer (Unit 4, R4.1/R4.7): compiled only under `networking-wg`.
base64 = { workspace = true, optional = true }
boringtun = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }

args.workspace = true
check.workspace = true
common.workspace = true
graph.workspace = true
mctx.workspace = true
mfile.workspace = true
minimald-rpc.workspace = true
op.workspace = true
ot.workspace = true
paths.workspace = true
sandbox2.workspace = true
sessions.workspace = true
switch.workspace = true
stdlib.workspace = true

rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
# The two-namespace UC7 mesh integration test (`tests/mesh_uc7.rs`) drives a
# tokio runtime and `setns(2)` directly.
libc.workspace = true
tokio.workspace = true
# Parity test in `sessions/composables.rs` compares `SetupForPackages` output
# to the composition-only path from a nickel-declared BuildSpec.
decode.workspace = true
indoc.workspace = true

# The guest (initramfs pid-1) boot path is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock.workspace = true
