[package]
name = "common"
description = "Common types and utilities (e.g. SpecHash) used across the codebase."
version = "0.0.1"
rust-version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# `read_while_writing::test_util`: the probe that tests of the read-ahead wiring put between a
# session loop and its transport. Only other crates' dev-dependencies turn it on.
test-util = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json_lenient.workspace = true
blake3.workspace = true
tracing.workspace = true

copy_dir.workspace = true
globset.workspace = true
jaq-all.workspace = true
walkdir.workspace = true

bzip2.workspace = true
either.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
lzma-rs.workspace = true
tempfile.workspace = true
zstd.workspace = true

args.workspace = true
nickel-lang-core.workspace = true

bytes.workspace = true
reqwest.workspace = true
futures.workspace = true
tokio.workspace = true
url.workspace = true
google-cloud-auth.workspace = true
google-cloud-storage.workspace = true

resolv-conf.workspace = true

ot.workspace = true

codespan-reporting.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
# `test-util` (not in tokio's `full`) for `#[tokio::test(start_paused = true)]`:
# a stuck read-ahead test reaches its bound as soon as no task can run.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
