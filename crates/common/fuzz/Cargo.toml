# Standalone fuzz workspace for the `common` crate. Its own `[workspace]` keeps
# the nightly/sanitizer build off the main workspace.
[package]
name = "common-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `archive_extract` extracts into a throwaway dir per iteration.
tempfile = "3"

[dependencies.common]
path = ".."

[[bin]]
name = "spec_hash_from_hex"
path = "fuzz_targets/spec_hash_from_hex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "target_from_str"
path = "fuzz_targets/target_from_str.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jq_parse_json"
path = "fuzz_targets/jq_parse_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_extract"
path = "fuzz_targets/archive_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize_within_root"
path = "fuzz_targets/normalize_within_root.rs"
test = false
doc = false
bench = false

[workspace]

# Mirrors the root workspace's patch. A `fuzz/` dir is its own workspace — that
# is what keeps the nightly/sanitizer build off the main one — and `[patch]`
# does not cross a workspace boundary, so the root's entry does not apply here.
# Without this the topiary/wasm-bindgen dependency graph fails to resolve and
# every target in this workspace stops building.
[patch.crates-io]
topiary-tree-sitter-facade = { git = "https://github.com/tweag/topiary.git", rev = "838c74ab4058f82bc3c6a12380f22c10f22ac814" }
topiary-web-tree-sitter-sys = { git = "https://github.com/tweag/topiary.git", rev = "838c74ab4058f82bc3c6a12380f22c10f22ac814" }
