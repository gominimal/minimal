[package]
name = "minmirrord"
description = "The mirror daemon: one copy per laptop of the cache objects and package repositories its clients fetch, served on a Unix socket for the host and a vsock door for every VM."
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "minmirrord"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

common.workspace = true
mirror-client.workspace = true
mlog.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
