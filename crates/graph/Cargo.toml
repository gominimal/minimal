[package]
name = "graph"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
indoc.workspace = true

[dependencies]
nickel-lang-core.workspace = true
codespan-reporting.workspace = true
blake3.workspace = true
generational-arena.workspace = true
smallvec.workspace = true
serde.workspace = true
serde_json_lenient.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true

args.workspace = true
common.workspace = true
checkouts.workspace = true
decode.workspace = true
mfile.workspace = true

# Optional, enabled by the `fuzzing` feature for the in-crate round-trip fuzz
# entry point (crates/graph/fuzz). Off in normal builds.
arbitrary = { workspace = true, optional = true }

[features]
# Exposes `Graph::fuzz_roundtrip` for crates/graph/fuzz. Not for production use.
fuzzing = ["dep:arbitrary"]
