[package]
name = "build-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
tempfile = "3.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = [
    "fs",
    "mount",
    "sched",
    "process",
    "user",
] }
libc = "0.2"
