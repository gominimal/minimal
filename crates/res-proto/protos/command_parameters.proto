syntax = "proto3";

// A single execution within a build.
message Invocation {
    // The program and its arguments to execute.
    repeated string argv = 1;
    // Any build args that should be set.
    map<string, string> build_args = 2;
}

// The runtime parameters of a build.
message CommandParameters {
    repeated Invocation invocations = 1;
    reserved 2 to 9;

    bool disable_networking = 10;
}
