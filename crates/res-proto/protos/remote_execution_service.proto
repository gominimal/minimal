syntax = "proto3";

import "google/protobuf/empty.proto";
import "create_build.proto";
import "upload.proto";
import "poll_build.proto";

service RemoteExecutionService {
  rpc CreateBuild(CreateBuildRequest) returns (CreateBuildResponse) {}

  rpc Upload(stream UploadMessage) returns (google.protobuf.Empty) {}

  rpc PollBuild(PollBuildRequest) returns (PollBuildResponse) {}
}
