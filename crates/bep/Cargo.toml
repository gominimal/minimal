[package]
name = "bep"
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
hex.workspace = true
hkdf.workspace = true
p256.workspace = true
rand.workspace = true
rcgen.workspace = true
# The GitHub sign-in's HTTP client (`github.rs`): `rustls` for the TLS to
# github.com and api.github.com.
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json_lenient.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The device flow's polling interval (`github.rs`).
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
security-framework.workspace = true
security-framework-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
rustls.workspace = true
tempfile.workspace = true

[lints.rust]
# `cfg(kani)` gates the proof harnesses in redeem/mod.rs; declare it so
# stable rustc's unexpected_cfgs lint accepts the attribute.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
