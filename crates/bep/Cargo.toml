[package]
name = "bep"
description = "Box Egress Proxy: credential modules and the sealed envelope a box carries in place of a credential."
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["secret-service"]
# The Secret Service client on Linux (`secret_items`), with the proxy's key
# store and the native secret store over it. `min` and the `bep` binary use
# it. A crate that takes only the modules and the forwarding types, as the
# guest's `minimald` does, turns it off and links no D-Bus client.
secret-service = ["dep:secret-service", "dep:zbus", "dep:zruntime"]

[[bin]]
name = "bep"
path = "src/main.rs"
required-features = ["secret-service"]

# These two start the `bep` binary.
[[test]]
name = "linux_custody"
required-features = ["secret-service"]

[[test]]
name = "linux_custody_tpm_integration"
required-features = ["secret-service"]

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
clap.workspace = true
# `bep serve` reads the client's `[secret-store-rules]` and checks them
# with the same reader and deny set as `min` (BEP-032, BEP-034). The reader
# lives in `client-config`, not `boxes`, so this crate does not link `common`.
client-config.workspace = true
getrandom.workspace = true
p256.workspace = true
paths.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
rcgen = "0.14"
time = "0.3"
rustls-pki-types = "1"
# The proxy's TLS legs (BEP-073) and its sockets.
rustls = "0.23"
rustls-native-certs = "0.8"
tokio = { workspace = true }
tokio-rustls = "0.26"
tokio-util = { workspace = true, features = ["io-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Secret Service over D-Bus (`secret_items`).
# rt-default: zbus runs on its own executor, which the crate's blocking
# interface drives, so no tokio runtime is involved.
# crypto-rust: the encrypted session that Secret Service providers offer
# (dh-ietf1024-sha256-aes128-cbc-pkcs7), with no OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "6.0.0", optional = true, default-features = false, features = ["rt-default", "crypto-rust"] }
zbus = { version = "6", optional = true, default-features = false, features = ["default-rt"] }
zruntime = { version = "0.2", optional = true, default-features = false, features = ["helper"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# OSX_10_15: the data-protection keychain, which holds a release build's
# Secure Enclave keys (`keys::keychain`).
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
# `test-util` (not in tokio's `full`) for `#[tokio::test(start_paused = true)]`:
# lets the head timeout elapse in virtual time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
