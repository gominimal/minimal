[package]
name = "bep"
description = "Box Egress Proxy: credential modules and the sealed envelope a box carries in place of a credential."
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11"
base64.workspace = true
getrandom = "0.3"
p256 = { version = "0.14", features = ["ecdh"] }
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize = "1"

[dev-dependencies]
proptest.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls"] }

[lints]
workspace = true
