[package]
name = "bep"
description = "Box Egress Proxy: credential modules and the sealed envelope a box carries in place of a credential."
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
clap.workspace = true
# `bep serve` reads the client's `[secret-store-rules]` and checks them
# with the same reader and deny set as `min` (BEP-032, BEP-034). The reader
# lives in `client-config`, not `boxes`, so this crate does not link `common`.
client-config.workspace = true
getrandom.workspace = true
p256.workspace = true
paths.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
rcgen = "0.14"
time = "0.3"
rustls-pki-types = "1"
# The proxy's TLS legs (BEP-073) and its sockets.
rustls = "0.23"
rustls-native-certs = "0.8"
tokio = { workspace = true }
tokio-rustls = "0.26"
tokio-util = { workspace = true, features = ["io-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# OSX_10_15: the data-protection keychain, which holds a release build's
# Secure Enclave keys (`keys::keychain`).
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
reqwest = { workspace = true, features = ["blocking", "rustls"] }

[lints]
workspace = true
