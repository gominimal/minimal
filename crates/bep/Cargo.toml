[package]
name = "bep"
description = "Box Egress Proxy: credential modules and the sealed envelope a box carries in place of a credential."
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
p256.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
rcgen = "0.14"
time = "0.3"
rustls-pki-types = "1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
reqwest = { workspace = true, features = ["blocking", "rustls"] }

[lints]
workspace = true
