syntax = "proto3";

// A request to download the outputs of a successfully completed build.
message DownloadRequest {
    // Identifies the build this DownloadRequest is for.
	message ID {
		oneof id {
			// client-provided identifier
			string client_id = 1;
			// RES-generated identifier
			string server_id = 2;
		}
	}
	// Identifies the build this DownloadRequest is for.
	ID id = 1;
}

// A chunk of a zstd-compressed tarball.
message DownloadData {
    bytes data = 1;
}
