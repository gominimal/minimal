[package]
name = "minimal-client"
description = "SSH client transport for talking to minimald over the UDS bridge, shared by the min CLI and the TUI"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-tar.workspace = true
constcat.workspace = true
indicatif.workspace = true
# `inquire` renders the host-side ask dialog (NET-045) on the real terminal
# while the relay is suspended, the same prompt library the CLI uses.
inquire.workspace = true
# `libc` is only for the winsize ioctls (TIOCGWINSZ/TIOCSWINSZ) in
# `tty_relay`: nix has no winsize helpers, and minimald's pty module set
# the same precedent.
libc.workspace = true
minimald-rpc.workspace = true
# `term` for openpty + termios, `poll` for the relay's poll(2) loop.  nix
# 0.31 gates its signal API (SigAction/killpg/raise) behind a `signal`
# feature this task does not add, so the relay wires its SIGWINCH/SIGINT/
# SIGTERM/SIGHUP handlers over `libc` instead.
nix = { workspace = true, features = ["term", "poll"] }
ot.workspace = true
paths.workspace = true
russh.workspace = true
serde.workspace = true
serde_json_lenient.workspace = true
sessions.workspace = true
tokio.workspace = true
tracing.workspace = true
version.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` (not in tokio's `full`) for `#[tokio::test(start_paused = true)]`:
# lets the client's handshake-deadline test elapse in virtual time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
