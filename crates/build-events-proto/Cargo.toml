[package]
name = "build-events-proto"
version = "0.0.1"
edition.workspace = true
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish.workspace = true

[dependencies]
build-events.workspace = true
tonic = "0.12.3"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }

# Use workspace spongebob crate instead of direct BSR imports
spongebob = { path = "../spongebob", optional = true }

# BSR proto dependencies for canonical spongebob.v1 types
minimal_spongebob_community_neoeinstein-prost = { version = "=0.4.0-20251014210131-30c82017bd87.1", registry = "buf" }
minimal_spongebob_community_neoeinstein-tonic = { version = "=0.4.1-20251014210131-30c82017bd87.1", registry = "buf" }

[features]
default = []
spongebob-subscriber = ["spongebob"]

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
