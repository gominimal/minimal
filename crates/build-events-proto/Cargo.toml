[package]
name = "build-events-proto"
version = "0.0.1"
edition.workspace = true
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish.workspace = true

[dependencies]
build-events.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }

# Use workspace spongebob crate instead of direct BSR imports
spongebob = { path = "../spongebob", optional = true }

# Need proto types for conversion when spongebob-subscriber feature is enabled
minimal_spongebob_community_neoeinstein-prost = { version = "=0.4.0-20251008233118-4a2c40ff6cb8.1", registry = "buf", optional = true }

[features]
default = []
spongebob-subscriber = ["spongebob", "minimal_spongebob_community_neoeinstein-prost"]

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
