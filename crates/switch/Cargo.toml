[package]
name = "switch"
description = "gvproxy-switch primitives: subnet arithmetic, MAC derivation, vsock constants, config rendering."
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The Box Egress Proxy's host-side stack peer (`bep_host`, NET-132). Off by
# default so the in-VM `minimald` build, which links this crate for the
# configuration renderer, pulls in neither smoltcp nor tokio; `minvmd` turns
# it on and wires the peer beside the switch.
stack-peer = ["dep:smoltcp", "dep:tokio", "dep:tracing"]
# The box-side client and channel-wired lane in `bep_host::test_util`: the
# scaffolding this crate's pool tests drive, and `minvmd`'s delivery tests
# reuse so they exercise the same delivery path against the real registry
# and the stand-in acceptor instead of re-implementing a TCP client.
test-util = ["stack-peer"]

[dependencies]
# The userspace TCP/IP stack the Box Egress Proxy's host leg runs over
# (`bep_host`): the leg terminates box connections on the switch subnet
# in-process, so the proxy's listener address never needs a host-kernel
# interface.
smoltcp = { workspace = true, optional = true }
# The peer's socket, channels and poll task.
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own test build turns its Box Egress Proxy feature on: the
# pool tests behind `bep_host` (NET-132/NET-133) are the crate's own, and
# `cargo test -p switch` must build them without carrying a `--features`
# flag everywhere. A dev-dependency only ever shapes this crate's own test
# and bench targets — never another crate's build — so the in-VM
# `minimald` build keeps linking the feature off, as the `stack-peer`
# comment above promises.
switch = { path = ".", features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
