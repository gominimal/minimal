[package]
name = "minimal"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[features]
# Off by default: gates the `mesh` and `ssh-forward` CLI subcommands. WireGuard
# mesh (UC7 / UC2b-A) and the SSH port-forward fallback are deferred for now; the
# daemon-side `direct-tcpip` handler is behind minimald's `ssh-forward` feature.
remote-access = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
camino.workspace = true
chrono.workspace = true
dirs.workspace = true
mctx.workspace = true
mfile.workspace = true
minimald-rpc.workspace = true
op.workspace = true
paths.workspace = true
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
sessions.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# default-features = false drops minvmd's `libkrun` feature: the CLI only uses
# the client helpers (sock/lifecycle) and calls no krun code, so it must not
# inherit libkrun's `#[link]` load command (would make it unloadable without
# libkrun).
minvmd = { path = "../minvmd", default-features = false }
ot.workspace = true

[dev-dependencies]
minimald = { path = "../minimald", features = ["test-support"] }
tempfile.workspace = true
# `test-util` (not in tokio's `full`) for `#[tokio::test(start_paused = true)]`:
# lets the client's handshake-deadline test elapse in virtual time.
tokio = { workspace = true, features = ["test-util"] }
