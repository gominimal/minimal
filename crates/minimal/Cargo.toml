[package]
name = "minimal"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The user-facing command is `min` — clap has said so since the CLI was named
# (`#[command(name = "min")]`), and the installer lays the binary down as
# `bin/min`. Name the binary target to match so the dev build agrees with what
# ships, instead of leaving `min` to be conjured by a rename at release time.
# Declaring a [[bin]] disables autodiscovery, so `src/main.rs` is now built
# ONLY as `min`; the `minimal` lib target is unaffected.
[[bin]]
name = "min"
path = "src/main.rs"

[features]
# Off by default: gates the `mesh` and `ssh-forward` CLI subcommands. WireGuard
# mesh (UC7 / UC2b-A) and the SSH port-forward fallback are deferred for now; the
# daemon-side `direct-tcpip` handler is behind minimald's `ssh-forward` feature.
remote-access = []

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-tar.workspace = true
clap.workspace = true
# `unstable-dynamic` buys the completion engine behind `min`'s runtime session
# completion. Three files depend on it:
#
#   completion.rs  `ArgValueCompleter` / `CompletionCandidate` — per-argument
#                  candidates computed by the binary itself.
#   main.rs        `CompleteEnv` — the entrypoint hook a completing shell
#                  re-enters the binary through.
#   lib.rs         `env::Shells` + `EnvCompleter::write_registration` — how
#                  `min completions <shell>` renders the registration shim.
#
# Unstable in the semver sense: exempt from clap_complete's stability guarantee
# and free to change under a minor bump. Those are the call sites to check when
# it does.
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
camino.workspace = true
chrono.workspace = true
diagnostics.workspace = true
dirs.workspace = true
nix.workspace = true
mctx.workspace = true
mfile.workspace = true
minimal-client.workspace = true
minimal-tui.workspace = true
minimald-rpc.workspace = true
op.workspace = true
paths.workspace = true
russh.workspace = true
serde.workspace = true
serde_json_lenient.workspace = true
sessions.workspace = true
# Staging for the `min bug` volume fallback: `debugfs -c` rdumps the guest's
# /logs into a temp dir before the readable files are tail-capped into the
# bundle.
tempfile.workspace = true
tokio.workspace = true
# Iterating `async_tar::Archive::entries()` (a `Stream`) for the bounded
# streaming verification of a nested guest bundle.
tokio-stream.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
version.workspace = true

# default-features = false drops minvmd's `libkrun` feature: the CLI only uses
# the client helpers (sock/lifecycle) and calls no krun code, so it must not
# inherit libkrun's `#[link]` load command (would make it unloadable without
# libkrun).
minvmd = { path = "../minvmd", default-features = false }
ot.workspace = true
inquire.workspace = true

[dev-dependencies]
minimald = { path = "../minimald", features = ["test-support"] }
# `test-util` (not in tokio's `full`) for `#[tokio::test(start_paused = true)]`:
# lets the client's handshake-deadline test elapse in virtual time.
tokio = { workspace = true, features = ["test-util"] }
