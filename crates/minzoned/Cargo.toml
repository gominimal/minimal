[package]
name = "minzoned"
description = "The host's box-name service (DNS and addresses for boxes), linked without libkrun, that the privileged step installs."
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "minzoned"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
version.workspace = true
# default-features = false drops minvmd's `libkrun` feature, so this program
# carries no libkrun load command: the service manager runs it from a
# root-owned copy, and a dylib it resolved through an rpath into a
# user-writable dir would hand that copy to whoever can write there.
minvmd = { path = "../minvmd", default-features = false }

[lints]
workspace = true
