[upstream]
dir = "../fakepkgs"

[tasks.task-smoketest]
packages = ["uroot"]
bash = """
echo 'env:' && env && echo "pwd: $(pwd)"
"""

[tasks.task-interpolation-test]
interactive = true
args.input = "string"
packages = ["uroot"]
exec = """
/bin/sh -c echo "val: %{input}"
"""

[tasks.print-date]
packages = ["uroot"]
exec = "/bbin/date"
