# Standalone fuzz workspace for the `mfile` crate.
[package]
name = "mfile-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mfile]
path = ".."

[[bin]]
name = "mfile_from_toml"
path = "fuzz_targets/mfile_from_toml.rs"
test = false
doc = false
bench = false

[workspace]
