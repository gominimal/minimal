# Byte copy of example-minimal.toml from gominimal/arch at 15b603e6afb8df404fb9cbe246322052c4731998.
# example-minimal.toml — canonical example of the minimal.toml layout.
# Reference: architecture.md "minimal.toml layout". Each entry below expands,
# together with its Box Type, [defaults] and [upstream], into a full Box Spec
# (box.toml).
# (This is documentation; the minimal.toml at this repo's root is the live one
# used to create this project's dev box.)

[upstream]
repo_url = "https://github.com/gominimal/pkgs"
branch = "main"
commit = "defad31c69130df153e9263cb1e4dca96b3e2994"
build_cache_url = "https://cache.gominimal.dev"

[defaults]
# Merged into every entry: lists union (entry values appended), scalars and
# tables are overridden by the entry.
packages = ["base"]
network = { mode = "none" }

# ---- a Box Type defined by this project -------------------------------------
# Types are named bundles of defaults and constraints. `defaults` join expansion
# and may be overridden by an entry; `constraints` join enforcement and only
# narrow — a type can never grant what another layer denies.

[box_types.batch-agent]
description = "Headless agent run: no PTY, bounded, no nesting"
extends = "agent"

  [box_types.batch-agent.defaults]
  timeout = "30m"
  github_token_mode = "installation"   # this type's GitHub grants default to app-attributed tokens (Gatehouse §6.4)
  network = { mode = "own_ip" }   # a starting value, not a guarantee: [defaults]
                                  # outranks type defaults, so in *this* file the
                                  # tighter mode = "none" wins and an entry that
                                  # wants the network must say so itself

  [box_types.batch-agent.constraints]
  pty_enabled = false             # narrows agent's default, which an entry could set true
  nesting = { allowed = false }   # narrows the true inherited from `agent`

# ---- interactive sessions (PTY) ---------------------------------------------

[sessions.dev]
description = "Everyday interactive dev shell"
packages = ["mermaid-cli", "emacs", "emacs-config-dev1", "kittyview", "claude-code", "less"]
exec = "bash --noprofile -l"
loadout_mode = "open"
volumes = ["dev"]
network = { mode = "own_ip", egress = { allow_dns_hosts = ["github.com", "api.anthropic.com"] } }

# ---- non-interactive tasks (run to completion) ------------------------------

[tasks.render-diagrams]
description = "Render the mermaid diagrams in architecture.md to SVG"
packages = ["mermaid-cli"]
exec = "mmdc -i architecture.md -o out/"
file_imports = [{ path = "architecture.md" }]
file_exports = [{ path = "out/" }]

# ---- agent boxes (long-lived, may nest, brokered credentials) ---------------

[agents.reviewer]
description = "Claude Code reviewing this repo"
packages = ["git", "claude-code"]
exec = "claude -p 'review the open PRs'"
github_imports = [{ repo = "https://github.com/user-name/repo-name", ref = "main" }]
network = { mode = "own_ip", egress = { allow_dns_hosts = ["api.anthropic.com", "github.com", "api.github.com", "uploads.github.com", "codeload.github.com"] } }
# Agents default to user-mode GitHub tokens: repo/permission-narrowed,
# attributed to the developer (Gatehouse §6.4; scope grammar §5.8). A GitHub
# broker grant requires the module's full host set in egress (§6.10).
secrets = { GITHUB_TOKEN = { source = "broker", scopes = ["github:repo:user-name/repo-name:contents:ro"] } }
nesting = { allowed = true, max_depth = 2, providers = ["local-box"] }

# ---- a box of a project-defined type ----------------------------------------
# [boxes.<name>] is the general form; [agents.<name>] above is sugar for it with
# type = "agent". A user-defined type has no CLI noun, so this one is driven with
# `min box start nightly`.

[boxes.nightly]
type = "batch-agent"
description = "Nightly repo triage; inherits the batch-agent bounds"
packages = ["git", "jq", "claude-code"]
github_imports = [{ repo = "https://github.com/user-name/repo-name", ref = "main" }]
# Memory (architecture "Box Resources", [proposed]): omitted, `ram` is "auto", the
# host's default box size. Write a size only when the workload needs one — the box
# then gets exactly that limit or is refused on a host that cannot hold it:
# ram = "12GiB"
# Tables are replaced, not merged, so this entry restates `mode` — without it the
# box would expand with [defaults]'s mode = "none" and reach nothing.
network = { mode = "own_ip", egress = { allow_dns_hosts = ["api.anthropic.com", "github.com"] } }
# `inference:invoke` is a tenant-defined audience scope (Gatehouse §5.8): the broker
# mints a Gatehouse-issued, audience-bound token via re-audience exchange — not the
# third party's native credential (that is outbound XAA, reserved). Requires the tenant
# to have registered an `inference` Audience; brokering rides the ExchangeToken baseline
# (Gatehouse §7.3), and no `mode` applies (that is a GitHub-only distinction).
secrets = { ANTHROPIC_API_KEY = { source = "broker", scopes = ["inference:invoke"] } }
file_exports = [{ path = "out/triage.json" }]

# ---- services (run until stopped, may expose ingress) -----------------------

[services.docs-preview]
description = "Serve the rendered docs on :8080"
packages = ["caddy"]
exec = "caddy file-server --root out --listen :8080"
network = { mode = "own_ip", ingress = [{ proto = "tcp", port = 8080 }] }
