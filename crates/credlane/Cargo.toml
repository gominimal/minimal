[package]
name = "credlane"
version = "0.0.1"
rust-version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
# The control socket's runtime dir falls back to the home directory.
dirs.workspace = true
hex.workspace = true
# `SIGTERM` to a supervised broker child before the escalation to `SIGKILL`.
libc.workspace = true
rand.workspace = true
# Not the workspace `rustls`/`tokio-rustls` pins: those select `ring`, which
# minimald installs explicitly behind its non-default `networking-proxy`
# feature. `reqwest` puts `aws-lc-rs` in every build unconditionally, so
# inheriting the pins would add a second provider to a default build and leave
# rustls unable to pick one process-wide.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "std",
] }
rustls-platform-verifier.workspace = true
serde = { workspace = true, features = ["derive"] }
# The control protocol's framing: one line of JSON each way.
serde_json_lenient.workspace = true
# `NetworkMode`: the endpoint a box is handed follows from its network mode.
sessions.workspace = true
switch.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
    "logging",
] }
tracing.workspace = true
# `serde`: a registered lane's bound upstream crosses the control socket as a
# `Url`, so the wire type parses it rather than carrying a bare string that
# every reader would have to re-validate.
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Only the R2.2a test needs it: proving the control socket lands outside the
# state tree sandboxes bind-mount from.
paths.workspace = true
tempfile.workspace = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
