[package]
name = "credlane"
version = "0.0.1"
rust-version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
hex.workspace = true
rand.workspace = true
# Not the workspace `rustls`/`tokio-rustls` pins: those select `ring`, which
# minimald installs explicitly behind its non-default `networking-proxy`
# feature. `reqwest` puts `aws-lc-rs` in every build unconditionally, so
# inheriting the pins would add a second provider to a default build and leave
# rustls unable to pick one process-wide.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "std",
] }
rustls-platform-verifier.workspace = true
serde = { workspace = true, features = ["derive"] }
# `NetworkMode`: the endpoint a box is handed follows from its network mode.
sessions.workspace = true
switch.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
    "logging",
] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
serde_json_lenient.workspace = true
tempfile.workspace = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
