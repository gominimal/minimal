name: macOS queue janitor

# Cancels ci-macos.yml merge-queue runs whose queue group no longer exists.
# ci-macos.yml keys its concurrency on github.ref, and a group's ref
# (gh-readonly-queue/main/pr-N-<base sha>) is new on every rebuild, so a
# rebuild never cancels the previous group's run; GitHub expressions have no
# split or regex to key the group on the PR number instead. Orphaned runs then
# hold the single self-hosted macOS runner ahead of every live group, pushing
# the queue past its check timeout and into more rebuilds.
#
# Advisory housekeeping: never add this job to the required checks.
#
# All the logic lives in scripts/cancel-stale-queue-runs.sh so it can be run
# and tested outside CI; this workflow is the triggers and the token.
#
# No merge_group or workflow_dispatch trigger: a merge_group run takes its
# workflow definition from the group commit, and a dispatch can name any
# pushed branch, so either would let unmerged code run this job while it
# holds actions:write. Both triggers below run main's definition and main's
# script.

on:
    # A new ci-macos.yml run is requested, which is exactly when a group
    # rebuild leaves the previous group's run orphaned.
    # workflow_run is safe here: the job checks out main (the default for this
    # event), never the triggering run's ref, artifacts or outputs, and reads
    # nothing from the event beyond its `event` name.
    workflow_run: # zizmor: ignore[dangerous-triggers] runs main's checkout only; nothing from the triggering run is executed or read beyond its event name
        workflows: ["CI (macOS)"]
        types: [requested]
    schedule:
        # Backstop for a rebuild whose orphan outlives the request above.
        - cron: "*/10 * * * *"

# Cancelling runs needs actions:write; the merge-queue query reads the repo.
permissions:
    actions: write
    contents: read

# Never let two janitor runs race over the same run list.
concurrency:
    group: macos-queue-janitor
    cancel-in-progress: false

jobs:
    reap:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Only a requested merge-queue run can orphan another; skip the rest.
        if: >-
            github.repository == 'gominimal/minimal' &&
            (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'merge_group')
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Cancel stale macOS merge-queue runs
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              # A dry run is `scripts/cancel-stale-queue-runs.sh` without
              # --execute, run locally with a user token.
              run: scripts/cancel-stale-queue-runs.sh --workflow ci-macos.yml --branch main --execute
