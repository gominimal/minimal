name: CI gvproxy

# Fetches the pinned pre-built gvproxy switch binary (gvisor-tap-vsock) and
# verifies its SHA-256 against vendor/gvproxy/gvproxy.lock. No build, no Go
# toolchain — the upstream release binary is downloaded and checksum-verified
# (architecture assumption gvproxy-source-build, amended to a pinned pre-built
# binary with checked-in digests).
on:
  pull_request:
    branches: ["main"]
    paths:
      - "vendor/gvproxy/**"
      - "scripts/fetch-gvproxy.sh"
      - ".github/workflows/ci-gvproxy.yml"
  push:
    branches: ["main"]
    paths:
      - "vendor/gvproxy/**"
      - "scripts/fetch-gvproxy.sh"
      - ".github/workflows/ci-gvproxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gvproxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and verify pinned gvproxy binary
        run: bash scripts/fetch-gvproxy.sh "${RUNNER_TEMP}/gvproxy"
      - name: Record pinned version + digest
        run: |
          {
            echo "### gvproxy (pinned pre-built)"
            echo ""
            echo "- version: \`$(sed -n 's/^version=//p' vendor/gvproxy/gvproxy.lock)\`"
            echo "- linux-amd64 sha256: \`$(sha256sum "${RUNNER_TEMP}/gvproxy" | awk '{print $1}')\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload gvproxy binary
        uses: actions/upload-artifact@v4
        with:
          name: gvproxy-linux-amd64
          path: ${{ runner.temp }}/gvproxy
          if-no-files-found: error
