name: CI (Linux KVM)

# minvmd Linux/KVM end-to-end on a GitHub-hosted runner (#410, #411).
#
# Split from ci.yml and PATH-SCOPED so it runs only when the minvmd surface
# changes. It needs no preprovisioned runner — KVM is available on GitHub-hosted
# x86_64 Linux runners, and libkrun is materialized from the upstream package
# cache (a cache fetch keyed by the pinned locked_commit, NOT a from-source
# build) alongside the guest kernel + rootfs.
#
# x86_64 ONLY: GitHub-hosted arm64 runners (ubuntu-24.04-arm) do not expose
# /dev/kvm, so the Linux/KVM e2e can only run on x86_64. aarch64 + libkrun boot
# is already covered by the macOS lane (ci-macos.yml, Apple Silicon / HVF).
#
# NON-GATING: absent from ci.yml's `ci-success`, so a KVM/runner hiccup never
# blocks a PR. The boot/session/bridge e2e tests assert correctness; the daemon
# lifecycle step exercises `run --detach`/`status`/`stop`; the latency benchmark
# is informational.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/minvmd/**"
      - "crates/minimald/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".minimal/minimal.toml"
      - ".github/workflows/ci-linux-kvm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/minvmd/**"
      - "crates/minimald/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".minimal/minimal.toml"
      - ".github/workflows/ci-linux-kvm.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs so the e2e job isn't queued on stale commits.
concurrency:
  group: ci-linux-kvm-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  minvmd-linux-kvm-e2e:
    runs-on: ubuntu-latest # x86_64; KVM-capable
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        # protoc + libprotobuf-dev: the `minimal` CLI (materialize) build. The
        # well-known protos (google/protobuf/*.proto) live in libprotobuf-dev,
        # which protobuf-compiler only pulls via recommends — so name it
        # explicitly since we use --no-install-recommends. cpio: packs the guest
        # initramfs (scripts/build-initramfs.sh). git: source fetches during the
        # CLI build. libkrun no longer builds from source here, so its old kernel
        # /bindgen toolchain (flex/bison/bc/libelf/clang/patchelf/…) is gone.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            cpio git

      - name: Enable /dev/kvm access
        # GitHub-hosted x86_64 Linux runners expose /dev/kvm but the runner user
        # is not in the `kvm` group; widen the node so libkrun can open it. Fail
        # fast with a clear message if this runner has no KVM at all.
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not present on this runner; cannot run the Linux/KVM e2e." >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Resolve build paths
        # Publish the libkrun prefix and guest-artifact paths (plus the E2E gate)
        # to $GITHUB_ENV for later steps; `runner.temp`/`$HOME` are not available
        # in job-level `env:`.
        run: |
          {
            echo "KRUN_PREFIX=$HOME/.krun"
            echo "MINVMD_E2E=1"
            echo "MINVMD_KERNEL_PATH=$RUNNER_TEMP/vmlinuz"
            echo "MINVMD_ROOTFS_PATH=$RUNNER_TEMP/rootfs.img"
            echo "MINVMD_INITRAMFS=$RUNNER_TEMP/initramfs.cpio"
          } >> "$GITHUB_ENV"

      - name: Export libkrun link + runtime paths
        # LIBKRUN_PREFIX: minvmd build.rs link-search dir (it emits an rpath to
        # it too). LD_LIBRARY_PATH: libkrun.so -> libkrunfw.so.5 at runtime. Both
        # point at the flat prefix that the materialize step below populates.
        run: |
          {
            echo "LIBKRUN_PREFIX=$KRUN_PREFIX"
            echo "LD_LIBRARY_PATH=$KRUN_PREFIX${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-minvmd-kvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-x86_64-minvmd-kvm-

      - name: Materialize libkrun prefix (upstream package)
        # Cache fetch of the upstream libkrun package (libkrun.so + libkrunfw.so.5),
        # extracted into $KRUN_PREFIX. Runs after the cargo cache restore so the
        # `minimal` CLI build it drives is incremental.
        run: ./scripts/fetch-libkrun.sh "$KRUN_PREFIX" x86_64

      - name: Materialize guest kernel (raw Image)
        run: ./scripts/fetch-artifact.sh virtio-kernel "$RUNNER_TEMP/vmlinuz" x86_64

      - name: Materialize guest rootfs (ext4 image)
        run: ./scripts/fetch-artifact.sh minvmd-rootfs "$RUNNER_TEMP/rootfs.img" x86_64

      - name: Build guest initramfs (minimald as /init)
        run: ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs.cpio" x86_64-unknown-linux-musl

      - name: Build minvmd
        run: cargo build -p minvmd --bin minvmd

      - name: Boot E2E (READY round-trip, R3.1)
        env:
          MINVMD_BOOT_LOG: ${{ runner.temp }}/boot.log
        run: cargo test -p minvmd --test boot_e2e -- --include-ignored --nocapture

      - name: Session E2E (full minimald session over the bridge)
        run: cargo test -p minvmd --test minimald_session_e2e -- --include-ignored --nocapture --exact minimald_exec_over_bridge

      # NOTE: bridge_e2e is intentionally NOT run here. It targets the Stage-1
      # guest "vsock stub" (a socat/cat echo on port 2222) that minimald-as-pid1
      # replaced with a direct SSH session server, so it now reads back the SSH
      # banner instead of its echo payload. The macOS lane likewise runs only
      # boot_e2e + minimald_session_e2e; session coverage of the bridge is
      # provided by Session E2E above plus the daemon lifecycle step below.

      - name: Daemon lifecycle (run --detach → status → stop, R4.2/R4.3/R4.4)
        # Exercises the supervised daemon path that manages state.toml lifecycle,
        # which the raw `boot` e2e tests above do not cover.
        env:
          MINVMD_BOOT_LOG: ${{ runner.temp }}/boot-daemon.log
        run: |
          set -euo pipefail
          BIN=target/debug/minvmd

          echo "::group::run --detach"
          "$BIN" run --detach --timeout 30
          echo "::endgroup::"

          echo "::group::status (expect running)"
          # `run --detach` returns once the host UDS accepts connections, which
          # libkrun opens early in VM setup — slightly ahead of the supervisor's
          # Starting->Running transition (set after the guest READY marker). Poll
          # status (up to ~15s) for Running rather than asserting immediately.
          # jq parses structurally (preinstalled on GitHub runners) so the check
          # doesn't break on harmless JSON formatting changes.
          for _ in $(seq 1 75); do
            "$BIN" status --json > status.json || true
            if jq -e '.state == "running" and (.vmm_pid | type == "number")' status.json >/dev/null; then
              break
            fi
            sleep 0.2
          done
          cat status.json
          "$BIN" status   # exit 0 == Running
          jq -e '.state == "running" and (.vmm_pid | type == "number")' status.json
          echo "::endgroup::"

          echo "::group::stop"
          "$BIN" stop
          echo "::endgroup::"

          echo "::group::status (expect stopped)"
          # `status`/`status --json` exit 1 when stopped (documented), so capture
          # without tripping set -e / pipefail, then assert structurally.
          "$BIN" status --json > status-after.json || true
          cat status-after.json
          jq -e '.state == "stopped"' status-after.json
          # Also confirm the documented non-zero exit for the stopped state.
          if "$BIN" status; then echo "::error::expected non-zero status exit after stop"; exit 1; fi
          echo "::endgroup::"

          echo "daemon lifecycle OK"

      - name: Boot latency benchmark (informational)
        # Report boot-to-READY min/median/max. Non-gating (correctness is gated
        # by the e2e tests above), so a timing hiccup never reds the build.
        run: scripts/bench-minvmd-boot.sh 10 target/debug/minvmd || true

      - name: Upload guest boot console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minvmd-linux-boot-log-x86_64
          path: |
            ${{ runner.temp }}/boot.log
            ${{ runner.temp }}/boot-daemon.log
          if-no-files-found: ignore
