name: CI (macOS)

# Split from ci.yml so it can be PATH-SCOPED: the single self-hosted Apple
# Silicon runner (`jks-Mac-mini`) is a shared bottleneck, so only run it when
# the macOS-relevant surface changes. Most PRs touch no minvmd code and skip
# this workflow entirely, keeping the runner free.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/minvmd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-macos.yml"
      - "scripts/**"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/minvmd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-macos.yml"
      - "scripts/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel a superseded run so the single runner isn't backed up by stale commits.
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: this workflow only checks out and builds.
permissions:
  contents: read

jobs:
  virtio-kernel:
    # Pull the prebuilt virtio-linux kernel (vmlinuz / Image.gz) from the public
    # minimal build cache — no kernel build, no GCS auth — and hand it to the
    # macOS boot job. The packaging `minimal` CLI is Linux-only, so this runs on
    # Linux. Cheap (a cache pull), so it is unconditional and decoupled from the
    # self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch virtio-linux kernel from the build cache
        run: ./scripts/fetch-virtio-kernel.sh "$RUNNER_TEMP/vmlinuz" aarch64
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtio-kernel-aarch64
          path: ${{ runner.temp }}/vmlinuz
          if-no-files-found: error

  boot-e2e:
    # Boot E2E (R2.4 READY round-trip) on real hardware, using the cache-pulled
    # kernel and the real minvmd guest rootfs (Alpine + READY-writer stub).
    # Separate from build-macos so a kernel-fetch hiccup never blocks the
    # always-green clippy/test/smoke checks.
    #
    # GATING: green on the runner — kernel PE_GZ load, virtio-fs root,
    # /init.krun exec of the stub, and the guest READY connect-out on vsock 7350
    # (krun_add_vsock_port == listen=false; host + guest both 7350). See #326.
    if: ${{ vars.RUN_MACOS_CI != 'false' }}
    needs: virtio-kernel
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify libkrun is available
        run: |
          if [ ! -f /opt/homebrew/lib/libkrun.dylib ]; then
            echo "::error::libkrun.dylib not found under /opt/homebrew/lib. Provision the runner with: brew install slp/krun/libkrun" >&2
            exit 1
          fi
      - name: Download virtio-linux kernel
        uses: actions/download-artifact@v4
        with:
          name: virtio-kernel-aarch64
          path: ${{ runner.temp }}/kernel
      - name: Stage minvmd guest rootfs
        # Real R2.2 rootfs: fetch the pinned Alpine minirootfs and overlay socat
        # + the READY-writer stub (/sbin/minvmd-stub-init) via build-rootfs.sh.
        # A setup failure fails the job — it is not hidden behind the non-gating
        # test below.
        run: scripts/build-rootfs.sh
      - name: Build boot + bridge E2E + minvmd (no run)
        # Build both test harnesses + the minvmd bin, then codesign, then run the
        # test BINARIES DIRECTLY (below). Invoking `cargo test` again after
        # signing relinks (and unsigns) target/debug/minvmd, so krun_start_enter
        # fails with EINVAL. A direct-binary run never touches the signature, so
        # both binaries must be built here before the single codesign.
        run: cargo test -p minvmd --test boot_e2e --test bridge_e2e --no-run
      - name: Codesign minvmd (hypervisor entitlement, R1.4)
        run: codesign --entitlements crates/minvmd/minvmd.entitlements --force -s - target/debug/minvmd
      - name: Boot E2E (READY round-trip)
        # Gating: a real Alpine microVM must boot and the guest must write READY
        # over vsock 7350 within the budget. Also validates the virtio-linux
        # kernel config (virtio-MMIO / VIRTIO_FS / VSOCK / HVC).
        run: |
          testbin="$(ls -1t target/debug/deps/boot_e2e-* | grep -v '\.d$' | head -1)"
          test -x "$testbin" || { echo "::error::boot_e2e test binary not found"; exit 1; }
          MINVMD_E2E=1 \
          MINVMD_KERNEL_PATH="$RUNNER_TEMP/kernel/vmlinuz" \
          MINVMD_ROOTFS_PATH="$(scripts/build-rootfs.sh --print-path)" \
          MINVMD_BOOT_LOG="$RUNNER_TEMP/boot.log" \
            "$testbin" --include-ignored --nocapture
      - name: Bridge E2E (concurrent UDS↔vsock round-trip)
        # Gating (R3.3, R3.4): boots a real microVM, opens 5 concurrent host UDS
        # connections to the minimald bridge socket, and asserts each payload
        # round-trips through the libkrun UDS↔vsock bridge. Runs the prebuilt
        # binary directly so the codesigned minvmd (CARGO_BIN_EXE_minvmd) keeps
        # its hypervisor entitlement. The test isolates XDG_RUNTIME_DIR per run.
        run: |
          testbin="$(ls -1t target/debug/deps/bridge_e2e-* | grep -v '\.d$' | head -1)"
          test -x "$testbin" || { echo "::error::bridge_e2e test binary not found"; exit 1; }
          MINVMD_E2E=1 \
          MINVMD_KERNEL_PATH="$RUNNER_TEMP/kernel/vmlinuz" \
          MINVMD_ROOTFS_PATH="$(scripts/build-rootfs.sh --print-path)" \
            "$testbin" --include-ignored --nocapture
      - name: Upload guest boot console log
        # Capture hvc0 output for diagnosing a stuck/failed boot (e.g. a missing
        # virtio driver in the kernel). Always runs so a red boot is debuggable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minvmd-boot-log
          path: ${{ runner.temp }}/boot.log
          if-no-files-found: ignore

  build-macos:
    # Self-hosted Apple Silicon runner. minvmd links libkrun
    # (`#[link(name = "krun")]`) and only compiles on macOS — the Linux CI
    # builds it as a stub. Real hardware, so the hypervisor-backed FFI smoke
    # runs here; GitHub-hosted macOS VMs can't. Scoped to minvmd, the only
    # macOS-gated crate; widen to --workspace once the tree is mac-buildable.
    #
    # Gated on the RUN_MACOS_CI repo variable (defaults to enabled when unset).
    # `timeout-minutes` counts time queued for a runner, so set
    # RUN_MACOS_CI=false to skip while the runner is offline.
    if: ${{ vars.RUN_MACOS_CI != 'false' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Don't leave git credentials on the persistent self-hosted runner.
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify libkrun is available
        # libkrun must be preprovisioned on the runner (it ships from the
        # third-party slp/krun tap, github.com/slp/homebrew-krun). CI does not
        # install it: auto-installing a third-party tap on a persistent runner
        # is a supply-chain risk and would require bypassing Homebrew's tap
        # trust. Provisioning is part of runner setup: `brew install slp/krun/libkrun`.
        run: |
          if [ ! -f /opt/homebrew/lib/libkrun.dylib ]; then
            echo "::error::libkrun.dylib not found under /opt/homebrew/lib. Provision the runner with: brew install slp/krun/libkrun" >&2
            exit 1
          fi
          ls -l /opt/homebrew/lib/libkrun*.dylib
      - name: Clippy (minvmd)
        run: cargo clippy -p minvmd --all-targets -- -D warnings
      - name: Test (minvmd)
        run: cargo test -p minvmd
      - name: FFI smoke against real libkrun (no VM boot)
        # Exercises create_ctx -> set_vm_config -> set_exec through the safe
        # wrappers. Skips krun_start_enter (no kernel/rootfs), so it needs no
        # codesigned hypervisor entitlement.
        run: MINVMD_E2E=1 cargo test -p minvmd --test krun_smoke -- --include-ignored
