name: CI (macOS)

# Split from ci.yml so it can be PATH-SCOPED: the single self-hosted Apple
# Silicon runner (`jks-Mac-mini`) is a shared bottleneck, so only run it when
# the macOS-relevant surface changes. Most PRs touch no minvmd code and skip
# this workflow entirely, keeping the runner free.
on:
    push:
        branches: ["main"]
        paths:
            - "crates/minvmd/**"
            - "crates/minimald/**" # guest daemon: runs as pid-1 in the e2e/boot VM
            - "crates/minimal/**"
            - "crates/sessions/**" # platform-sensitive: canonicalization, symlinks
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/ci-macos.yml"
            - "scripts/**"
            # Composite actions this lane's setup runs through — without these,
            # a composite-only edit would skip this lane and break it post-merge.
            - ".github/actions/setup-libkrun-macos/**"
            - ".github/actions/materialize/**"
            # The libkrun pin: a bump must rebuild + re-run the hypervisor e2e.
            - "vendor/libkrun/**"
    pull_request:
        branches: ["main"]
        paths:
            - "crates/minvmd/**"
            - "crates/minimald/**" # guest daemon: runs as pid-1 in the e2e/boot VM
            - "crates/minimal/**"
            - "crates/sessions/**" # platform-sensitive: canonicalization, symlinks
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/ci-macos.yml"
            - "scripts/**"
            # Composite actions this lane's setup runs through — without these,
            # a composite-only edit would skip this lane and break it post-merge.
            - ".github/actions/setup-libkrun-macos/**"
            - ".github/actions/materialize/**"
            # The libkrun pin: a bump must rebuild + re-run the hypervisor e2e.
            - "vendor/libkrun/**"
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

# Cancel a superseded run so the single runner isn't backed up by stale commits.
concurrency:
    group: ci-macos-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: this workflow only checks out and builds.
permissions:
    contents: read

jobs:
    artifacts:
        # Build the `minimal` CLI from THIS repo's sources, then materialize the
        # guest kernel + rootfs against the repo's own .minimal/minimal.toml. Both
        # are cache pulls keyed by the pinned upstream commit (not compiles): the
        # upstream virtio-kernel-raw / microvm-rootfs packages' prebuilt aarch64
        # artifacts are in the public cache, so they pull fine on a cheap x86_64
        # Linux runner — no native arm64 build and no self-hosted runner needed.
        # The initramfs build cross-compiles minimald for aarch64-musl (~30 s with
        # the fast `initramfs` profile, then cached by actions/cache), so the timeout
        # has headroom.
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install protoc
              run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
            - name: Cache cargo + build artifacts (incl. the aarch64 cross target)
              # Raw actions/cache (not Swatinem) — it preserves the full
              # target/aarch64-unknown-linux-musl tree, so the initramfs cross-compile
              # is incremental after the first run.
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-stage2-artifacts-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-stage2-artifacts-
            - name: Materialize guest kernel (raw Image)
              uses: ./.github/actions/materialize
              with:
                  output: virtio-kernel
                  dest: ${{ runner.temp }}/vmlinuz
                  arch: aarch64
                  channel: unstable
            - name: Materialize guest rootfs (ext4 image)
              uses: ./.github/actions/materialize
              with:
                  output: minvmd-rootfs
                  dest: ${{ runner.temp }}/rootfs.img
                  arch: aarch64
                  channel: unstable
            - name: Install cross
              uses: taiki-e/install-action@v2
              with:
                  tool: cross
            - name: Build guest initramfs (minimald as /init)
              # Cross-compile minimald to static aarch64 + pack as the initramfs /init.
              # The guest rootfs stays generic; minimald is delivered by the initramfs,
              # not baked into the rootfs.
              run: ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs.cpio"
            - name: Upload kernel artifact
              uses: actions/upload-artifact@v7
              with:
                  name: virtio-kernel-aarch64
                  path: ${{ runner.temp }}/vmlinuz
                  if-no-files-found: error
            - name: Upload rootfs artifact
              uses: actions/upload-artifact@v7
              with:
                  name: minvmd-rootfs-aarch64
                  path: ${{ runner.temp }}/rootfs.img
                  if-no-files-found: error
            - name: Upload initramfs artifact
              uses: actions/upload-artifact@v7
              with:
                  name: minimald-initramfs-aarch64
                  path: ${{ runner.temp }}/initramfs.cpio
                  if-no-files-found: error

    e2e:
        # Hypervisor E2E on real hardware, using the cache-pulled kernel + rootfs
        # ext4 image and the built initramfs (all from the `artifacts` job). One
        # job (formerly boot-e2e + autospawn-e2e) so the single shared runner
        # checks out, builds, and codesigns exactly once per run. Separate from
        # build-macos so an artifact-fetch hiccup never blocks the always-green
        # clippy/test/smoke checks.
        #
        # GATING: green on the runner — raw kernel load (KRUN_KERNEL_FORMAT_RAW),
        # initramfs boot (minimald as `/init`, pid-1), minimald mounting the ext4
        # rootfs (/dev/vda via krun_add_disk2) + chrooting, the guest READY
        # connect-out on vsock 7350, and the full vsock session round-trip
        # (direct run_on_vsock; needs libkrun >= 1.19.0). The Session E2E step
        # boots the same kernel/rootfs/initramfs through the same HVF path as the
        # retired standalone boot test and goes further (russh auth + exec,
        # stdout + exit status), so a passing session gates the boot. The
        # unified session e2e (scripts/session-e2e.sh) then covers the R4.5
        # CLI proof and more: from a clean state `minimal activate` must
        # auto-spawn minvmd and a real session exec must round-trip — the
        # macOS integration gate that no unit test can cover.
        if: ${{ vars.RUN_MACOS_CI != 'false' }}
        needs: [artifacts]
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Provision libkrun (pinned own build)
              uses: ./.github/actions/setup-libkrun-macos
            - name: Download virtio-linux kernel
              uses: actions/download-artifact@v8
              with:
                  name: virtio-kernel-aarch64
                  path: ${{ runner.temp }}/kernel
            - name: Download minvmd-rootfs image
              uses: actions/download-artifact@v8
              with:
                  name: minvmd-rootfs-aarch64
                  path: ${{ runner.temp }}/rootfs
            - name: Download guest initramfs
              uses: actions/download-artifact@v8
              with:
                  name: minimald-initramfs-aarch64
                  path: ${{ runner.temp }}/initramfs
            - name: Build session harness + minvmd + minimal (no run)
              # Build EVERYTHING before the single codesign, then run the test
              # BINARIES DIRECTLY (below). Any cargo invocation after signing
              # relinks (and unsigns) target/debug/minvmd, so krun_start_enter
              # fails with EINVAL. minimal spawns `minvmd` by name from PATH; only
              # minvmd needs the hypervisor entitlement.
              run: |
                  cargo test -p minvmd --test minimald_session_e2e --no-run
                  cargo build -p minvmd --bin minvmd
                  # SEPARATE invocation for the CLI (mirrors release.yml): built
                  # together, cargo unifies minvmd's default `libkrun` feature
                  # into minimal's default-features=false opt-out, and the CLI
                  # links libkrun. The brew era masked this (absolute install
                  # name loaded from anywhere); our @rpath dylib turns it into
                  # dyld "Library not loaded" at autospawn, since minimal bakes
                  # no rpaths.
                  cargo build -p minimal --bin minimal
            - name: Verify minimal links only system libraries
              # The CLI spawns minvmd as a subprocess and calls no libkrun; a
              # krun load command means the feature unification above regressed.
              # Catch it here with a clear message, not as a dyld error mid-e2e.
              run: |
                  bad="$(otool -L target/debug/minimal | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^(/usr/lib/|/System/)' || true)"
                  if [ -n "$bad" ]; then
                    echo "::error::minimal links non-system libraries (feature unification with minvmd's libkrun?):" >&2
                    printf '%s\n' "$bad" >&2
                    exit 1
                  fi
            - name: Codesign minvmd (hypervisor entitlement, R1.4)
              run: codesign --entitlements crates/minvmd/minvmd.entitlements --force -s - target/debug/minvmd
            - name: Session E2E (boot + full session over the bridge)
              # Gating: boots the GENERIC upstream rootfs with minimald shipped as the
              # initramfs /init; a russh client over the bridge authenticates, creates
              # a session, and execs a command, asserting stdout + exit status. Proves
              # the full Stage-2 path (direct vsock session via run_on_vsock, no socat
              # relay) with no minimald baked into the rootfs. Needs libkrun >= 1.19.0
              # on the runner. Also gates boot correctness (formerly a standalone
              # boot_e2e run): the session boots the identical kernel/rootfs/initramfs
              # through the same HVF path, and MINVMD_BOOT_LOG captures the hvc0
              # console so a stuck/failed boot stays diagnosable.
              run: |
                  testbin="$(ls -1t target/debug/deps/minimald_session_e2e-* | grep -v '\.d$' | head -1)"
                  test -x "$testbin" || { echo "::error::minimald_session_e2e test binary not found"; exit 1; }
                  MINVMD_E2E=1 \
                  MINVMD_KERNEL_PATH="$RUNNER_TEMP/kernel/vmlinuz" \
                  MINVMD_ROOTFS_PATH="$RUNNER_TEMP/rootfs/rootfs.img" \
                  MINVMD_INITRAMFS="$RUNNER_TEMP/initramfs/initramfs.cpio" \
                  MINVMD_BOOT_LOG="$RUNNER_TEMP/boot.log" \
                    "$testbin" --include-ignored --nocapture --exact minimald_exec_over_bridge
            - name: Reap Session-E2E leftovers before the CLI e2e
              # The session harness (Guest::drop) kills its minvmd but not the
              # rest of the process tree it spawned: the detached `__krun-vmm`
              # grandchild AND the host gvproxy switch minvmd owns. Either
              # leftover wedges the host→guest bridge over libkrun's vsock
              # (#588) — a healthy guest accept loop that never receives the
              # bridged connection — so the CLI e2e's cold activate dies with
              # `ssh connect: Disconnected`. The `__krun-vmm`-only reap proved
              # insufficient: main run 29032763009 (on the commit that added
              # it) failed exactly this way, with the new VM's proxy-publish
              # WARN pointing at a lingering gvproxy. Reap the whole tree —
              # any stray minvmd first (so nothing respawns), then the VMM and
              # gvproxy — so the CLI e2e starts from the single-VM state it
              # had when it was its own job. The proper fix (harness reaps its own
              # process group) is tracked under #588.
              run: |
                  pkill -x minvmd 2>/dev/null || true
                  pkill -f '__krun-vmm' 2>/dev/null || true
                  pkill -f gvproxy 2>/dev/null || true
                  sleep 1
            - name: Session e2e via the CLI (activate/exec/destroy; autospawns minvmd)
              # The unified session e2e (scripts/session-e2e.sh — the SAME
              # proof every target lane runs), here against the VM-backed
              # daemon: from a clean state, `minimal activate` must auto-spawn
              # minvmd (found by name on PATH; the MINVMD_* env propagates
              # through the `minvmd run --detach` re-exec), boot the guest,
              # create a session, and `minimal attach --command` must exec in
              # it over the vsock bridge. Replaces the old autospawn step,
              # which only proved `minimal ls` cold/warm — this proves the
              # full user path and subsumes it (the cold activate IS the
              # autospawn). Runs the prebuilt binaries directly (never
              # `cargo run`, which would relink and unsign minvmd).
              # E2E_PROJECT_DIR=/tmp: the guest sees no host project dir yet
              # (no project sync), and /tmp exists in the guest image.
              run: |
                  export PATH="$PWD/target/debug:$PATH"
                  export MINVMD_KERNEL_PATH="$RUNNER_TEMP/kernel/vmlinuz"
                  export MINVMD_ROOTFS_PATH="$RUNNER_TEMP/rootfs/rootfs.img"
                  export MINVMD_INITRAMFS="$RUNNER_TEMP/initramfs/initramfs.cpio"
                  export MINVMD_BOOT_LOG="$RUNNER_TEMP/cli-e2e-boot.log"
                  E2E_VM=1 E2E_PROJECT_DIR=/tmp ./scripts/session-e2e.sh
            - name: Upload guest boot console logs
              # Capture hvc0 output for diagnosing a stuck/failed boot (e.g. a missing
              # virtio driver in the kernel). Always runs so a red boot is debuggable.
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: minvmd-boot-logs
                  path: |
                      ${{ runner.temp }}/boot.log
                      ${{ runner.temp }}/cli-e2e-boot.log
                  if-no-files-found: ignore

    build-macos:
        # Self-hosted Apple Silicon runner. minvmd links libkrun
        # (`#[link(name = "krun")]`) and only compiles on macOS — the Linux CI
        # builds it as a stub. Real hardware, so the hypervisor-backed FFI smoke
        # runs here; GitHub-hosted macOS VMs can't. Scoped to minvmd, the only
        # macOS-gated crate; widen to --workspace once the tree is mac-buildable.
        #
        # Gated on the RUN_MACOS_CI repo variable (defaults to enabled when unset).
        # `timeout-minutes` counts time queued for a runner, so set
        # RUN_MACOS_CI=false to skip while the runner is offline.
        if: ${{ vars.RUN_MACOS_CI != 'false' }}
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  # Don't leave git credentials on the persistent self-hosted runner.
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Provision libkrun (pinned own build)
              uses: ./.github/actions/setup-libkrun-macos
            - name: Clippy (minvmd)
              run: cargo clippy -p minvmd --all-targets -- -D warnings
            - name: Test (minvmd)
              run: cargo test -p minvmd
            - name: Test (sessions)
              # Platform-sensitive surface: std::fs::canonicalize behavior on
              # prefix-symlinked roots (/tmp → /private/tmp on macOS) and the
              # follow_symlinks dual-path policy logic. Reuses the build
              # cache from the minvmd job above.
              run: cargo test -p sessions
            - name: FFI smoke against real libkrun (no VM boot)
              # Exercises create_ctx -> set_vm_config -> set_exec through the safe
              # wrappers. Skips krun_start_enter (no kernel/rootfs), so it needs no
              # codesigned hypervisor entitlement.
              run: MINVMD_E2E=1 cargo test -p minvmd --test krun_smoke -- --include-ignored
