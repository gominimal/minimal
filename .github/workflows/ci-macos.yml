name: CI (macOS)

# The macOS/HVF target lane. ALWAYS-TRIGGERED, path-scoped INSIDE the
# workflow: the `changes` job gates the expensive jobs — the single
# self-hosted Apple Silicon runner (`jks-Mac-mini`) is a shared bottleneck,
# so the hypervisor e2e only runs when the macOS-relevant surface changes —
# and the `if: always()` aggregator (ci-macos-success) reports success even
# when the jobs were path-skipped, so the context can join the required
# checks. A required context that a trigger-level path filter skips stays
# "Expected" forever and wedges the PR; do NOT add trigger-level `paths:`.
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:
    # Reusable so the nightly test tier can run the macOS/HVF e2e on a schedule
    # (nightly-tests.yml `macos-e2e`). On a scheduled call `github.event_name`
    # is the caller's event (not `pull_request`), so the lane's internal path
    # filter is bypassed and the full hypervisor e2e runs. No secrets are used
    # by this workflow, so the call needs none.
    workflow_call:

env:
    CARGO_TERM_COLOR: always

# Cancel a superseded run so the single runner isn't backed up by stale commits.
concurrency:
    group: ci-macos-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: this workflow only checks out and builds.
permissions:
    contents: read
    # dorny/paths-filter reads the PR file list on pull_request events.
    pull-requests: read

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            macos: ${{ steps.filter.outputs.macos }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Detect macOS-relevant changes
              id: filter
              # v3.0.2, SHA-pinned. Runs ONLY on pull_request, where dorny
              # reads the PR file list via the API (a push would need a local
              # diff our shallow, credential-free checkout cannot provide) —
              # and pushes to main / dispatches run everything regardless.
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
              with:
                  filters: |
                      macos:
                        - "crates/minvmd/**"
                        - "crates/minimald/**" # guest daemon: pid-1 in the e2e/boot VM
                        - "crates/minimal/**"
                        - "crates/sessions/**" # platform-sensitive: canonicalization, symlinks
                        - "Cargo.toml"
                        - "Cargo.lock"
                        # The toolchain pin: a rustc bump must re-run the Rust lanes.
                        - "rust-toolchain.toml"
                        # The guest pin: a kernel / rootfs / libkrun bump must
                        # boot the VM on HVF (parity with the KVM lane's filter).
                        - ".minimal/minimal.toml"
                        - ".github/workflows/ci-macos.yml"
                        - "scripts/**"
                        # Composite actions this lane's setup runs through — without
                        # these, a composite-only edit would skip this lane and
                        # break it post-merge.
                        - ".github/actions/setup-libkrun-macos/**"
                        - ".github/actions/materialize/**"
                        # The libkrun pin: a bump must rebuild + re-run the e2e.
                        - "vendor/libkrun/**"

    artifacts:
        needs: [changes]
        if: github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true'
        # Build the `minimal` CLI from THIS repo's sources, then materialize the
        # guest kernel + rootfs against the repo's own .minimal/minimal.toml. Both
        # are cache pulls keyed by the pinned upstream commit (not compiles): the
        # upstream virtio-kernel-raw / microvm-rootfs packages' prebuilt aarch64
        # artifacts are in the public cache, so they pull fine on a cheap x86_64
        # Linux runner — no native arm64 build and no self-hosted runner needed.
        # The initramfs build cross-compiles minimald for aarch64-musl (~30 s with
        # the fast `initramfs` profile, then cached by actions/cache), so the timeout
        # has headroom.
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - name: Free Disk Space
              # The cross aarch64-musl initramfs build plus the restored
              # target/ cache routinely exceed the ~14 GB free on a fresh
              # GitHub-hosted Ubuntu runner. `remove_tool_cache: true`
              # reclaims /opt/hostedtoolcache (~14 GB); the dtolnay Toolchain
              # step below reinstalls the Rust toolchain we actually need.
              uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
              with:
                  remove_android: true
                  remove_dotnet: true
                  remove_haskell: true
                  remove_tool_cache: true
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable
            - name: Install protoc
              run: sudo sh -c 'apt-get update && apt-get install -y protobuf-compiler'
            - name: Cache cargo + build artifacts (incl. the aarch64 cross target)
              # Raw actions/cache (not Swatinem) — it preserves the full
              # target/aarch64-unknown-linux-musl tree, so the initramfs cross-compile
              # is incremental after the first run. Restore-only here; the save
              # half (main only) runs at the end of the job.
              id: stage2-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-stage2-artifacts-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-stage2-artifacts-
            - name: Materialize guest kernel (raw Image)
              uses: ./.github/actions/materialize
              with:
                  output: virtio-kernel
                  dest: ${{ runner.temp }}/vmlinuz
                  arch: aarch64
                  channel: unstable
            - name: Materialize guest rootfs (ext4 image)
              uses: ./.github/actions/materialize
              with:
                  output: minvmd-rootfs
                  dest: ${{ runner.temp }}/rootfs.img
                  arch: aarch64
                  channel: unstable
            - name: Install cross
              uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
              with:
                  tool: cross
            - name: Build guest initramfs (minimald as /init)
              # Cross-compile minimald to static aarch64 + pack as the initramfs /init.
              # The guest rootfs stays generic; minimald is delivered by the initramfs,
              # not baked into the rootfs.
              run: ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs.cpio"
            - name: Upload kernel artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: virtio-kernel-aarch64
                  path: ${{ runner.temp }}/vmlinuz
                  if-no-files-found: error
            - name: Upload rootfs artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-rootfs-aarch64
                  path: ${{ runner.temp }}/rootfs.img
                  if-no-files-found: error
            - name: Upload initramfs artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimald-initramfs-aarch64
                  path: ${{ runner.temp }}/initramfs.cpio
                  if-no-files-found: error
            - name: Save cargo + build artifacts cache (main only)
              # PR branches restore but never write: multi-GB caches written by
              # every branch LRU-evict the main entries all PRs restore from.
              if: github.ref == 'refs/heads/main' && steps.stage2-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ steps.stage2-cache.outputs.cache-primary-key }}

    e2e:
        # Hypervisor E2E on real hardware — the mac lane's TEST phase. The
        # mini COMPILES NOTHING (the KVM lane's build→test split, podman
        # pattern): kernel/rootfs/initramfs come from the `artifacts` job, and
        # every host binary — minvmd, min, the test harnesses in the nextest
        # archive, libkrun.1.dylib in the shipped bin/../lib layout — comes
        # prebuilt in the `unit` job's darwin testbed. This runner only
        # downloads, codesigns, and runs, so the shared mini spends its time
        # exclusively on the hypervisor and a flake rerun replays only this
        # test job, not a build+test monolith.
        #
        # GATING: green on the runner — raw kernel load (KRUN_KERNEL_FORMAT_RAW),
        # initramfs boot (minimald as `/init`, pid-1), minimald mounting the ext4
        # rootfs (/dev/vda via krun_add_disk2) + chrooting, the guest READY
        # connect-out on vsock 7350, and the full vsock session round-trip
        # (direct run_on_vsock; needs libkrun >= 1.19.0). The Session E2E step
        # boots the same kernel/rootfs/initramfs through the same HVF path as the
        # retired standalone boot test and goes further (russh auth + exec,
        # stdout + exit status), so a passing session gates the boot. The
        # unified session e2e (scripts/session-e2e.sh) then covers the
        # CLI proof and more: from a clean state `min activate` must
        # auto-spawn minvmd and a real session exec must round-trip — the
        # macOS integration gate that no unit test can cover.
        # RUN_MACOS_CI is the kill-switch repo variable for taking the mini
        # offline; a skipped e2e reads as `skipped`, which the aggregator
        # treats as pass.
        #
        # FORK GUARD — the head-repo check is load-bearing SECURITY, not a
        # filter. This repo is PUBLIC and this job runs on a self-hosted
        # runner: a physical Mac mini on a home network, reused across jobs
        # rather than torn down. Without this condition, anyone can open a PR
        # from a fork and execute arbitrary code on that machine — GitHub's own
        # docs say not to pair self-hosted runners with public repos for
        # exactly this reason. `permissions: contents: read` and using no
        # secrets limit what a run can STEAL; they do nothing about what it can
        # RUN, or what it can leave behind on a persistent host.
        #
        # Deliberately expressed here rather than relying on the repo's
        # "require approval for fork PRs" setting: that setting exempts anyone
        # with a previously-merged PR, is invisible in review, and silently
        # reverts to the org default. This line is versioned, reviewable, and
        # fails closed.
        #
        # Fork PRs get `skipped`, which the ci-macos-success aggregator counts
        # as pass, so this does not wedge the required check.
        if: >-
            ${{ vars.RUN_MACOS_CI != 'false'
            && (github.event_name != 'pull_request'
                || (needs.changes.outputs.macos == 'true'
                    && github.event.pull_request.head.repo.full_name == github.repository)) }}
        needs: [changes, artifacts, unit]
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Download virtio-linux kernel
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: virtio-kernel-aarch64
                  path: ${{ runner.temp }}/kernel
            - name: Download minvmd-rootfs image
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minvmd-rootfs-aarch64
                  path: ${{ runner.temp }}/rootfs
            - name: Download guest initramfs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-initramfs-aarch64
                  path: ${{ runner.temp }}/initramfs
            - name: Download darwin testbed
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: mac-testbed
                  path: ${{ runner.temp }}/testbed
            - name: Install nextest
              uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
              with:
                  tool: nextest
            - name: Unpack testbed + resolve paths
              # Artifact transfer strips exec bits on the sidecar binaries;
              # restore them (the nextest archive preserves its own). The
              # Mach-O contents round-trip byte-for-byte, so the build-time
              # ad-hoc signatures on min and libkrun.1.dylib stay valid;
              # minvmd is re-signed with the hypervisor entitlement below.
              # MINVMD_BIN points the harnesses at the testbed minvmd (their
              # baked CARGO_BIN_EXE path only exists on the build runner);
              # bin/ joins PATH so the CLI e2e's autospawn resolves
              # min/minvmd by name.
              run: |
                  set -euo pipefail
                  TESTBED="$RUNNER_TEMP/testbed"
                  chmod +x "$TESTBED/bin/minvmd" "$TESTBED/bin/min"
                  echo "$TESTBED/bin" >> "$GITHUB_PATH"
                  {
                    echo "TESTBED=$TESTBED"
                    echo "MINVMD_BIN=$TESTBED/bin/minvmd"
                  } >> "$GITHUB_ENV"
            - name: Codesign minvmd (hypervisor entitlement)
              run: codesign --entitlements crates/minvmd/minvmd.entitlements --force -s - "$TESTBED/bin/minvmd"
            - name: FFI smoke against real libkrun (no VM boot)
              # Exercises create_ctx -> set_vm_config -> set_exec through the
              # safe wrappers via the krun_smoke_child helper. No kernel/rootfs
              # env is set, so it takes the bring-up-only path: no
              # krun_start_enter, so the unentitled archive binary suffices —
              # unlike the full-boot harnesses below (which boot via the
              # codesigned minvmd subprocess), it boots in-process, which is
              # why it is excluded from the kernel-env harness step.
              #
              # DYLD_FALLBACK_LIBRARY_PATH resolves the archive binaries'
              # @rpath/libkrun.1.dylib load command from the testbed: their
              # baked rpaths (@loader_path + the build runner's
              # LIBKRUN_PREFIX) don't exist on this machine. Exported inside
              # the script — SIP strips DYLD_* from the environment of
              # Apple-signed shells, so a step-level `env:` entry may never
              # reach the test processes. (The testbed minvmd needs no such
              # help: its rewritten @loader_path/../lib rpath finds the
              # bundled dylib.)
              env:
                  MINVMD_E2E: "1"
              run: |
                  export DYLD_FALLBACK_LIBRARY_PATH="$TESTBED/lib"
                  cargo-nextest nextest run \
                    --archive-file "$TESTBED/nextest-archive.tar.zst" \
                    --workspace-remap "$GITHUB_WORKSPACE" --profile vm \
                    --run-ignored all --no-tests=fail \
                    -E 'binary(krun_smoke_integration)'
            - name: VM integration harnesses (auto-discovered from the archive)
              # Run every full-boot harness the archive carries by the `_integration`
              # convention — `binary(/_integration$/)` minus the `_root_integration` harnesses
              # (Linux-only; empty here) and minus krun_smoke_integration (the kernel-less
              # FFI smoke run above; the sessions unit binaries the archive also
              # carries don't match the filterset — their tier ran on the hosted
              # `unit` job). Currently boot_integration, minimald_session_integration,
              # and volume_quiesce_integration; a new *_integration.rs joins with no yaml. Each
              # boots the GENERIC upstream rootfs with minimald as the initramfs
              # /init and drives the full Stage-2 path (russh client -> bridge ->
              # guest vsock -> minimald, no socat relay) over the codesigned
              # minvmd subprocess (MINVMD_BIN, set at unpack). `--run-ignored all`
              # runs the #[ignore] bodies; `--no-tests=fail` reds a filterset that
              # matches nothing. profile vm is serial with fail-fast, so a failed
              # boot preserves its hvc0 console in boot.log. Needs libkrun >= 1.19.0.
              # In-script DYLD export: see the FFI smoke above.
              env:
                  MINVMD_E2E: "1"
                  MINVMD_KERNEL_PATH: ${{ runner.temp }}/kernel/vmlinuz
                  MINVMD_ROOTFS_PATH: ${{ runner.temp }}/rootfs/rootfs.img
                  MINVMD_INITRAMFS: ${{ runner.temp }}/initramfs/initramfs.cpio
                  MINVMD_BOOT_LOG: ${{ runner.temp }}/boot.log
              run: |
                  export DYLD_FALLBACK_LIBRARY_PATH="$TESTBED/lib"
                  cargo-nextest nextest run \
                    --archive-file "$TESTBED/nextest-archive.tar.zst" \
                    --workspace-remap "$GITHUB_WORKSPACE" --profile vm \
                    --run-ignored all --no-tests=fail \
                    -E 'binary(/_integration$/) and not binary(/_root_integration$/) and not binary(krun_smoke_integration)'
            - name: Reap Session-E2E leftovers before the CLI e2e
              # The session harness (Guest::drop) kills its minvmd but not the
              # rest of the process tree it spawned: the detached `__krun-vmm`
              # grandchild AND the host gvproxy switch minvmd owns. Either
              # leftover wedges the host→guest bridge over libkrun's vsock —
              # a healthy guest accept loop that never receives the bridged
              # connection — so the CLI e2e's cold activate dies with
              # `ssh connect: Disconnected`. The `__krun-vmm`-only reap proved
              # insufficient on a main run: the new VM's proxy-publish WARN
              # pointed at a lingering gvproxy. Reap the whole tree — any
              # stray minvmd first (so nothing respawns), then the VMM and
              # gvproxy — so the CLI e2e starts from the single-VM state it
              # had when it was its own job. The proper fix is for the harness
              # to reap its own process group, tracked separately.
              run: |
                  pkill -x minvmd 2>/dev/null || true
                  pkill -f '__krun-vmm' 2>/dev/null || true
                  pkill -f gvproxy 2>/dev/null || true
                  sleep 1
            - name: Daemon lifecycle (run --detach → status → stop)
              # Exercises the supervised daemon path (detach, status polling,
              # documented stop semantics) that the integration harnesses and
              # the CLI autospawn below do not cover directly — the same proof
              # the KVM lane runs, and the script's header was written
              # target-agnostic for exactly this testbed. minvmd resolves from
              # PATH (the testbed bin/, added at unpack). Requires jq on the
              # runner; the script fails fast with a clear error if absent.
              env:
                  MINVMD_KERNEL_PATH: ${{ runner.temp }}/kernel/vmlinuz
                  MINVMD_ROOTFS_PATH: ${{ runner.temp }}/rootfs/rootfs.img
                  MINVMD_INITRAMFS: ${{ runner.temp }}/initramfs/initramfs.cpio
                  MINVMD_BOOT_LOG: ${{ runner.temp }}/boot-daemon.log
              run: ./scripts/minvmd-lifecycle.sh
            - name: Fetch pinned gvproxy switch binary
              # minvmd spawns this (gvproxy-darwin) as the host-side switch that
              # provides the guest's egress (NAT + DNS). Without it minvmd boots
              # the VM switchless (gvproxy resolution is best-effort and never
              # errors), so the guest overlay has no other end and every egress —
              # including the in-guest `pkgs` clone during session mint — dies
              # with "Could not resolve host".
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/gvproxy"
            - name: Session e2e via the CLI (activate/exec/destroy; autospawns minvmd)
              # The unified session e2e (scripts/session-e2e.sh — the SAME
              # proof every target lane runs), here against the VM-backed
              # daemon: from a clean state, `min activate` must auto-spawn
              # minvmd (found by name on PATH; the MINVMD_* env propagates
              # through the `minvmd run --detach` re-exec), boot the guest,
              # create a session, and `min attach --command` must exec in
              # it over the vsock bridge. Replaces the old autospawn step,
              # which only proved `min ls` cold/warm — this proves the
              # full user path and subsumes it (the cold activate IS the
              # autospawn). min and minvmd resolve from the testbed bin/ on
              # PATH (set at unpack) — prebuilt, codesigned, nothing rebuilt
              # on this machine.
              # Since #748 activate uploads the project into the guest;
              # E2E_PROJECT_DIR=/tmp still names a guest path.
              run: |
                  export MINVMD_KERNEL_PATH="$RUNNER_TEMP/kernel/vmlinuz"
                  export MINVMD_ROOTFS_PATH="$RUNNER_TEMP/rootfs/rootfs.img"
                  export MINVMD_INITRAMFS="$RUNNER_TEMP/initramfs/initramfs.cpio"
                  export MINVMD_BOOT_LOG="$RUNNER_TEMP/cli-e2e-boot.log"
                  export MINVMD_GVPROXY_BIN="$RUNNER_TEMP/gvproxy"
                  E2E_VM=1 E2E_PROJECT_DIR=/tmp ./scripts/session-e2e.sh
            - name: Upload guest boot console logs
              # Capture hvc0 output for diagnosing a stuck/failed boot (e.g. a missing
              # virtio driver in the kernel). Always runs so a red boot is debuggable.
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-boot-logs
                  path: |
                      ${{ runner.temp }}/boot.log
                      ${{ runner.temp }}/boot-daemon.log
                      ${{ runner.temp }}/cli-e2e-boot.log
                  if-no-files-found: ignore

    unit:
        # GitHub-hosted Apple Silicon (macos-latest is arm64). minvmd links
        # libkrun (`#[link(name = "krun")]`) and only compiles the real impl on
        # macOS — the Linux CI builds it as a stub — so its clippy/unit tier
        # needs a mac, but NOT the hypervisor: everything hypervisor-backed
        # (the krun_smoke FFI smoke, VM boots) lives in the `e2e` job on the
        # self-hosted runner.
        #
        # This job is ALSO the mac lane's BUILD phase (the KVM lane's
        # build-linux → test-kvm split, podman pattern): the one compile of
        # the macOS-sensitive crates produces the nextest archive AND the
        # darwin testbed (minvmd, min, libkrun.1.dylib in the shipped
        # bin/../lib layout) that the mini's e2e job downloads, codesigns,
        # and runs — the mini itself compiles nothing. Scoped to the
        # macOS-sensitive crates; widen to --workspace once the tree is
        # mac-buildable. Kept lean (private repo: macOS minutes bill at 10x).
        needs: [changes]
        if: github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true'
        runs-on: macos-latest
        timeout-minutes: 45
        env:
            # Slim debug info (usable backtraces, smaller caches, faster
            # links); the mac jobs don't run the setup-rust composite that
            # sets this on the Linux lanes.
            CARGO_PROFILE_DEV_DEBUG: line-tables-only
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable
                  components: clippy
            - name: Cache cargo registry and build artifacts
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: mac-unit
                  # PR branches restore but never save, so PR churn cannot
                  # LRU-evict the main-branch caches (same policy as the
                  # setup-rust composite).
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Provision libkrun (pinned own build)
              uses: ./.github/actions/setup-libkrun-macos
            - name: Install nextest
              uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
              with:
                  tool: nextest
            - name: Clippy (minvmd)
              run: cargo clippy -p minvmd --all-targets --locked -- -D warnings
            - name: Unit tests (minvmd + sessions)
              # sessions is platform-sensitive surface: std::fs::canonicalize
              # behavior on prefix-symlinked roots (/tmp → /private/tmp on
              # macOS) and the follow_symlinks dual-path policy logic. The
              # `_integration` harnesses are excluded here — they are the
              # hypervisor tier, replayed on the mini from the archive staged
              # below (one compile serves both tiers).
              #
              # NOTE: `cargo test -p minimal` is deliberately absent — the CLI's
              # dev-dependencies pull minimald (test-support), whose ungated
              # hakoniwa -> libcgroups -> procfs chain does not build on macOS.
              # (`cargo build -p minimal` is fine: no dev-deps.) The CLI's macOS
              # coverage stays the session e2e until minimald's sandbox deps
              # are cfg(linux)-gated.
              run: |
                  cargo nextest run -p minvmd -p sessions --locked --profile ci \
                    --no-tests=fail -E 'not binary(/_integration$/)'
            - name: Doctests (minvmd + sessions)
              # nextest does not run doctests; same split as core-tests.
              run: cargo test --doc -p minvmd -p sessions --locked
            - name: Build minvmd + the minimal CLI
              run: |
                  cargo build -p minvmd --bin minvmd --locked
                  # SEPARATE invocation for the CLI (mirrors release.yml): built
                  # together, cargo unifies minvmd's default `libkrun` feature
                  # into minimal's default-features=false opt-out, and the CLI
                  # links libkrun. The brew era masked this (absolute install
                  # name loaded from anywhere); our @rpath dylib turns it into
                  # dyld "Library not loaded" at autospawn, since minimal bakes
                  # no rpaths.
                  cargo build -p minimal --bin min --locked
            - name: Verify minimal links only system libraries
              # The CLI spawns minvmd as a subprocess and calls no libkrun; a
              # krun load command means the feature unification above regressed.
              # Catch it here with a clear message, not as a dyld error at
              # autospawn on the mini.
              run: |
                  bad="$(otool -L target/debug/min | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^(/usr/lib/|/System/)' || true)"
                  if [ -n "$bad" ]; then
                    echo "::error::minimal links non-system libraries (feature unification with minvmd's libkrun?):" >&2
                    printf '%s\n' "$bad" >&2
                    exit 1
                  fi
            - name: Stage the darwin testbed (shipped bin/../lib layout)
              # Everything the mini runs, in the layout the installer drops:
              # bin/minvmd beside lib/libkrun.1.dylib, with the release
              # pipeline's @rpath rewrite applied so minvmd resolves
              # @rpath/libkrun.1.dylib via @loader_path/../lib. The rewrite
              # script also VERIFIES the result (rpath retargeted, only system
              # libs otherwise), so a broken ship layout reds the PR here — and
              # the e2e then BOOTS that exact layout, replacing the old static
              # check on a throwaway copy. The archive carries every minvmd
              # test binary, so the mini's harnesses are selected by the
              # `_integration` convention with no per-test list — a new
              # crates/minvmd/tests/*_integration.rs is picked up with no yaml.
              run: |
                  set -euo pipefail
                  mkdir -p testbed/bin testbed/lib
                  cargo nextest archive -p minvmd -p sessions --locked \
                    --archive-file testbed/nextest-archive.tar.zst
                  cp target/debug/minvmd testbed/bin/minvmd
                  cp target/debug/min testbed/bin/min
                  cp "$LIBKRUN_PREFIX/libkrun.1.dylib" testbed/lib/libkrun.1.dylib
                  scripts/rewrite-macos-linkage.sh testbed/bin/minvmd
            - name: Upload darwin testbed
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: mac-testbed
                  path: testbed/
                  if-no-files-found: error
                  retention-days: 3

    # Single required status check for this lane (branch-protection context:
    # ci-macos-success). Green when every gating job succeeded OR was
    # path-skipped (or the RUN_MACOS_CI kill-switch skipped the e2e); red only
    # on failure/cancellation.
    ci-macos-success:
        if: always()
        needs: [changes, artifacts, e2e, unit]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Verify all gating jobs succeeded or were skipped
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
            - run: echo "macOS lane green"
