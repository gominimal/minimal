name: Release

on:
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

# Serialize release runs so two manual dispatches can't race to cut a release
# from different commits at the same time.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v7
            - name: Run core workspace tests
              uses: ./.github/actions/core-tests
            - name: Run HTTPS/mTLS proxy tests
              # The mTLS reverse proxy is behind the non-default `networking-proxy`
              # feature, so the core-tests `--workspace` run does not compile or run
              # its proofs (R4.5 mtls_missing_cert_returns_401_with_no_topology, UC2b
              # mtls_valid_cert_routes_to_backend). Exercise them explicitly.
              run: cargo nextest run -p minimald --features networking-proxy
            - name: Run WireGuard mesh tests
              # The WireGuard mesh peer is behind the non-default `networking-wg`
              # feature, so the core-tests `--workspace` run does not compile or run
              # its proofs. Exercise them explicitly (R-WG:
              # two_meshes_handshake_and_relay_a_packet, rpc get_mesh_status). The
              # `#[ignore]` two-namespace mesh_uc7 proof runs in the netns lane.
              run: cargo test -p minimald --features networking-wg

    build-release-linux-amd64:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Free Disk Space
              # Static release build of the full workspace; the cargo target dir
              # is the largest in any of the linux jobs. `remove_tool_cache: true`
              # is safe even without a `dtolnay/rust-toolchain` step — the
              # pre-installed Rust toolchain on ubuntu-latest lives in
              # `~/.rustup` + `~/.cargo`, not `/opt/hostedtoolcache`, so
              # `rustup target add` below still resolves.
              uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
              with:
                  remove_android: true
                  remove_dotnet: true
                  remove_haskell: true
                  remove_tool_cache: true
            - uses: actions/checkout@v7
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
            - name: Add Rust target
              run: rustup target add x86_64-unknown-linux-musl
            - name: Configure musl linker
              run: |
                  echo '' >> .cargo/config.toml
                  echo '[target.x86_64-unknown-linux-musl]' >> .cargo/config.toml
                  echo 'linker = "musl-gcc"' >> .cargo/config.toml
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-amd64-cargo-release-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-amd64-cargo-release-
            - name: Build static release binaries
              run: |
                  cargo build --release --target x86_64-unknown-linux-musl \
                     --package mip \
                     --package minimal \
                     --package minimald
            - name: Rename binaries with platform suffix
              # download-artifact merge-multiple flattens every artifact into one
              # directory using each file's basename, so the uploaded files must
              # already carry a unique platform-suffixed name to avoid amd64/arm64
              # collisions and to match the paths used by the release job.
              run: |
                  cd target/x86_64-unknown-linux-musl/release
                  mv mip mip-linux-amd64
                  mv minimal minimal-linux-amd64
                  mv minimald minimald-linux-amd64
            - name: Upload binary (mip)
              uses: actions/upload-artifact@v7
              with:
                  name: mip-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/mip-linux-amd64
                  retention-days: 7
            - name: Upload binary (minimal)
              uses: actions/upload-artifact@v7
              with:
                  name: minimal-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/minimal-linux-amd64
                  retention-days: 7
            - name: Upload binary (minimald)
              uses: actions/upload-artifact@v7
              with:
                  name: minimald-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/minimald-linux-amd64
                  retention-days: 7
            - name: Materialize libkrun prefix (upstream package)
              # minvmd links libkrun's KVM backend dynamically, so unlike the three
              # binaries above it can't join the static-musl cross build — it needs a
              # native glibc build against a real libkrun. Materialize libkrun (a cache
              # fetch keyed by the pinned upstream commit, NOT a from-source build) into
              # a flat prefix that minvmd's build.rs link-searches + rpaths against.
              #
              # Reuse the static mip built above (MIP=) instead of letting the script
              # compile a second, debug mip just to drive this cache fetch.
              env:
                  MIP: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/mip-linux-amd64
              run: ./scripts/fetch-libkrun.sh "$HOME/.krun" x86_64
            - name: Build native minvmd binary
              # Native host target (x86_64-unknown-linux-gnu), NOT musl: the binary
              # links libkrun.so (and libkrunfw.so.5 is dlopen'd at runtime), so unlike
              # the three above it is not self-contained — running it still needs those
              # .so's reachable via rpath/LD_LIBRARY_PATH. LIBKRUN_PREFIX drives the
              # build.rs link search and the `minvmd_libkrun` cfg (real, non-stub impl).
              run: |
                  LIBKRUN_PREFIX="$HOME/.krun" \
                    cargo build --release -p minvmd --bin minvmd
                  mv target/release/minvmd target/release/minvmd-linux-amd64
            - name: Upload binary (minvmd)
              uses: actions/upload-artifact@v7
              with:
                  name: minvmd-linux-amd64
                  path: target/release/minvmd-linux-amd64
                  retention-days: 7

    build-release-linux-arm64:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            - name: Install cross
              uses: taiki-e/install-action@v2
              with:
                  tool: cross
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-arm64-cargo-release-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-arm64-cargo-release-
            - name: Build static minimal binary
              # Rename with a platform suffix so download-artifact's merge-multiple
              # flatten does not collide with the amd64 build's basename.
              run: |
                  cross build --release \
                     --package minimal \
                     --target aarch64-unknown-linux-musl
                  mv target/aarch64-unknown-linux-musl/release/minimal \
                     target/aarch64-unknown-linux-musl/release/minimal-linux-arm64
            - name: Upload binary (minimal)
              uses: actions/upload-artifact@v7
              with:
                  name: minimal-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/minimal-linux-arm64
                  retention-days: 7
            - name: Build static mip binary
              run: |
                  cross build --release \
                     --package mip \
                     --target aarch64-unknown-linux-musl
                  mv target/aarch64-unknown-linux-musl/release/mip \
                     target/aarch64-unknown-linux-musl/release/mip-linux-arm64
            - name: Upload binary (mip)
              uses: actions/upload-artifact@v7
              with:
                  name: mip-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/mip-linux-arm64
                  retention-days: 7
            - name: Build static minimald binary
              run: |
                  cross build --release \
                     --package minimald \
                     --target aarch64-unknown-linux-musl
                  mv target/aarch64-unknown-linux-musl/release/minimald \
                     target/aarch64-unknown-linux-musl/release/minimald-linux-arm64
            - name: Upload binary (minimald)
              uses: actions/upload-artifact@v7
              with:
                  name: minimald-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/minimald-linux-arm64
                  retention-days: 7

    build-release-macos-arm64:
        # Self-hosted Apple Silicon runner. minvmd links libkrun (Hypervisor.framework
        # backend) via `#[link(name = "krun")]` and builds the real (non-stub) impl
        # only on macOS against a provisioned libkrun — it can't join the static-musl
        # cross builds above, so it's built natively here (mirrors ci-macos.yml's
        # build-macos). Gated on RUN_MACOS_CI so it's skipped while the single
        # self-hosted runner is offline — a skip here also skips `release`, which
        # needs it.
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 45
        if: vars.RUN_MACOS_CI != 'false'
        steps:
            - uses: actions/checkout@v7
              with:
                  # Don't leave git credentials on the persistent self-hosted runner.
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Provision libkrun (slp/krun tap)
              # Self-install libkrun so the job doesn't depend on hand-provisioned
              # runner state. Idempotent (a no-op when already present).
              run: brew install slp/krun/libkrun
            - name: Verify libkrun is available
              run: |
                  if [ ! -f /opt/homebrew/lib/libkrun.dylib ]; then
                    echo "::error::libkrun.dylib not found under /opt/homebrew/lib. Provision the runner with: brew install slp/krun/libkrun" >&2
                    exit 1
                  fi
            - name: Build release minvmd binary
              run: cargo build --release -p minvmd --bin minvmd
            - name: Point minvmd's libkrun load command at @rpath
              # Homebrew's libkrun bakes an ABSOLUTE install name into minvmd; rewrite
              # it so that minvmd looks at ./minvmd/../lib/libkrun.1.dylib, as
              # per the layout the installer drops.
              #
              # build.rs bakes a bin-relative @loader_path rpath for development.
              run: |
                  current="$(otool -L target/release/minvmd | awk '/libkrun/ {print $1; exit}')"
                  if [ -z "$current" ]; then
                    echo "::error::minvmd has no libkrun load command; did it link the stub?" >&2
                    exit 1
                  fi
                  install_name_tool -change "$current" @rpath/libkrun.1.dylib target/release/minvmd
                  install_name_tool -rpath @loader_path @loader_path/../lib target/release/minvmd
            - name: Verify minvmd linkage
              # libkrun must resolve via @rpath (rewrite stuck), and every other
              # dependency must be a system library (/usr/lib or /System). A stray
              # /opt/homebrew dep would fail to load off the build host.
              run: |
                  otool -L target/release/minvmd
                  if ! otool -L target/release/minvmd | grep -q '@rpath/libkrun\.1\.dylib'; then
                    echo "::error::minvmd does not reference @rpath/libkrun.1.dylib; the shipped dylib will not be found" >&2
                    exit 1
                  fi
                  # The shipped dylib lives in lib/ (a sibling of bin/), so the
                  # @loader_path -> @loader_path/../lib retarget above must have
                  # stuck; without it dyld never looks one dir up from bin/minvmd
                  # and the load fails at runtime. Pull just the LC_RPATH `path`
                  # values so the checks match exact entries, not substrings.
                  otool -l target/release/minvmd | grep -A2 LC_RPATH
                  rpaths="$(otool -l target/release/minvmd \
                    | awk '$1=="path" && $2 ~ /@loader_path/ {print $2}')"
                  if ! printf '%s\n' "$rpaths" | grep -qx '@loader_path/../lib'; then
                    echo "::error::minvmd is missing the @loader_path/../lib rpath; lib/libkrun.1.dylib will not be found" >&2
                    exit 1
                  fi
                  if printf '%s\n' "$rpaths" | grep -qx '@loader_path'; then
                    echo "::error::minvmd still has a bare @loader_path rpath; the lib retarget did not replace it" >&2
                    exit 1
                  fi
                  bad="$(otool -L target/release/minvmd | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^(/usr/lib/|/System/|@rpath/libkrun\.1\.dylib$)' || true)"
                  if [ -n "$bad" ]; then
                    echo "::error::minvmd links unexpected non-system libraries:" >&2
                    printf '%s\n' "$bad" >&2
                    exit 1
                  fi
            - name: Build release minimal binary
              # Separate cargo invocation from minvmd above, so its default
              # `libkrun` feature can't unify into the CLI (which opts out via
              # default-features = false). Gated next.
              run: cargo build --release -p minimal --bin minimal
            - name: Verify minimal links only system libraries
              # The CLI calls no libkrun (it spawns minvmd as a subprocess), so
              # every dependency must be under /usr/lib or /System. A krun line
              # means the default-features = false opt-out regressed.
              run: |
                  otool -L target/release/minimal
                  bad="$(otool -L target/release/minimal | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^(/usr/lib/|/System/)' || true)"
                  if [ -n "$bad" ]; then
                    echo "::error::minimal links non-system libraries (allowed: /usr/lib, /System):" >&2
                    printf '%s\n' "$bad" >&2
                    exit 1
                  fi
            - name: Rename binaries with platform suffix
              # download-artifact merge-multiple flattens on basename, so the uploaded
              # file must already carry the platform-suffixed name the release job expects.
              run: |
                  mv target/release/minvmd target/release/minvmd-macos-arm64
                  mv target/release/minimal target/release/minimal-macos-arm64
            - name: Codesign binaries with Developer ID
              # Sign the two shipped Mach-O binaries with the Developer ID
              # Application identity held in the runner's signing keychain. This
              # is the LAST mutation before upload.
              # Hardened runtime (--options runtime) + a secure --timestamp so the
              # artifacts are notarization-ready.
              env:
                  KC_PW: ${{ secrets.KC_PW }}
              run: |
                  KC=minimal-signing.keychain-db
                  IDENTITY="Developer ID Application: Minimal Software Research Ltd. (3G47C5HY64)"

                  # Unlock the signing keychain and put it on the search list so
                  # codesign can resolve the identity by name.
                  security unlock-keychain -p "$KC_PW" "$KC"
                  security list-keychains -d user -s "$KC" login.keychain-db

                  codesign --force --timestamp --options runtime \
                    --sign "$IDENTITY" \
                    --entitlements crates/minvmd/minvmd.entitlements \
                    target/release/minvmd-macos-arm64
                  codesign --force --timestamp --options runtime \
                    --sign "$IDENTITY" \
                    target/release/minimal-macos-arm64

                  codesign --verify --strict --verbose=2 target/release/minvmd-macos-arm64
                  codesign --verify --strict --verbose=2 target/release/minimal-macos-arm64
            - name: Upload binary (minvmd)
              uses: actions/upload-artifact@v7
              with:
                  name: minvmd-macos-arm64
                  path: target/release/minvmd-macos-arm64
                  retention-days: 7
            - name: Upload binary (minimal)
              uses: actions/upload-artifact@v7
              with:
                  name: minimal-macos-arm64
                  path: target/release/minimal-macos-arm64
                  retention-days: 7

    build-libkrun-macos-arm64:
        # Build a TRIMMED libkrun.dylib from source to SHIP in the release, so
        # macOS users don't have to `brew install` it themselves. GitHub-hosted
        # macos-latest is Apple Silicon (arm64).
        runs-on: macos-latest
        timeout-minutes: 45
        env:
            # Pin to the libkrun the slp/krun tap currently ships, so the dylib we
            # ship matches the ABI the macOS CI lanes build and test against.
            LIBKRUN_REF: v1.19.4
        steps:
            - name: Checkout libkrun (${{ env.LIBKRUN_REF }})
              uses: actions/checkout@v7
              with:
                  repository: containers/libkrun
                  ref: ${{ env.LIBKRUN_REF }}
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Build trimmed libkrun (blk + net; no gpu, no init-blob)
              # Direct cargo build — no Makefile, no env, no lld/xz/sysroot.
              #   -p libkrun            scope to the libkrun crate, so the
              #                         src/input & src/display workspace members
              #                         (whose bindgen build scripts need libclang)
              #                         are never built.
              #   --no-default-features drop `init-blob`, whose build script
              #                         cross-compiles a Linux init — the ONLY reason
              #                         the Makefile needs lld + a Debian sysroot.
              #                         minvmd supplies its own initramfs, so
              #                         libkrun's bundled init is unused. (This is
              #                         exactly the Makefile's INIT_BLOB=0 config.)
              #   --features blk,net    blk = rootfs disk (krun_add_disk2),
              #                         net = virtio-net. No gpu => no libepoxy/
              #                         virglrenderer. Hypervisor.framework is linked
              #                         automatically by src/vmm/build.rs.
              # Output: target/release/libkrun.dylib (install_name libkrun.1.dylib,
              # set by src/libkrun/build.rs).
              run: cargo build --release -p libkrun --no-default-features --features blk,net
            - name: Stage the dylib and assert it is self-contained
              # A trimmed build must link only system libraries. Any /opt/homebrew or
              # /usr/local reference means a dependency leaked (e.g. a stray GPU lib)
              # and the dylib would fail to load on a machine without Homebrew — fail
              # loudly rather than ship an unloadable artifact. `otool -D` prints the
              # install name for cross-checking against minvmd's recorded load
              # command (see the minvmd macOS job); informational.
              run: |
                  dylib=target/release/libkrun.dylib
                  echo "otool -L $dylib"; otool -L "$dylib"
                  echo "otool -D $dylib (install name):"; otool -D "$dylib"
                  if otool -L "$dylib" | grep -E '/opt/homebrew|/usr/local'; then
                    echo "::error::trimmed libkrun links a non-system (Homebrew) dylib; see otool -L above" >&2
                    exit 1
                  fi
                  cp "$dylib" "$RUNNER_TEMP/temp-libkrun-macos-arm64.dylib"
            - name: Upload unsigned libkrun dylib (temp)
              # This GitHub-hosted runner has no access to the Developer ID signing
              # keychain, so the dylib leaves here UNSIGNED under a `temp-` prefixed
              # name. sign-libkrun-macos-arm64 (self-hosted) downloads it, signs it,
              # and re-uploads under the final `libkrun-macos-arm64` name. The
              # release job drops any leftover `temp-` artifact so the unsigned copy
              # never ships.
              uses: actions/upload-artifact@v7
              with:
                  name: temp-libkrun-macos-arm64
                  path: ${{ runner.temp }}/temp-libkrun-macos-arm64.dylib
                  if-no-files-found: error
                  retention-days: 7

    sign-libkrun-macos-arm64:
        # Developer ID signing for the shipped libkrun.dylib. While built on
        # a Github-hosted runner, it is signed on a self-hosted runner with
        # access to our signing keychain.
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 15
        if: vars.RUN_MACOS_CI != 'false'
        needs: [build-libkrun-macos-arm64]
        steps:
            - name: Download unsigned libkrun dylib (temp)
              uses: actions/download-artifact@v8
              with:
                  name: temp-libkrun-macos-arm64
                  path: ${{ runner.temp }}/libkrun-in
            - name: Codesign libkrun with Developer ID
              # A shipped dylib must be signed with the same Developer ID identity
              # (and a secure --timestamp) as the binaries so the whole install is
              # notarization-ready. --force replaces cargo's ad-hoc signature. No
              # entitlements: libkrun is a library, not the hypervisor entry point.
              env:
                  KC_PW: ${{ secrets.KC_PW }}
              run: |
                  KC=minimal-signing.keychain-db
                  IDENTITY="Developer ID Application: Minimal Software Research Ltd. (3G47C5HY64)"

                  security unlock-keychain -p "$KC_PW" "$KC"
                  security list-keychains -d user -s "$KC" login.keychain-db

                  # Drop the temp- prefix so the shipped file carries the final
                  # basename the archive/installer expect.
                  out="$RUNNER_TEMP/libkrun-macos-arm64.dylib"
                  cp "$RUNNER_TEMP/libkrun-in/temp-libkrun-macos-arm64.dylib" "$out"

                  codesign --force --timestamp --options runtime \
                    --sign "$IDENTITY" "$out"
                  codesign --verify --strict --verbose=2 "$out"
            - name: Upload signed libkrun dylib
              uses: actions/upload-artifact@v7
              with:
                  name: libkrun-macos-arm64
                  path: ${{ runner.temp }}/libkrun-macos-arm64.dylib
                  if-no-files-found: error
                  retention-days: 7

    fetch-release-guest-artifacts:
        # Fetched guest microVM artifacts shipped in the release: the raw guest
        # kernel Image, the ext4 rootfs image, and the pinned gvproxy switch
        # binary. These are already produced piecemeal in the CI lanes
        # (ci-macos.yml, ci-linux-kvm.yml, ci-gvproxy.yml); this job gathers them
        # into the release. The initramfs is packed separately in
        # build-release-initramfs, which reuses the minimald-linux-* binaries.
        #
        # None require the target host's arch to produce: the kernel and rootfs are
        # cache pulls keyed by the pinned upstream commit (fetch-artifact.sh pulls
        # any guest arch on an x86_64 runner), and gvproxy is a pin-verified
        # download of the upstream release binary. So a single x86_64 runner emits
        # both the amd64 and arm64 variants, covering every release host
        # (linux-amd64/arm64, macos-arm64). Files are arch-suffixed so
        # download-artifact's merge-multiple basename-flatten in the release job
        # doesn't collide.
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install build dependencies
              # protoc + libprotobuf-dev: the `mip` CLI build that drives the rootfs
              # cache pull (the well-known protos live in libprotobuf-dev, only a
              # `recommends` of protobuf-compiler, so name it under
              # --no-install-recommends).
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    protobuf-compiler libprotobuf-dev
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-guest-artifacts-release-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-guest-artifacts-release-
            # NOTE: fetch-artifact.sh takes the kernel-style arch (x86_64/aarch64);
            # only the emitted file/artifact names use the amd64/arm64 suffixes the
            # release binaries already use.
            - name: Materialize guest kernel (raw Image, amd64)
              run: ./scripts/fetch-artifact.sh virtio-kernel "$RUNNER_TEMP/vmlinuz-amd64" x86_64
            - name: Materialize guest kernel (raw Image, arm64)
              run: ./scripts/fetch-artifact.sh virtio-kernel "$RUNNER_TEMP/vmlinuz-arm64" aarch64
            - name: Materialize guest rootfs (ext4 image, amd64)
              run: ./scripts/fetch-artifact.sh minvmd-rootfs "$RUNNER_TEMP/rootfs-amd64.img" x86_64
            - name: Materialize guest rootfs (ext4 image, arm64)
              run: ./scripts/fetch-artifact.sh minvmd-rootfs "$RUNNER_TEMP/rootfs-arm64.img" aarch64
            - name: Fetch pinned gvproxy (linux-amd64)
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/gvproxy-linux-amd64" gvproxy-linux-amd64
            - name: Fetch pinned gvproxy (linux-arm64)
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/gvproxy-linux-arm64" gvproxy-linux-arm64
            - name: Fetch pinned gvproxy (darwin-arm64)
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/gvproxy-darwin-arm64" gvproxy-darwin
            - name: Upload kernel (amd64)
              uses: actions/upload-artifact@v7
              with:
                  name: virtio-kernel-amd64
                  path: ${{ runner.temp }}/vmlinuz-amd64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload kernel (arm64)
              uses: actions/upload-artifact@v7
              with:
                  name: virtio-kernel-arm64
                  path: ${{ runner.temp }}/vmlinuz-arm64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload rootfs (amd64)
              uses: actions/upload-artifact@v7
              with:
                  name: minvmd-rootfs-amd64
                  path: ${{ runner.temp }}/rootfs-amd64.img
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload rootfs (arm64)
              uses: actions/upload-artifact@v7
              with:
                  name: minvmd-rootfs-arm64
                  path: ${{ runner.temp }}/rootfs-arm64.img
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload gvproxy (linux-amd64)
              uses: actions/upload-artifact@v7
              with:
                  name: gvproxy-linux-amd64
                  path: ${{ runner.temp }}/gvproxy-linux-amd64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload gvproxy (linux-arm64)
              uses: actions/upload-artifact@v7
              with:
                  name: gvproxy-linux-arm64
                  path: ${{ runner.temp }}/gvproxy-linux-arm64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload gvproxy (darwin-arm64)
              uses: actions/upload-artifact@v7
              with:
                  name: gvproxy-darwin-arm64
                  path: ${{ runner.temp }}/gvproxy-darwin-arm64
                  if-no-files-found: error
                  retention-days: 7

    build-release-initramfs:
        # Pack the guest initramfs (minimald as pid-1 /init) from the SAME static
        # musl minimald binaries the build-release-linux-* jobs already built and
        # ship, instead of recompiling minimald just for the initramfs. Downloads
        # those artifacts and stamps each into a newc cpio via build-initramfs.sh's
        # MINIMALD_BIN mode (no cargo/cross toolchain needed — just cpio). Files are
        # arch-suffixed to match the amd64/arm64 naming and avoid a
        # merge-multiple basename collision in the release job.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build-release-linux-amd64, build-release-linux-arm64]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Install cpio
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio
            - name: Download minimald (amd64)
              uses: actions/download-artifact@v8
              with:
                  name: minimald-linux-amd64
                  path: prebuilt
            - name: Download minimald (arm64)
              uses: actions/download-artifact@v8
              with:
                  name: minimald-linux-arm64
                  path: prebuilt
            - name: Pack initramfs (amd64)
              run: |
                  chmod +x prebuilt/minimald-linux-amd64
                  MINIMALD_BIN="$PWD/prebuilt/minimald-linux-amd64" \
                    ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs-amd64.cpio"
            - name: Pack initramfs (arm64)
              run: |
                  chmod +x prebuilt/minimald-linux-arm64
                  MINIMALD_BIN="$PWD/prebuilt/minimald-linux-arm64" \
                    ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs-arm64.cpio"
            - name: Upload initramfs (amd64)
              uses: actions/upload-artifact@v7
              with:
                  name: minimald-initramfs-amd64
                  path: ${{ runner.temp }}/initramfs-amd64.cpio
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload initramfs (arm64)
              uses: actions/upload-artifact@v7
              with:
                  name: minimald-initramfs-arm64
                  path: ${{ runner.temp }}/initramfs-arm64.cpio
                  if-no-files-found: error
                  retention-days: 7

    release:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs:
            [
                test,
                build-release-linux-amd64,
                build-release-linux-arm64,
                build-release-macos-arm64,
                sign-libkrun-macos-arm64,
                fetch-release-guest-artifacts,
                build-release-initramfs,
            ]
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - name: Generate release info
              id: release_info
              run: |
                  SHORT_SHA=$(git rev-parse --short=8 HEAD)
                  echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
                  echo "tag=release-$SHORT_SHA" >> $GITHUB_OUTPUT
                  echo "name=minimal-$SHORT_SHA" >> $GITHUB_OUTPUT
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: "*-*-*"
                  path: artifacts/
                  merge-multiple: true
            - name: Drop temp-prefixed artifacts
              run: rm -f artifacts/temp-*
            - name: Make binaries executable
              run: chmod +x artifacts/*-*-*
            - name: Generate completions
              run: |
                  mkdir -p artifacts/completions/{bash,zsh,fish}
                  artifacts/mip-linux-amd64 completions bash > artifacts/completions/bash/mip
                  artifacts/mip-linux-amd64 completions zsh  > artifacts/completions/zsh/_mip
                  artifacts/mip-linux-amd64 completions fish > artifacts/completions/fish/mip.fish
                  artifacts/minimal-linux-amd64 completions bash > artifacts/completions/bash/minimal
                  artifacts/minimal-linux-amd64 completions zsh  > artifacts/completions/zsh/_minimal
                  artifacts/minimal-linux-amd64 completions fish > artifacts/completions/fish/minimal.fish
                  artifacts/minimald-linux-amd64 completions bash > artifacts/completions/bash/minimald
                  artifacts/minimald-linux-amd64 completions zsh  > artifacts/completions/zsh/_minimald
                  artifacts/minimald-linux-amd64 completions fish > artifacts/completions/fish/minimald.fish
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: "289724348228"
                  workload_identity_provider: "projects/289724348228/locations/global/workloadIdentityPools/github/providers/gominimal"
            - name: Package and upload archive to GCS
              run: |
                  SHA=$(git rev-parse --short=8 HEAD)
                  tar --zstd -cf "minimalone-${SHA}.tar.zst" -C artifacts .

                  gcloud storage cp \
                    --cache-control="public, max-age=31536000, immutable" \
                    "minimalone-${SHA}.tar.zst" gs://minimal-shim/archives/
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tar -C artifacts/completions -czf artifacts/completions.tar.gz .
                  cd artifacts/
                  gh release create "${{ steps.release_info.outputs.tag }}" \
                    $(find . -maxdepth 1 -type f) \
                    --repo="${GITHUB_REPOSITORY}" \
                    --title="${{ steps.release_info.outputs.name }}"

    stage-installer:
        # Publish the release into gs://minimal-one in the layout the curl|bash
        # installer reads (docs/specs/07-spec-installer). It re-fetches the same
        # build artifacts and touches only gs://minimal-one.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [release]
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - name: Generate release info
              id: release_info
              run: |
                  SHORT_SHA=$(git rev-parse --short=8 HEAD)
                  echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: "*-*-*"
                  path: artifacts/
                  merge-multiple: true
            - name: Authenticate to Google Cloud (installer bucket)
              # Distinct project + workload-identity pool from the release job's
              # minimal-shim auth; this one grants write to gs://minimal-one.
              uses: google-github-actions/auth@v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"
            - name: Stage release into installer bucket
              # Upload versions/<sha>/{components,<artifacts>}. Inert on its own:
              # changes nothing users receive until a channel points at it.
              run: |
                  scripts/stage-release.sh \
                    --artifacts-dir artifacts \
                    --version "${{ steps.release_info.outputs.short_sha }}" \
                    --bucket gs://minimal-one
            - name: Stage the installer script into the versioned folder
              # Keep a version-pinned copy of the curl|sh installer next to the
              # components it reads, so each version's install path is immutable
              # and self-contained. Same immutable cache header as the other
              # versions/<sha>/ artifacts. Done before the channel advances so the
              # versioned folder is complete when anything points at it.
              run: |
                  gcloud storage cp \
                    --cache-control="public, max-age=31536000, immutable" \
                    scripts/install.sh \
                    "gs://minimal-one/versions/${{ steps.release_info.outputs.short_sha }}/install.sh"
            - name: Point unstable channel at this release
              # `unstable` auto-advances to every fresh build — it is the
              # bleeding-edge channel, so no approval gate. Promotion to `stable`
              # is the manual, gated promote-cli workflow.
              run: |
                  scripts/set-channel.sh \
                    --channel unstable \
                    --version "${{ steps.release_info.outputs.short_sha }}" \
                    --bucket gs://minimal-one
