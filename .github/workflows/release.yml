name: Release

# Two shapes of run, one pipeline:
#
#   * a NIGHTLY / plain dispatch build stages versions/<short-sha>/ and cuts a
#     `release-<sha>` GitHub Release (auto-pruned);
#   * a VERSIONED build (`versioned: true`) builds with
#     MINIMAL_RELEASE_VERSION = Cargo.toml package.version so every binary
#     reports the release version on an UNTAGGED commit, packages the
#     .deb/.rpm/.apk from the same bytes, generates the release notes, stages
#     versions/<semver>/ (binaries, manifest, pkg/, notes.md, install.sh),
#     and parks a DRAFT GitHub Release `v<semver>` with everything attached.
#
# Both then smoke the shipped artifacts in this same run and, on success,
# record versions/<version>/smoked — the provenance the promote workflow
# checks. The tag comes LAST: promote publishes the draft, which creates
# `v<semver>` on the already-smoked, already-promoted commit and triggers no
# build. No tag push ever builds here.
on:
    workflow_dispatch:
        inputs:
            versioned:
                description: "Cut a versioned release: build with MINIMAL_RELEASE_VERSION = Cargo.toml package.version, package .deb/.rpm/.apk, stage versions/<semver>/ with release notes, park a draft GitHub Release v<semver>. The tag is created by promote, last."
                type: boolean
                default: false
            dry_run:
                description: "Build, sign, and assemble everything but publish nothing (no GCS upload, no GitHub release, no installer-bucket write, no channel advance)."
                type: boolean
                default: false
            skip_ci_verify:
                description: "Bypass the verify-ci gate that requires this commit's five lane aggregators to be green. Admin override for a commit whose checks are known-good but unreported."
                type: boolean
                default: false
            restage:
                description: "Overwrite an already-staged versions/<version>/ row (staged rows are write-once). Only for re-running a versioned build that failed after staging; the re-run smokes and re-records provenance."
                type: boolean
                default: false
    # Invoked by nightly.yml, which depends on this run completing before it
    # flips the `nightly` channel. Inputs default to a real, verified,
    # sha-keyed (non-versioned) release.
    workflow_call:
        inputs:
            versioned:
                type: boolean
                default: false
            dry_run:
                type: boolean
                default: false
            skip_ci_verify:
                type: boolean
                default: false
            restage:
                type: boolean
                default: false

env:
    # Route package-cache reads through the R2 mirror. min binaries built
    # from branches predating minimal#1234 default the reader to gs:// and
    # bill GCS internet egress from the GHA runners (25-36 GB/day measured
    # 2026-08-18/19, gcs_access_logs). Harmless in jobs that never read the
    # package cache; the mutable index.shisha is edge-bypassed to live GCS.
    MINIMAL_REMOTE_CACHE_URL: https://cache.minimal.dev/
    CARGO_TERM_COLOR: always

# Serialize release runs so two manual dispatches can't race to cut a release
# from different commits at the same time.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    verify-ci:
        # Gate the release on the required CI checks having passed for the EXACT
        # commit being released, instead of re-running the workspace suite here
        # (the old `test` job duplicated ci-linux-native's `core-tests`). The five
        # lane aggregators are the required checks on `main` (ruleset 14240442);
        # assert each reported success on HEAD. The job always runs so `release`'s
        # `needs` is satisfied; `skip_ci_verify` short-circuits it to a pass for a
        # commit whose checks are green but unreported (admin override).
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            checks: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Verify required checks are green on this commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  SKIP: ${{ inputs.skip_ci_verify }}
              run: |
                  set -euo pipefail
                  if [ "$SKIP" = "true" ]; then
                    echo "::warning::skip_ci_verify set — bypassing the required-checks gate"
                    exit 0
                  fi
                  required="ci-success ci-linux-native-success ci-linux-kvm-success ci-macos-success ci-shell-installer-success"
                  sha="$(git rev-parse HEAD)"
                  # Latest conclusion per check-run name for this commit.
                  runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate \
                    --jq '.check_runs[] | "\(.name)\t\(.conclusion)"')"
                  fail=0
                  for name in $required; do
                    c="$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1==n {print $2}' | tail -1)"
                    if [ "$c" != "success" ]; then
                      echo "::error::required check '$name' is '${c:-missing}' on $sha (need success)"
                      fail=1
                    fi
                  done
                  [ "$fail" -eq 0 ] && echo "all five required checks are green on $sha"
                  exit "$fail"

    assert-version:
        # Resolve the version this run releases under, and fail before the
        # expensive builds if it is wrong.
        #
        # `version` is the staged row name and channel target: the short sha
        # for a nightly/plain build, the semver for a versioned one.
        # `release_version` is the semver for a versioned build and EMPTY
        # otherwise; every build job exports it as MINIMAL_RELEASE_VERSION,
        # which crates/version/build.rs bakes in verbatim (empty = unset, so
        # the nightly path keeps its `git describe` dev versions).
        #
        # The semver is Cargo.toml `package.version` — the declared next
        # release — and it must be exactly that: not yet tagged, and at least
        # what the Conventional Commits since the last release require
        # (scripts/next-version.sh --check, the same lint every PR runs).
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            release_version: ${{ steps.resolve.outputs.release_version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  # Full history + tags: the lint walks the commits since the
                  # last v* tag and checks the version is not already tagged.
                  fetch-depth: 0
                  fetch-tags: true
            - name: Resolve the release version
              id: resolve
              env:
                  VERSIONED: ${{ inputs.versioned }}
              run: |
                  set -euo pipefail
                  short_sha="$(git rev-parse --short=8 HEAD)"
                  release_version=""
                  if [ "$VERSIONED" = "true" ]; then
                    release_version="$(sed -n 's/^package\.version[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p' Cargo.toml | head -n 1)"
                    [ -n "$release_version" ] || { echo "::error::could not read package.version from Cargo.toml"; exit 1; }
                    if git rev-parse -q --verify "refs/tags/v$release_version" >/dev/null; then
                      echo "::error::v$release_version is already tagged — package.version must name the NEXT release (bump Cargo.toml)"
                      exit 1
                    fi
                    scripts/next-version.sh --check
                    version="$release_version"
                    echo "versioned release: $release_version (row versions/$version/, draft release v$release_version)"
                  else
                    version="$short_sha"
                    echo "sha-keyed release: row versions/$version/, release release-$short_sha"
                  fi
                  {
                    echo "version=$version"
                    echo "release_version=$release_version"
                  } >> "$GITHUB_OUTPUT"

    build-release-linux-amd64:
        runs-on: ubuntu-latest
        # 90m, matching arm64. The build step below links the three binaries one
        # at a time, so LTO links that used to overlap now serialize, and this
        # job builds minvmd natively on top of them. The old 60m cap was only
        # ever measured against the combined build, so it is not evidence this
        # shape fits; a cap only bounds a hang, and an early finish bills for the
        # time actually used.
        timeout-minutes: 90
        needs: [assert-version]
        # `CARGO_TARGET_<TRIPLE>_LINKER` is the documented env equivalent of the
        # `[target.<triple>] linker` config key (triple uppercased, dashes to
        # underscores). Set here rather than appended to `.cargo/config.toml` so
        # the build never mutates the checkout. Job-level env merges with the
        # workflow-level block above rather than replacing it.
        env:
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
            # Empty on a nightly/plain build (build.rs treats empty as unset).
            MINIMAL_RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
        steps:
            - name: Free Disk Space
              # Static release build of the full workspace; the cargo target dir
              # is the largest in any of the linux jobs. `remove_tool_cache: true`
              # is safe even without a `dtolnay/rust-toolchain` step — the
              # pre-installed Rust toolchain on ubuntu-latest lives in
              # `~/.rustup` + `~/.cargo`, not `/opt/hostedtoolcache`, so
              # `rustup target add` below still resolves.
              uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
              with:
                  remove_android: true
                  remove_dotnet: true
                  remove_haskell: true
                  remove_tool_cache: true
            # Full history + tags so crates/version's build.rs can figure out the version.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  fetch-tags: true
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
            - name: Add Rust target
              run: rustup target add x86_64-unknown-linux-musl
            - name: Cache Rust build artifacts (dependency-pruned)
              # Was a raw actions/cache of the entire target/ — the largest target
              # dir in the repo (multi-GB). Cached whole into the 10 GB per-repo
              # LRU it shares with every PR lane, it was evicted fast, so release
              # builds kept starting cold. rust-cache prunes target/ to just the
              # dependency artifacts (the costly aws-lc-sys/crypto compiles),
              # shrinking the entry so it survives; save-if keeps branch/dry-run
              # dispatches read-only so they don't churn the budget and evict
              # main's warm cache. Registry + git caches come for free.
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning] trusted-ref release build; save-if gates writes, provenance verified downstream
              with:
                  shared-key: release-amd64
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Build static libkrun (musl)
              # Staged BEFORE the build: scripts/dist-build.sh links minvmd
              # against this prefix, so LIBKRUN_PREFIX must be exported first.
              # Static libkrun.a from the vendored pin, so minvmd JOINS the
              # static-musl build instead of being the one binary that can't.
              # build.rs reads the .a there, selects a static link and records
              # no rpath. libkrunfw is not involved — minvmd supplies its own
              # kernel, and a static musl binary cannot dlopen one anyway.
              # See gominimal/minimal#1065.
              uses: ./.github/actions/build-libkrun-static-linux
              with:
                  target: x86_64-unknown-linux-musl
            - name: Build static release binaries
              # THE build entrypoint (scripts/dist-build.sh), shared with
              # downstream packaging so CI builds == downstream builds: one
              # cargo invocation per package so the fat-LTO links run one at a
              # time (recollapsing them is what SIGTERMed the arm64 job, exit
              # 143), and minvmd last, demanding the static libkrun the step
              # above staged so a stub build can never ship. See the script's
              # header for the full rationale and its env knobs.
              run: scripts/dist-build.sh x86_64-unknown-linux-musl
            - name: Rename binaries with platform suffix
              # download-artifact merge-multiple flattens every artifact into one
              # directory using each file's basename, so the uploaded files must
              # already carry a unique platform-suffixed name to avoid amd64/arm64
              # collisions and to match the paths used by the release job.
              run: |
                  cd target/x86_64-unknown-linux-musl/release
                  mv mip mip-linux-amd64
                  mv min minimal-linux-amd64
                  mv minimald minimald-linux-amd64
                  mv minvmd minvmd-linux-amd64
            - name: Upload binary (mip)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: mip-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/mip-linux-amd64
                  retention-days: 7
            - name: Upload binary (minimal)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimal-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/minimal-linux-amd64
                  retention-days: 7
            - name: Upload binary (minimald)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimald-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/minimald-linux-amd64
                  retention-days: 7
            - name: Verify minvmd is static and links libkrun
              # Both halves matter and neither is implied by a successful build:
              # a stub minvmd (build.rs found no libkrun) also compiles and
              # links, and would ship as a binary that bails at VM boot.
              run: |
                  set -euo pipefail
                  bin=target/x86_64-unknown-linux-musl/release/minvmd-linux-amd64
                  syms="$RUNNER_TEMP/minvmd-amd64.strings"
                  # Both spellings are static. x86_64-musl emits a static PIE,
                  # which file(1) calls "static-pie linked"; aarch64-musl emits a
                  # plain static executable, "statically linked". Neither has a
                  # PT_INTERP or a DT_NEEDED, which is the property we want.
                  file "$bin" | grep -qE 'statically linked|static-pie linked' \
                    || { echo "::error::$bin is not statically linked"; file "$bin"; exit 1; }
                  # The KVM backend's bindgen types are only present when libkrun
                  # is really linked in; the stub carries none of them.
                  #
                  # Dump once, then assert against the FILE, never against a live
                  # pipe: `grep -q` exits at its first match and SIGPIPEs the
                  # `strings -a` walking a ~10 MB binary, and under `pipefail`
                  # that producer's death fails the step — so a PASSING check
                  # reads as a stub build and kills a good release. Same reason
                  # scripts/build-libkrun-linux.sh materializes its nm output.
                  strings -a "$bin" > "$syms"
                  grep -q 'kvm_run' "$syms" \
                    || { echo "::error::$bin does not contain libkrun's KVM backend (stub build?)"; exit 1; }
                  echo "minvmd OK: static, libkrun linked ($(stat -c%s "$bin") bytes)"
            - name: Upload binary (minvmd)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-linux-amd64
                  path: target/x86_64-unknown-linux-musl/release/minvmd-linux-amd64
                  retention-days: 7

    build-release-linux-arm64:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 90
        needs: [assert-version]
        # See the amd64 job: cargo's env equivalent of `[target.<triple>]
        # linker`, so the build leaves the checkout untouched.
        env:
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
            MINIMAL_RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
        steps:
            - name: Free Disk Space
              # Static release build of the full workspace; the cargo target dir
              # is the largest in any of the linux jobs.
              #
              # Runs BEFORE checkout: the action copies a `bc` binary into its
              # working dir, which dirty's the checkout.
              uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
              with:
                  remove_android: true
                  remove_dotnet: true
                  remove_haskell: true
                  remove_tool_cache: true
            # Full history + tags so crates/version's build.rs can figure out the version.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  fetch-tags: true
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
            - name: Add Rust target
              run: rustup target add aarch64-unknown-linux-musl
            - name: Cache Rust build artifacts (dependency-pruned)
              # See the amd64 job: rust-cache replaces a raw multi-GB target/ cache
              # the 10 GB LRU evicted, which is why this build kept running
              # cold (~65m). Pruned to dependency artifacts so it survives; save-if
              # keeps branch/dry-run dispatches read-only. writes target/ and
              # reads ~/.cargo on the host, so rust-cache caches them the same as a
              # native build.
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning] trusted-ref release build; save-if gates writes, provenance verified downstream
              with:
                  shared-key: release-arm64
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Build static libkrun (musl)
              # See the amd64 job: staged before the build, because
              # scripts/dist-build.sh links minvmd against this prefix. arm64
              # had no minvmd artifact at all before this — the dynamic build
              # needed a native glibc host per arch, and only amd64 got one. A
              # static musl build has no such constraint, so the two Linux
              # arches finally ship the same set of binaries.
              uses: ./.github/actions/build-libkrun-static-linux
              with:
                  target: aarch64-unknown-linux-musl
            - name: Build static release binaries
              # See the amd64 job: the shared entrypoint (scripts/dist-build.sh),
              # one cargo invocation per package so the fat-LTO links run one
              # at a time — recollapsing them is what got this job SIGTERMed
              # (exit 143) on the 16 GB runner.
              run: scripts/dist-build.sh aarch64-unknown-linux-musl
            - name: Rename binaries with platform suffix
              # Platform-suffixed so download-artifact's merge-multiple basename
              # flatten does not collide with the amd64 build.
              run: |
                  cd target/aarch64-unknown-linux-musl/release
                  mv min minimal-linux-arm64
                  mv mip mip-linux-arm64
                  mv minimald minimald-linux-arm64
                  mv minvmd minvmd-linux-arm64
            - name: Upload binary (minimal)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimal-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/minimal-linux-arm64
                  retention-days: 7
            - name: Upload binary (mip)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: mip-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/mip-linux-arm64
                  retention-days: 7
            - name: Upload binary (minimald)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimald-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/minimald-linux-arm64
                  retention-days: 7
            - name: Verify minvmd is static and links libkrun
              # See the amd64 job: a stub minvmd builds and links cleanly too, so
              # neither half of this is implied by the build succeeding.
              run: |
                  set -euo pipefail
                  bin=target/aarch64-unknown-linux-musl/release/minvmd-linux-arm64
                  syms="$RUNNER_TEMP/minvmd-arm64.strings"
                  # See the amd64 job for why both file(1) spellings are accepted,
                  # and why the symbol check runs against a dumped file rather
                  # than a live `strings | grep -q` pipe under pipefail.
                  file "$bin" | grep -qE 'statically linked|static-pie linked' \
                    || { echo "::error::$bin is not statically linked"; file "$bin"; exit 1; }
                  strings -a "$bin" > "$syms"
                  grep -q 'kvm_run' "$syms" \
                    || { echo "::error::$bin does not contain libkrun's KVM backend (stub build?)"; exit 1; }
                  echo "minvmd OK: static, libkrun linked ($(stat -c%s "$bin") bytes)"
            - name: Upload binary (minvmd)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-linux-arm64
                  path: target/aarch64-unknown-linux-musl/release/minvmd-linux-arm64
                  retention-days: 7

    build-release-macos-arm64:
        # Self-hosted Apple Silicon runner. minvmd links libkrun (Hypervisor.framework
        # backend) via `#[link(name = "krun")]` and builds the real (non-stub) impl
        # only on macOS against a provisioned libkrun — it can't join the static-musl
        # cross builds above, so it's built natively here (mirrors ci-macos.yml's
        # build-macos). Gated on RUN_MACOS_CI so it's skipped while the single
        # self-hosted runner is offline — a skip here also skips `release`, which
        # needs it.
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 45
        needs: [assert-version]
        if: vars.RUN_MACOS_CI != 'false'
        env:
            MINIMAL_RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # Don't leave git credentials on the persistent self-hosted runner.
                  persist-credentials: false
                  # Full history + tags so crates/version's build.rs can figure out the version.
                  fetch-depth: 0
                  fetch-tags: true
            - name: Toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable
            - name: Provision libkrun (pinned own build)
              uses: ./.github/actions/setup-libkrun-macos
            - name: Build release minvmd binary
              run: cargo build --release --locked -p minvmd --bin minvmd
            - name: Rewrite + verify minvmd libkrun linkage (@rpath)
              # Retarget Homebrew's absolute libkrun install name to the shipped
              # bin/../lib layout and verify the result (rpath entries, no
              # non-system deps). Extracted to scripts/ so a future CI lane can
              # exercise the production rewrite per-PR; release is currently its
              # only consumer. Signing happens below, as the last mutation
              # before upload.
              run: scripts/rewrite-macos-linkage.sh target/release/minvmd
            - name: Build release minimal binary
              # Separate cargo invocation from minvmd above, so its default
              # `libkrun` feature can't unify into the CLI (which opts out via
              # default-features = false). Gated next.
              run: cargo build --release --locked -p minimal --bin min
            - name: Verify minimal links only system libraries
              # The CLI calls no libkrun (it spawns minvmd as a subprocess), so
              # every dependency must be under /usr/lib or /System. A krun line
              # means the default-features = false opt-out regressed.
              run: |
                  otool -L target/release/min
                  bad="$(otool -L target/release/min | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^(/usr/lib/|/System/)' || true)"
                  if [ -n "$bad" ]; then
                    echo "::error::minimal links non-system libraries (allowed: /usr/lib, /System):" >&2
                    printf '%s\n' "$bad" >&2
                    exit 1
                  fi
            - name: Rename binaries with platform suffix
              # download-artifact merge-multiple flattens on basename, so the uploaded
              # file must already carry the platform-suffixed name the release job expects.
              run: |
                  mv target/release/minvmd target/release/minvmd-macos-arm64
                  mv target/release/min target/release/minimal-macos-arm64
            - name: Codesign binaries with Developer ID
              # Sign the two shipped Mach-O binaries with the Developer ID
              # Application identity held in the runner's signing keychain. This
              # is the LAST mutation before upload.
              # Hardened runtime (--options runtime) + a secure --timestamp so the
              # artifacts are notarization-ready.
              env:
                  KC_PW: ${{ secrets.KC_PW }}
              run: |
                  KC=minimal-signing.keychain-db
                  IDENTITY="Developer ID Application: Minimal Software Research Ltd. (3G47C5HY64)"

                  # Unlock the signing keychain and put it on the search list so
                  # codesign can resolve the identity by name.
                  security unlock-keychain -p "$KC_PW" "$KC"
                  security list-keychains -d user -s "$KC" login.keychain-db

                  codesign --force --timestamp --options runtime \
                    --sign "$IDENTITY" \
                    --entitlements crates/minvmd/minvmd.entitlements \
                    target/release/minvmd-macos-arm64
                  codesign --force --timestamp --options runtime \
                    --sign "$IDENTITY" \
                    target/release/minimal-macos-arm64

                  codesign --verify --strict --verbose=2 target/release/minvmd-macos-arm64
                  codesign --verify --strict --verbose=2 target/release/minimal-macos-arm64
            - name: Upload binary (minvmd)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-macos-arm64
                  path: target/release/minvmd-macos-arm64
                  retention-days: 7
            - name: Upload binary (minimal)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimal-macos-arm64
                  path: target/release/minimal-macos-arm64
                  retention-days: 7

    build-libkrun-macos-arm64:
        # Build the TRIMMED libkrun.dylib to SHIP in the release, so macOS users
        # don't have to `brew install` it themselves. Same setup-libkrun-macos
        # composite (scripts/build-libkrun-macos.sh at the vendor/libkrun/
        # libkrun.lock pin) that every macOS CI lane links and boots against —
        # the shipped dylib is BY CONSTRUCTION the one CI tested. GitHub-hosted
        # macos-latest is Apple Silicon (arm64).
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable
            - name: Provision libkrun (pinned own build)
              uses: ./.github/actions/setup-libkrun-macos
            - name: Stage the dylib for signing
              # The build script already asserted self-containment (no
              # /opt/homebrew or /usr/local deps) and the krun_add_disk3 API
              # floor, set the @rpath/libkrun.1.dylib install name, and ad-hoc
              # signed it.
              run: cp "$LIBKRUN_PREFIX/libkrun.1.dylib" "$RUNNER_TEMP/temp-libkrun-macos-arm64.dylib"
            - name: Upload ad-hoc-signed libkrun dylib (temp)
              # This GitHub-hosted runner has no access to the Developer ID signing
              # keychain, so the dylib leaves here only ad-hoc signed, under a
              # `temp-` prefixed name. sign-macos-artifacts (self-hosted) downloads
              # it, re-signs with Developer ID, and re-uploads under the final
              # `libkrun-macos-arm64` name. The release job drops any leftover
              # `temp-` artifact so the ad-hoc copy never ships.
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: temp-libkrun-macos-arm64
                  path: ${{ runner.temp }}/temp-libkrun-macos-arm64.dylib
                  if-no-files-found: error
                  retention-days: 7

    sign-macos-artifacts:
        # Developer ID signing for the macOS artifacts built on normal runners.
        #
        # Artifacts come as the output of other jobs under a `temp-` prefixed
        # artifact, are signed on the self-hosted runner that holds the keychain,
        # then are re-uploaded under their final names.
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 15
        if: vars.RUN_MACOS_CI != 'false'
        needs: [build-libkrun-macos-arm64, fetch-release-guest-artifacts]
        steps:
            - name: Download unsigned macOS artifacts (temp)
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: temp-*
                  path: ${{ runner.temp }}/unsigned
                  merge-multiple: true
            - name: Codesign macOS artifacts with Developer ID
              # Sign with the same Developer ID identity, secure --timestamp, and
              # hardened runtime (--options runtime) as the binaries so the whole
              # install is notarization-ready. --force replaces each file's existing
              # signature (build-libkrun-macos.sh's ad-hoc on libkrun, the Go
              # linker's ad-hoc on gvproxy). No entitlements: neither libkrun (a library) nor gvproxy
              # (the network switch) is the hypervisor entry point. The temp- prefix
              # is dropped so each file carries the final basename the
              # archive/installer expect.
              env:
                  KC_PW: ${{ secrets.KC_PW }}
              run: |
                  KC=minimal-signing.keychain-db
                  IDENTITY="Developer ID Application: Minimal Software Research Ltd. (3G47C5HY64)"

                  security unlock-keychain -p "$KC_PW" "$KC"
                  security list-keychains -d user -s "$KC" login.keychain-db

                  in="$RUNNER_TEMP/unsigned"
                  out="$RUNNER_TEMP/signed"
                  mkdir -p "$out"
                  cp "$in/temp-libkrun-macos-arm64.dylib" "$out/libkrun-macos-arm64.dylib"
                  cp "$in/temp-gvproxy-darwin-arm64"      "$out/gvproxy-darwin-arm64"

                  for f in "$out/libkrun-macos-arm64.dylib" "$out/gvproxy-darwin-arm64"; do
                    codesign --force --timestamp --options runtime --sign "$IDENTITY" "$f"
                    codesign --verify --strict --verbose=2 "$f"
                  done
            - name: Upload signed libkrun dylib
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: libkrun-macos-arm64
                  path: ${{ runner.temp }}/signed/libkrun-macos-arm64.dylib
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload signed gvproxy (darwin-arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: gvproxy-darwin-arm64
                  path: ${{ runner.temp }}/signed/gvproxy-darwin-arm64
                  if-no-files-found: error
                  retention-days: 7

    fetch-release-guest-artifacts:
        # Fetched guest microVM artifacts shipped in the release: the raw guest
        # kernel Image, the ext4 rootfs image, and the pinned gvproxy switch
        # binary. These are already produced piecemeal in the CI lanes
        # (ci-macos.yml, ci-linux-kvm.yml, ci-gvproxy.yml); this job gathers them
        # into the release. The initramfs is packed separately in
        # build-release-initramfs, which reuses the minimald-linux-* binaries.
        #
        # None require the target host's arch to produce: the kernel and rootfs are
        # cache pulls keyed by the pinned upstream commit (the materialize action
        # pulls any guest arch on an x86_64 runner), and gvproxy is a pin-verified
        # download of the upstream release binary. So a single x86_64 runner emits
        # both the amd64 and arm64 variants, covering every release host
        # (linux-amd64/arm64, macos-arm64). Files are arch-suffixed so
        # download-artifact's merge-multiple basename-flatten in the release job
        # doesn't collide.
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            # NOTE: the `arch` input is the kernel-style target arch
            # (x86_64/aarch64); only the emitted file/artifact names use the
            # amd64/arm64 suffixes the release binaries already use.
            - name: Materialize guest kernel (raw Image, amd64)
              uses: ./.github/actions/materialize
              with:
                  output: virtio-kernel
                  dest: ${{ runner.temp }}/vmlinuz-amd64
                  arch: x86_64
                  channel: unstable
            - name: Materialize guest kernel (raw Image, arm64)
              uses: ./.github/actions/materialize
              with:
                  output: virtio-kernel
                  dest: ${{ runner.temp }}/vmlinuz-arm64
                  arch: aarch64
                  channel: unstable
            - name: Materialize guest rootfs (ext4 image, amd64)
              uses: ./.github/actions/materialize
              with:
                  output: minvmd-rootfs
                  dest: ${{ runner.temp }}/rootfs-amd64.img
                  arch: x86_64
                  channel: unstable
            - name: Materialize guest rootfs (ext4 image, arm64)
              uses: ./.github/actions/materialize
              with:
                  output: minvmd-rootfs
                  dest: ${{ runner.temp }}/rootfs-arm64.img
                  arch: aarch64
                  channel: unstable
            - name: Fetch pinned gvproxy (linux-amd64)
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/gvproxy-linux-amd64" gvproxy-linux-amd64
            - name: Fetch pinned gvproxy (linux-arm64)
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/gvproxy-linux-arm64" gvproxy-linux-arm64
            - name: Fetch pinned gvproxy (darwin-arm64)
              # Stashed as a `temp-` so sign-macos-artifacts (self-hosted) can sign it
              run: ./scripts/fetch-gvproxy.sh "$RUNNER_TEMP/temp-gvproxy-darwin-arm64" gvproxy-darwin
            - name: Upload kernel (amd64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: virtio-kernel-amd64
                  path: ${{ runner.temp }}/vmlinuz-amd64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload kernel (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: virtio-kernel-arm64
                  path: ${{ runner.temp }}/vmlinuz-arm64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload rootfs (amd64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-rootfs-amd64
                  path: ${{ runner.temp }}/rootfs-amd64.img
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload rootfs (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minvmd-rootfs-arm64
                  path: ${{ runner.temp }}/rootfs-arm64.img
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload gvproxy (linux-amd64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: gvproxy-linux-amd64
                  path: ${{ runner.temp }}/gvproxy-linux-amd64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload gvproxy (linux-arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: gvproxy-linux-arm64
                  path: ${{ runner.temp }}/gvproxy-linux-arm64
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload gvproxy (darwin-arm64, temp/unsigned)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: temp-gvproxy-darwin-arm64
                  path: ${{ runner.temp }}/temp-gvproxy-darwin-arm64
                  if-no-files-found: error
                  retention-days: 7

    build-release-initramfs:
        # Pack the guest initramfs (minimald as pid-1 /init) from the SAME static
        # musl minimald binaries the build-release-linux-* jobs already built and
        # ship, instead of recompiling minimald just for the initramfs. Downloads
        # those artifacts and stamps each into a newc cpio via build-initramfs.sh's
        # MINIMALD_BIN mode (no cargo/cross toolchain needed — just cpio). Files are
        # arch-suffixed to match the amd64/arm64 naming and avoid a
        # merge-multiple basename collision in the release job.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build-release-linux-amd64, build-release-linux-arm64]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Install cpio
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio
            - name: Download minimald (amd64)
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-linux-amd64
                  path: prebuilt
            - name: Download minimald (arm64)
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-linux-arm64
                  path: prebuilt
            - name: Pack initramfs (amd64)
              run: |
                  chmod +x prebuilt/minimald-linux-amd64
                  MINIMALD_BIN="$PWD/prebuilt/minimald-linux-amd64" \
                    ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs-amd64.cpio"
            - name: Pack initramfs (arm64)
              run: |
                  chmod +x prebuilt/minimald-linux-arm64
                  MINIMALD_BIN="$PWD/prebuilt/minimald-linux-arm64" \
                    ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs-arm64.cpio"
            - name: Upload initramfs (amd64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimald-initramfs-amd64
                  path: ${{ runner.temp }}/initramfs-amd64.cpio
                  if-no-files-found: error
                  retention-days: 7
            - name: Upload initramfs (arm64)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: minimald-initramfs-arm64
                  path: ${{ runner.temp }}/initramfs-arm64.cpio
                  if-no-files-found: error
                  retention-days: 7

    compute-version-string:
        # Read the version straight out of a shipped binary so the GitHub Release
        # NAME is exactly what `min -V` reports — one source of truth.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: [assert-version, build-release-linux-amd64]
        outputs:
            version: ${{ steps.read.outputs.version }}
        steps:
            - name: Download minimald (amd64)
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-linux-amd64
            - name: Read version from the built binary
              id: read
              env:
                  RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
              run: |
                  set -euo pipefail
                  chmod +x minimald-linux-amd64
                  # "-V" => "minimald <version>"; take the version field.
                  ver="$(./minimald-linux-amd64 -V | awk '{print $2}')"
                  [ -n "$ver" ] || { echo "::error::could not read version from binary"; exit 1; }
                  # A versioned build must report exactly the release version:
                  # the override is what makes the tag-last flow sound.
                  if [ -n "$RELEASE_VERSION" ] && [ "$ver" != "$RELEASE_VERSION" ]; then
                    echo "::error::built binary reports '$ver' but this is a versioned build of '$RELEASE_VERSION' (MINIMAL_RELEASE_VERSION not honoured?)"
                    exit 1
                  fi
                  echo "version=$ver" >> "$GITHUB_OUTPUT"
                  echo "resolved release version: $ver"

    release:
        # Assemble everything: completions, the legacy archive, the release
        # notes, and (versioned) the distro packages; then cut the GitHub
        # Release — `release-<sha>` for a nightly/plain build, or a DRAFT
        # `v<semver>` for a versioned one, which promote publishes later
        # (publishing the draft is what creates the tag).
        runs-on: ubuntu-latest
        timeout-minutes: 40
        needs:
            [
                verify-ci,
                assert-version,
                build-release-linux-amd64,
                build-release-linux-arm64,
                build-release-macos-arm64,
                sign-macos-artifacts,
                fetch-release-guest-artifacts,
                build-release-initramfs,
                compute-version-string,
            ]
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  # Full history + tags: the release notes walk the commits
                  # since the last released tag.
                  fetch-depth: 0
                  fetch-tags: true
            - name: Generate release info
              id: release_info
              env:
                  RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
              run: |
                  # A versioned build parks a draft `v<semver>` release on this
                  # commit; the sha-based dispatch/nightly flow keeps its
                  # release-<sha> tag, which the installer bucket layout and
                  # channel pointers key off. Either way the release NAME uses
                  # the version string (Create Release step).
                  SHORT_SHA=$(git rev-parse --short=8 HEAD)
                  echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  if [ -n "$RELEASE_VERSION" ]; then
                    echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=release-$SHORT_SHA" >> "$GITHUB_OUTPUT"
                  fi
            - name: Generate release notes
              # One walk of the full commit bodies since the last released tag
              # (scripts/next-version.sh), so a BREAKING CHANGE footer under a
              # plain subject is rendered, not dropped. Titled with
              # package.version — the versioned release's own number; on a
              # nightly it names the release the commits are heading toward.
              run: scripts/next-version.sh --notes "$RUNNER_TEMP/notes.md"
            - name: Upload release notes
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-notes
                  path: ${{ runner.temp }}/notes.md
                  if-no-files-found: error
                  retention-days: 7
            - name: Download artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: "*-*-*"
                  path: artifacts/
                  merge-multiple: true
            - name: Drop temp-prefixed artifacts
              run: rm -f artifacts/temp-*
            - name: Make binaries executable
              run: chmod +x artifacts/*-*-*
            - name: Build the distro packages (versioned release only)
              # .deb/.rpm/.apk for both Linux arches from THIS run's binaries
              # (ARTIFACTS_DIR mode, no bucket round-trip), via the pinned
              # nfpm. They are attached to the draft release below, staged as
              # versions/<semver>/pkg/ by stage-installer, and the .deb is
              # install-smoked by smoke-linux-amd64 — all the same bytes.
              if: ${{ needs.assert-version.outputs.release_version != '' }}
              env:
                  PKGVER: ${{ needs.assert-version.outputs.release_version }}
                  ARTIFACTS_DIR: artifacts
                  OUT_DIR: ${{ runner.temp }}/dist
              run: scripts/package-nfpm.sh
            - name: Upload distro packages
              if: ${{ needs.assert-version.outputs.release_version != '' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: packages
                  path: ${{ runner.temp }}/dist/
                  if-no-files-found: error
                  retention-days: 7
            - name: Generate completions
              # `min` splits printing from installing (`completions print
              # <shell>`); `mip` and `minimald` keep the flat verb. The `min`
              # files are named for the `min` binary, not the crate — the shim
              # it prints registers the command `min`, so a shell only autoloads
              # it from a file of that name.
              run: |
                  mkdir -p artifacts/completions/{bash,zsh,fish}
                  artifacts/mip-linux-amd64 completions bash > artifacts/completions/bash/mip
                  artifacts/mip-linux-amd64 completions zsh  > artifacts/completions/zsh/_mip
                  artifacts/mip-linux-amd64 completions fish > artifacts/completions/fish/mip.fish
                  artifacts/minimal-linux-amd64 completions print bash > artifacts/completions/bash/min
                  artifacts/minimal-linux-amd64 completions print zsh  > artifacts/completions/zsh/_min
                  artifacts/minimal-linux-amd64 completions print fish > artifacts/completions/fish/min.fish
                  artifacts/minimald-linux-amd64 completions bash > artifacts/completions/bash/minimald
                  artifacts/minimald-linux-amd64 completions zsh  > artifacts/completions/zsh/_minimald
                  artifacts/minimald-linux-amd64 completions fish > artifacts/completions/fish/minimald.fish
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: "289724348228"
                  workload_identity_provider: "projects/289724348228/locations/global/workloadIdentityPools/github/providers/gominimal"
            - name: Package and upload archive to GCS
              env:
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  SHA=$(git rev-parse --short=8 HEAD)
                  tar --zstd -cf "minimalone-${SHA}.tar.zst" -C artifacts .
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "::notice::dry_run — packaged minimalone-${SHA}.tar.zst but skipping GCS upload"
                    exit 0
                  fi
                  gcloud storage cp \
                    --cache-control="public, max-age=31536000, immutable" \
                    "minimalone-${SHA}.tar.zst" gs://minimal-shim/archives/
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  REL_TAG: ${{ steps.release_info.outputs.tag }}
                  REL_TITLE: minimal ${{ needs.compute-version-string.outputs.version }}
                  REL_SHA: ${{ steps.release_info.outputs.sha }}
                  RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
                  NOTES: ${{ runner.temp }}/notes.md
                  DIST: ${{ runner.temp }}/dist
              run: |
                  set -euo pipefail
                  tar -C artifacts/completions -czf artifacts/completions.tar.gz .
                  if [ -n "$RELEASE_VERSION" ]; then
                    cp "$DIST"/* artifacts/
                  fi
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "::notice::dry_run — assembled release artifacts but skipping GitHub release create"
                    exit 0
                  fi
                  extra=()
                  if [ -n "$RELEASE_VERSION" ]; then
                    # Versioned: a DRAFT parked on this commit. Drafts create no
                    # tag; promote publishes it (publish-packages.yml), and THAT
                    # creates v<semver> — last, on a smoked and promoted commit.
                    # A pre-release version (one with a `-` suffix) is marked a
                    # GitHub prerelease so it never shows as "Latest". A
                    # leftover draft from an earlier attempt at the same version
                    # is replaced (it was never published).
                    extra+=(--draft --target "$REL_SHA")
                    case "$RELEASE_VERSION" in
                      *-*) extra+=(--prerelease) ;;
                    esac
                    if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
                      echo "replacing the leftover draft $REL_TAG"
                      gh release delete "$REL_TAG" --repo "$GITHUB_REPOSITORY" --yes
                    fi
                  fi
                  cd artifacts/
                  # find output is intentionally word-split so each artifact becomes
                  # its own positional arg to `gh release create`; quoting would break it.
                  # shellcheck disable=SC2046
                  gh release create "$REL_TAG" \
                    $(find . -maxdepth 1 -type f) \
                    --repo="${GITHUB_REPOSITORY}" \
                    --title="$REL_TITLE" \
                    --notes-file "$NOTES" \
                    "${extra[@]}"

    stage-installer:
        # Publish the release into gs://minimal-one in the layout the curl|bash
        # installer reads (docs/specs/07-spec-installer): ONE write-once row,
        # versions/<version>/ — the short sha for a nightly/plain build, the
        # semver for a versioned one — holding the binaries, the `components`
        # manifest, the version-pinned install.sh, the release notes, and
        # (versioned) pkg/ with the .deb/.rpm/.apk. It re-fetches the same
        # build artifacts and touches only gs://minimal-one. Wholly a publish
        # step, so it is skipped entirely on a dry run.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [assert-version, release]
        if: ${{ !inputs.dry_run }}
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Download artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: "*-*-*"
                  path: artifacts/
                  merge-multiple: true
            - name: Download release notes
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: release-notes
                  path: ${{ runner.temp }}/notes
            - name: Download distro packages (versioned release only)
              if: ${{ needs.assert-version.outputs.release_version != '' }}
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: packages
                  path: ${{ runner.temp }}/dist
            - name: Authenticate to Google Cloud (installer bucket)
              # Distinct project + workload-identity pool from the release job's
              # minimal-shim auth; this one grants write to gs://minimal-one.
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"
            - name: Stage release into installer bucket
              # Upload versions/<version>/{components,<artifacts>,install.sh,
              # notes.md[,pkg/]}. Inert on its own: changes nothing users
              # receive until a channel points at it. Staged rows are
              # write-once — a row that already exists fails here before any
              # object is touched — unless `restage` was set to re-run a
              # versioned build that failed after staging.
              env:
                  VERSION: ${{ needs.assert-version.outputs.version }}
                  RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
                  RESTAGE: ${{ inputs.restage }}
                  NOTES: ${{ runner.temp }}/notes/notes.md
                  DIST: ${{ runner.temp }}/dist
              run: |
                  set -euo pipefail
                  args=(--artifacts-dir artifacts --version "$VERSION" --bucket gs://minimal-one)
                  args+=(--extra scripts/install.sh --extra "$NOTES")
                  [ -z "$RELEASE_VERSION" ] || args+=(--pkg-dir "$DIST")
                  [ "$RESTAGE" != "true" ] || args+=(--restage)
                  scripts/stage-release.sh "${args[@]}"

    # --- Smoke: prove the artifacts this run just built actually run, BEFORE
    # anything can point a channel at them. Each smoke job downloads the
    # uploaded artifacts by name, puts the SHIPPED binaries on PATH (never a
    # fresh target/ build), and runs the ONE shared session e2e
    # (scripts/session-e2e.sh — the same proof the CI lanes run). The smokes
    # gate `record-smoked` via the `smoke-success` aggregator below, and that
    # marker is what promote's provenance gate reads: a version nobody smoked
    # is not promotable. They run on dry runs too (a rehearsal that skips its
    # smoke proves nothing); only the recording is skipped.

    smoke-linux-amd64:
        # DM2 (native minimald on the host, no VM): the SHIPPED static-musl
        # `min`/`minimald` — downloaded back by name — must auto-spawn a daemon
        # and pass the session e2e. Mirrors ci-linux-native's `native-daemon-e2e`
        # job, but against the release artifacts instead of a target/debug build.
        # A versioned build additionally installs the .deb it packaged and
        # checks the installed `min` reports the release version.
        needs: [assert-version, release]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Download shipped min
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimal-linux-amd64
                  path: ${{ runner.temp }}/bin
            - name: Download shipped minimald
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-linux-amd64
                  path: ${{ runner.temp }}/bin
            - name: Put the shipped binaries on PATH
              # download-artifact drops each file under its platform-suffixed
              # name; the CLI autospawns the daemon by the bare `minimald` name
              # and users invoke `min`, so rename both and prepend the dir to PATH.
              run: |
                  set -euo pipefail
                  BIN="$RUNNER_TEMP/bin"
                  mv "$BIN/minimal-linux-amd64" "$BIN/min"
                  mv "$BIN/minimald-linux-amd64" "$BIN/minimald"
                  chmod +x "$BIN/min" "$BIN/minimald"
                  echo "$BIN" >> "$GITHUB_PATH"
            - name: Enable unprivileged user namespaces
              # The session sandbox (hakoniwa) needs userns; Ubuntu 24.04
              # restricts them via AppArmor by default. Mirrors the native lane.
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            - name: Cache minimal package cache
              # Session creation materializes the project's stack via cache pulls
              # keyed by the pinned upstream commit; carry it across runs so the
              # smoke isn't dominated by pulls. The e2e resets XDG_STATE_HOME /
              # XDG_RUNTIME_DIR but leaves XDG_CACHE_HOME alone for this reason.
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/minimal
                  key: smoke-amd64-minimal-cache-${{ hashFiles('.minimal/minimal.toml') }}
                  restore-keys: smoke-amd64-minimal-cache-
            - name: Session e2e (shipped native minimald)
              # No E2E_* knobs: native target, host daemon, and the e2e seeds its
              # own project workspace (E2E_PROJECT_DIR defaults to the checkout).
              run: ./scripts/session-e2e.sh
            - name: Download the distro packages (versioned release only)
              if: ${{ needs.assert-version.outputs.release_version != '' }}
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: packages
                  path: ${{ runner.temp }}/pkg
            - name: Install the .deb and check the version it reports
              # The package is installed from the file (no repo), so this
              # proves the .deb built from this run's bytes installs on a
              # stock Ubuntu and its `min` reports the release version. Runs
              # AFTER the e2e so the PATH-first shipped binaries above are what
              # the e2e exercised; /usr/bin/min is addressed explicitly.
              if: ${{ needs.assert-version.outputs.release_version != '' }}
              env:
                  RELEASE_VERSION: ${{ needs.assert-version.outputs.release_version }}
                  PKG: ${{ runner.temp }}/pkg
              run: |
                  set -euo pipefail
                  deb="$(find "$PKG" -maxdepth 1 -name '*amd64*.deb' | head -n 1)"
                  [ -n "$deb" ] || { echo "::error::no amd64 .deb among the packages"; ls -l "$PKG"; exit 1; }
                  sudo apt-get install -y "$deb"
                  got="$(/usr/bin/min -V | awk '{print $2}')"
                  [ "$got" = "$RELEASE_VERSION" ] \
                    || { echo "::error::installed min reports '$got', expected '$RELEASE_VERSION'"; exit 1; }
                  echo "installed $(basename "$deb"): min -V reports $got"

    smoke-linux-kvm:
        # DM3 (native Linux + a minvmd/libkrun microVM): boot a REAL microVM from
        # the SHIPPED minvmd and pass the session e2e over the vsock bridge, the
        # same proof ci-linux-kvm's `test-kvm` runs. Every moving part is a
        # downloaded release artifact: the static-musl `minvmd`, the guest kernel
        # + ext4 rootfs + initramfs, and the pinned gvproxy switch. Nothing is
        # materialized and no LD_LIBRARY_PATH is set — minvmd links libkrun
        # statically and dlopens nothing, so the host needs no libkrun at all.
        needs: [release]
        runs-on: ubuntu-latest # x86_64; KVM-capable
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Enable /dev/kvm access
              # GitHub-hosted x86_64 Linux runners expose /dev/kvm but the runner
              # user is not in the `kvm` group; widen the node so libkrun can open
              # it. Fail fast if this runner has no KVM at all. (Ported from
              # ci-linux-kvm's test-kvm.)
              run: |
                  if [ ! -e /dev/kvm ]; then
                    echo "::error::/dev/kvm not present on this runner; cannot boot the microVM." >&2
                    exit 1
                  fi
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                    | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
                  ls -l /dev/kvm
            - name: Enable unprivileged user namespaces
              # Ubuntu 24.04 restricts unprivileged userns via AppArmor by
              # default, and the sandboxed build the session e2e drives needs it.
              # (This used to be justified by the libkrun `mip materialize` step,
              # which a static minvmd made unnecessary; the e2e's own need for
              # userns is unchanged, so the sysctl stays.)
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            - name: Download shipped linux-amd64 binaries
              # Pulls min, minvmd, mip and gvproxy (plus minimald, unused on the
              # host — it ships inside the initramfs). `*-linux-amd64` is a clean
              # glob here: only darwin artifacts carry the `temp-` prefix.
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: "*-linux-amd64"
                  path: ${{ runner.temp }}/bin
                  merge-multiple: true
            - name: Download shipped guest kernel
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: virtio-kernel-amd64
                  path: ${{ runner.temp }}/guest
            - name: Download shipped guest rootfs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minvmd-rootfs-amd64
                  path: ${{ runner.temp }}/guest
            - name: Download shipped guest initramfs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-initramfs-amd64
                  path: ${{ runner.temp }}/guest
            - name: Put the shipped binaries on PATH
              # Rename off the platform suffix and prepend to PATH so `min`
              # autospawns `minvmd` by bare name. gvproxy is NOT resolved from
              # PATH — minvmd only honours MINVMD_GVPROXY_BIN, the installer
              # bin dir, or /usr/lib/minimal/bin (see resolve_gvproxy_path) —
              # so the e2e step below points MINVMD_GVPROXY_BIN at it.
              run: |
                  set -euo pipefail
                  BIN="$RUNNER_TEMP/bin"
                  mv "$BIN/minimal-linux-amd64" "$BIN/min"
                  mv "$BIN/minvmd-linux-amd64" "$BIN/minvmd"
                  mv "$BIN/mip-linux-amd64" "$BIN/mip"
                  mv "$BIN/gvproxy-linux-amd64" "$BIN/gvproxy"
                  chmod +x "$BIN/min" "$BIN/minvmd" "$BIN/mip" "$BIN/gvproxy"
                  echo "$BIN" >> "$GITHUB_PATH"
            - name: Verify the shipped minvmd needs no libkrun at runtime
              # The shipped minvmd links libkrun statically and dlopens nothing,
              # so this job no longer materializes a libkrun prefix or sets
              # LD_LIBRARY_PATH. Assert that rather than assume it: a regression
              # to a dynamic build would otherwise surface as a confusing
              # loader error mid-boot, and the smoke's whole point is to run the
              # artifact exactly as a user receives it.
              run: |
                  set -euo pipefail
                  bin="$RUNNER_TEMP/bin/minvmd"
                  # x86_64-musl emits a static PIE, which file(1) reports as
                  # "static-pie linked"; aarch64-musl reports "statically linked".
                  file "$bin" | grep -qE 'statically linked|static-pie linked' \
                    || { echo "::error::shipped minvmd is not statically linked"; file "$bin"; exit 1; }
                  echo "shipped minvmd is self-contained; no libkrun on the host"
            - name: Point the microVM env at the shipped guest artifacts
              run: |
                  {
                    echo "MINVMD_KERNEL_PATH=$RUNNER_TEMP/guest/vmlinuz-amd64"
                    echo "MINVMD_ROOTFS_PATH=$RUNNER_TEMP/guest/rootfs-amd64.img"
                    echo "MINVMD_INITRAMFS=$RUNNER_TEMP/guest/initramfs-amd64.cpio"
                  } >> "$GITHUB_ENV"
            - name: Session e2e (shipped minvmd microVM)
              # activate must auto-spawn minvmd, boot the guest, and round-trip a
              # session. E2E_PROJECT_DIR=/tmp — the guest sees no host project dir
              # yet (no project sync), and /tmp exists in the guest image.
              # MINVMD_GVPROXY_BIN: without it minvmd boots the VM switchless
              # (gvproxy resolution is best-effort and never errors) and every
              # guest egress — including the in-guest `pkgs` clone during
              # session mint — dies with "Could not resolve host".
              env:
                  MINVMD_BOOT_LOG: ${{ runner.temp }}/cli-e2e-boot.log
                  MINVMD_GVPROXY_BIN: ${{ runner.temp }}/bin/gvproxy
              run: E2E_VM=1 E2E_MINIMAL_ARGS="--provider local-minvmd" E2E_PROJECT_DIR=/tmp ./scripts/session-e2e.sh
            - name: Reap leftover VM processes
              # The autospawned minvmd can leak a __krun-vmm child on a failed
              # teardown; reap defensively (ported from test-kvm). The runner is
              # ephemeral, so this is hygiene, not correctness.
              if: always()
              run: |
                  sudo pkill -x minvmd || true
                  sudo pkill -f __krun-vmm || true
            - name: Upload guest boot console log
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: smoke-linux-kvm-boot-log
                  path: ${{ runner.temp }}/cli-e2e-boot.log
                  if-no-files-found: ignore

    smoke-macos:
        # DM1 (macOS is always VM-backed): prove the SIGNED macOS artifacts boot
        # the microVM from the INSTALLER LAYOUT — the same session e2e ci-macos
        # runs, but against the Developer-ID-signed `min`/`minvmd`, the signed
        # shipped `libkrun.1.dylib` laid out as a `lib/` sibling of `bin/` (minvmd
        # resolves it via its @loader_path/../lib rpath, exactly as
        # scripts/install.sh drops it), the signed gvproxy, and the shipped arm64
        # guest kernel/rootfs/initramfs.
        #
        # SKIP-TOLERANT: runs on the single self-hosted Apple-Silicon mini (it
        # holds the signing keychain), a scarce shared resource. Gated on the same
        # RUN_MACOS_CI kill-switch as the mac build/sign jobs, so taking the mini
        # offline skips this smoke as `skipped` (never `failure`); `smoke-success`
        # treats a skip as pass, so a skipped mac smoke does not wedge the run.
        if: vars.RUN_MACOS_CI != 'false'
        needs: [release]
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # Don't leave git credentials on the persistent self-hosted runner.
                  persist-credentials: false
            - name: Download signed CLI (min)
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimal-macos-arm64
                  path: ${{ runner.temp }}/dl
            - name: Download signed minvmd
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minvmd-macos-arm64
                  path: ${{ runner.temp }}/dl
            - name: Download signed libkrun dylib
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: libkrun-macos-arm64
                  path: ${{ runner.temp }}/dl
            - name: Download signed gvproxy
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: gvproxy-darwin-arm64
                  path: ${{ runner.temp }}/dl
            - name: Download shipped guest kernel
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: virtio-kernel-arm64
                  path: ${{ runner.temp }}/dl
            - name: Download shipped guest rootfs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minvmd-rootfs-arm64
                  path: ${{ runner.temp }}/dl
            - name: Download shipped guest initramfs
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: minimald-initramfs-arm64
                  path: ${{ runner.temp }}/dl
            - name: Assemble the installer layout
              # Reproduce the on-disk tree scripts/install.sh writes (spec 07):
              # bin/{min,minvmd,gvproxy}, lib/libkrun.1.dylib (bin's sibling, the
              # @rpath target), data/{vmlinuz,rootfs.img,initramfs.cpio}. The dylib
              # basename MUST be libkrun.1.dylib — minvmd's load command is
              # @rpath/libkrun.1.dylib. Then bin/ joins PATH so `min` autospawns
              # `minvmd` (which finds libkrun via @loader_path/../lib) by bare
              # name. gvproxy is NOT resolved from PATH — the e2e step below
              # points MINVMD_GVPROXY_BIN at the laid-out binary.
              run: |
                  set -euo pipefail
                  DL="$RUNNER_TEMP/dl"
                  ROOT="$RUNNER_TEMP/install"
                  mkdir -p "$ROOT/bin" "$ROOT/lib" "$ROOT/data"
                  mv "$DL/minimal-macos-arm64" "$ROOT/bin/min"
                  mv "$DL/minvmd-macos-arm64" "$ROOT/bin/minvmd"
                  mv "$DL/gvproxy-darwin-arm64" "$ROOT/bin/gvproxy"
                  mv "$DL/libkrun-macos-arm64.dylib" "$ROOT/lib/libkrun.1.dylib"
                  mv "$DL/vmlinuz-arm64" "$ROOT/data/vmlinuz"
                  mv "$DL/rootfs-arm64.img" "$ROOT/data/rootfs.img"
                  mv "$DL/initramfs-arm64.cpio" "$ROOT/data/initramfs.cpio"
                  chmod +x "$ROOT/bin/min" "$ROOT/bin/minvmd" "$ROOT/bin/gvproxy"
                  echo "$ROOT/bin" >> "$GITHUB_PATH"
            - name: Reap stale VM processes before the smoke
              # The mini is persistent and shared: a prior run's stray minvmd,
              # __krun-vmm or gvproxy would wedge the host->guest vsock bridge and
              # sink the cold activate. Clear the tree first (mirrors ci-macos).
              run: |
                  pkill -x minvmd 2>/dev/null || true
                  pkill -f '__krun-vmm' 2>/dev/null || true
                  pkill -f gvproxy 2>/dev/null || true
                  sleep 1
            - name: Session e2e (signed microVM, installer layout)
              # activate must auto-spawn minvmd, boot the guest, and round-trip a
              # session. E2E_PROJECT_DIR=/tmp — the guest sees no host project dir
              # yet, and /tmp exists in the guest image. Runs the laid-out binaries
              # directly (never cargo, which would relink and unsign minvmd).
              env:
                  MINVMD_KERNEL_PATH: ${{ runner.temp }}/install/data/vmlinuz
                  MINVMD_ROOTFS_PATH: ${{ runner.temp }}/install/data/rootfs.img
                  MINVMD_INITRAMFS: ${{ runner.temp }}/install/data/initramfs.cpio
                  MINVMD_BOOT_LOG: ${{ runner.temp }}/cli-e2e-boot.log
                  MINVMD_GVPROXY_BIN: ${{ runner.temp }}/install/bin/gvproxy
              run: E2E_VM=1 E2E_PROJECT_DIR=/tmp ./scripts/session-e2e.sh
            - name: Reap VM processes
              # Leave the shared mini clean for the next job (Guest teardown does
              # not always reap the __krun-vmm grandchild or the gvproxy switch).
              if: always()
              run: |
                  pkill -x minvmd 2>/dev/null || true
                  pkill -f '__krun-vmm' 2>/dev/null || true
                  pkill -f gvproxy 2>/dev/null || true
            - name: Upload guest boot console log
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: smoke-macos-boot-log
                  path: ${{ runner.temp }}/cli-e2e-boot.log
                  if-no-files-found: ignore

    smoke-success:
        # Skip-tolerant gate that `record-smoked` needs: the shipped-artifact
        # smokes must pass BEFORE the row is marked smoked. `if: always()` so a
        # kill-switch skip (RUN_MACOS_CI off skipping smoke-macos) still lets
        # this run, and only a real failure/cancellation reds it — a `skipped`
        # smoke reads as pass, mirroring the lane `*-success` aggregators. The
        # two Linux smokes are never skipped when `release` ran, so a green
        # here always means they passed.
        if: always()
        needs: [smoke-linux-amd64, smoke-linux-kvm, smoke-macos]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Verify every smoke job succeeded or was skipped
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
            - run: echo "shipped-artifact smoke green"

    record-smoked:
        # Provenance as a property of the row: write versions/<version>/smoked
        # carrying the SHA-256 of the row's `components` manifest and this
        # run's URL (scripts/record-smoked.sh). promote's gate
        # (scripts/verify-smoked.sh) re-hashes the live manifest and compares,
        # so "these bytes were smoked" is checked directly rather than inferred
        # from a workflow run id, and a re-staged row can never inherit a stale
        # blessing. Needs every gate green: staged and smoked. Only then does
        # `unstable` advance: a channel never points at bytes that have not
        # passed the smoke. A dry run stages nothing, so `needs` alone already
        # skips this job (a skipped dependency skips its dependents); the
        # explicit `if` says so where a reader looks for it.
        needs: [assert-version, stage-installer, smoke-success]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Authenticate to Google Cloud (installer bucket)
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"
            - name: Record the smoke against the staged bytes
              env:
                  VERSION: ${{ needs.assert-version.outputs.version }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  scripts/record-smoked.sh \
                    --version "$VERSION" \
                    --run-url "$RUN_URL" \
                    --run-id "$RUN_ID" \
                    --sha "$GITHUB_SHA" \
                    --bucket gs://minimal-one
            - name: Point unstable channel at this release
              # `unstable` auto-advances to every fresh, smoked build — it is
              # the bleeding-edge channel, so no approval gate, but it advances
              # only here, after the smokes and the marker. Promotion to
              # `stable` is the manual, gated promote-cli workflow.
              env:
                  VERSION: ${{ needs.assert-version.outputs.version }}
              run: |
                  scripts/set-channel.sh \
                    --channel unstable \
                    --version "$VERSION" \
                    --bucket gs://minimal-one
