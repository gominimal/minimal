name: CI

on:
    push:
        branches: ["main"]
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
    pull_request:
        branches: ["main"]
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# main is excluded so a push to main never gets cancelled mid-flight.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

jobs:
    fmt:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Run rustfmt
              run: cargo fmt --all -- --check

    clippy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Free Disk Space
              uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
              with:
                  remove_android: true
                  remove_dotnet: true
                  remove_haskell: true
                  remove_tool_cache: true
            - uses: actions/checkout@v7
            - name: Install protoc
              run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
            - name: Cache cargo registry and build artifacts
              uses: Swatinem/rust-cache@v2
            - name: Run Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v7
            - name: Run core workspace tests
              uses: ./.github/actions/core-tests
            - name: Run HTTPS/mTLS proxy tests
              # The mTLS reverse proxy is behind the non-default `networking-proxy`
              # feature, so the core-tests `--workspace` run does not compile or run
              # its proofs (R4.5 mtls_missing_cert_returns_401_with_no_topology, UC2b
              # mtls_valid_cert_routes_to_backend). Exercise them explicitly.
              run: cargo nextest run -p minimald --features networking-proxy
            - name: Run WireGuard mesh tests
              # The WireGuard mesh peer is behind the non-default `networking-wg`
              # feature, so the core-tests `--workspace` run does not compile or run
              # its proofs. Exercise them explicitly (R-WG:
              # two_meshes_handshake_and_relay_a_packet, rpc get_mesh_status). The
              # `#[ignore]` two-namespace mesh_uc7 proof runs in the netns lane.
              run: cargo test -p minimald --features networking-wg

    dogfood:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Free Disk Space
              uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
              with:
                  remove_android: true
                  remove_dotnet: true
                  remove_haskell: true
            - uses: actions/checkout@v7
            - name: Cache Cargo state
              uses: actions/cache@v5
              with:
                  path: ~/.local/state/minimal/state
                  key: dogfood-minimal-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: dogfood-minimal-cargo-
            - name: Smoketest building Minimal
              uses: gominimal/run-task@v1
              with:
                  channel: unstable
                  task: build-smoke

    cargo-deny:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: EmbarkStudios/cargo-deny-action@v2

    minimal-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-minimal
            - name: Check
              run: minimal --no-fetch check

    # Single required status check for branch protection. Stays green only when
    # every gating job below succeeds.
    ci-success:
        if: always()
        needs: [fmt, clippy, test, dogfood, cargo-deny, minimal-check]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Verify all gating jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
            - run: echo "All CI gates passed"
