name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# main is excluded so release/promote on main never get cancelled mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v6
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v6
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Check Cargo.lock is up-to-date
        run: cargo fetch --locked
      - name: Run tests
        run: cargo nextest run --workspace
      - name: Run doctests
        run: cargo test --workspace --doc

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-minimal
      - name: Smoke-test `minimal run`
        run: minimal run build-smoke

  build-release-amd64:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
      - name: Add Rust target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Configure musl linker
        run: |
          echo '' >> .cargo/config.toml
          echo '[target.x86_64-unknown-linux-musl]' >> .cargo/config.toml
          echo 'linker = "musl-gcc"' >> .cargo/config.toml
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-amd64-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-amd64-cargo-release-
      - name: Build static release binary
        run: cargo build --release --package minimal --target x86_64-unknown-linux-musl
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: minimal-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/minimal
          retention-days: 7

  build-release-arm64:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-arm64-cargo-release-
      - name: Build static release binary
        run: cross build --release --package minimal --target aarch64-unknown-linux-musl
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: minimal-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/minimal
          retention-days: 7

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  release:
    runs-on: ubuntu-latest
    needs: [ci-success, build-release-amd64, build-release-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: minimal-linux-amd64
          path: artifacts/amd64
      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: minimal-linux-arm64
          path: artifacts/arm64
      - name: Generate release info
        id: release_info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=release-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "name=minimal-$SHORT_SHA" >> $GITHUB_OUTPUT
      - name: Prepare release assets
        run: |
          cp artifacts/amd64/minimal minimal-linux-amd64
          cp artifacts/arm64/minimal minimal-linux-arm64
          cp artifacts/amd64/minimal minimal
          chmod +x minimal-linux-* minimal
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_info.outputs.tag }}" \
            minimal \
            minimal-linux-amd64 \
            minimal-linux-arm64 \
            --repo="${GITHUB_REPOSITORY}" \
            --title="${{ steps.release_info.outputs.name }}"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: "289724348228"
          workload_identity_provider: "projects/289724348228/locations/global/workloadIdentityPools/github/providers/gominimal"
      - name: Generate completions
        run: |
          chmod +x artifacts/amd64/minimal
          mkdir -p completions/{bash,zsh,fish}
          artifacts/amd64/minimal completions bash > completions/bash/minimal 2>/dev/null || true
          artifacts/amd64/minimal completions zsh > completions/zsh/_minimal 2>/dev/null || true
          artifacts/amd64/minimal completions fish > completions/fish/minimal.fish 2>/dev/null || true
      - name: Package and upload CLI archives to GCS
        run: |
          SHA=$(git rev-parse --short HEAD)

          # amd64-linux
          mkdir -p pkg-amd64/bin
          cp artifacts/amd64/minimal pkg-amd64/bin/
          chmod +x pkg-amd64/bin/minimal
          cp -r completions pkg-amd64/
          tar --zstd -cf "cli-amd64-linux-${SHA}.tar.zst" -C pkg-amd64 .

          # arm64-linux (completions are text, same for both arches)
          mkdir -p pkg-arm64/bin
          cp artifacts/arm64/minimal pkg-arm64/bin/
          chmod +x pkg-arm64/bin/minimal
          cp -r completions pkg-arm64/
          tar --zstd -cf "cli-arm64-linux-${SHA}.tar.zst" -C pkg-arm64 .

          gcloud storage cp \
            --cache-control="public, max-age=31536000, immutable" \
            "cli-amd64-linux-${SHA}.tar.zst" gs://minimal-shim/archives/
          gcloud storage cp \
            --cache-control="public, max-age=31536000, immutable" \
            "cli-arm64-linux-${SHA}.tar.zst" gs://minimal-shim/archives/

  minimal-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-minimal
      - name: Check
        run: minimal --no-fetch check

  minvmd-linux-kvm-e2e:
    # minvmd Linux/KVM end-to-end on a self-hosted KVM-capable runner (#411,
    # #410). libkrun's KVM backend boots the guest; the three e2e tests cover the
    # READY round-trip (R2.4), the full minimald session over the bridge, and
    # concurrent bridge round-trips (R3.3/R3.4). A Linux runner can materialize
    # the guest artifacts itself (the scripts are Linux-only), so unlike the
    # macOS workflow no separate artifact job is needed.
    #
    # OPT-IN: ci.yml is not path-scoped, so this job runs only when the
    # RUN_LINUX_KVM_CI repo variable is 'true'. Set it once a runner labelled
    # `[self-hosted, linux, kvm]` is provisioned with /dev/kvm + libkrun.
    # NON-GATING: deliberately absent from ci-success below, so an unavailable
    # runner never blocks PRs.
    if: ${{ vars.RUN_LINUX_KVM_CI == 'true' }}
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Export guest artifact paths
        # `runner.temp` is not available in job-level `env:`, so publish the
        # artifact paths (and the E2E gate) to $GITHUB_ENV for the e2e + bench
        # steps to inherit.
        run: |
          {
            echo "MINVMD_E2E=1"
            echo "MINVMD_KERNEL_PATH=$RUNNER_TEMP/vmlinuz"
            echo "MINVMD_ROOTFS_PATH=$RUNNER_TEMP/rootfs.img"
            echo "MINVMD_INITRAMFS=$RUNNER_TEMP/initramfs.cpio"
          } >> "$GITHUB_ENV"
      - name: Verify /dev/kvm is available
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not found — provision a KVM-capable runner." >&2
            exit 1
          fi
      - name: Verify libkrun is available
        # libkrun (KVM backend) must be preprovisioned on the runner. minvmd's
        # build script auto-detects it; fail fast with guidance if it is missing
        # rather than silently building the no-op stub.
        run: |
          if ! ls /usr/local/lib/libkrun.so* /usr/lib/libkrun.so* /usr/lib/*/libkrun.so* >/dev/null 2>&1; then
            echo "::error::libkrun.so not found — install libkrun on the runner (or set LIBKRUN_PREFIX)." >&2
            exit 1
          fi
      - name: Resolve guest arch
        id: arch
        run: |
          case "$(uname -m)" in
            aarch64|arm64) echo "arch=aarch64" >> "$GITHUB_OUTPUT"; echo "target=aarch64-unknown-linux-musl" >> "$GITHUB_OUTPUT" ;;
            x86_64) echo "arch=x86_64"  >> "$GITHUB_OUTPUT"; echo "target=x86_64-unknown-linux-musl"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cache cargo + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ steps.arch.outputs.arch }}-minvmd-kvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.arch.outputs.arch }}-minvmd-kvm-
      - name: Materialize guest kernel (raw Image)
        run: ./scripts/fetch-artifact.sh virtio-kernel "$RUNNER_TEMP/vmlinuz" "${{ steps.arch.outputs.arch }}"
      - name: Materialize guest rootfs (ext4 image)
        run: ./scripts/fetch-artifact.sh minvmd-rootfs "$RUNNER_TEMP/rootfs.img" "${{ steps.arch.outputs.arch }}"
      - name: Build guest initramfs (minimald as /init)
        run: ./scripts/build-initramfs.sh "$RUNNER_TEMP/initramfs.cpio" "${{ steps.arch.outputs.target }}"
      - name: Build minvmd
        run: cargo build -p minvmd --bin minvmd
      - name: Boot E2E (READY round-trip, R2.4)
        env:
          MINVMD_BOOT_LOG: ${{ runner.temp }}/boot.log
        run: cargo test -p minvmd --test boot_e2e -- --include-ignored --nocapture
      - name: Session E2E (full minimald session over the bridge)
        run: cargo test -p minvmd --test minimald_session_e2e -- --include-ignored --nocapture --exact minimald_exec_over_bridge
      - name: Bridge E2E (concurrent UDS↔vsock round-trips, R3.3/R3.4)
        run: cargo test -p minvmd --test bridge_e2e -- --include-ignored --nocapture
      - name: Boot latency benchmark (informational)
        # Report boot-to-READY min/median/max against the ~75 ms macOS baseline.
        # Non-gating (boot correctness is gated by the e2e tests above), so a
        # timing hiccup never reds the build.
        run: scripts/bench-minvmd-boot.sh 10 target/debug/minvmd || true
      - name: Upload guest boot console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minvmd-linux-boot-log
          path: ${{ runner.temp }}/boot.log
          if-no-files-found: ignore

  # Single required status check for branch protection. Stays green only when
  # every gating job below succeeds.
  ci-success:
    if: always()
    needs: [fmt, clippy, test, dogfood, cargo-deny, minimal-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gating jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI gates passed"
