name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run rustfmt
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: minimal-binary
          path: target/debug/minimal
          retention-days: 7

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Download binary artifact
        uses: actions/download-artifact@v7
        with:
          name: minimal-binary
          path: .
      - name: Generate release info
        id: release_info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=release-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "name=minimal-$SHORT_SHA" >> $GITHUB_OUTPUT
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_info.outputs.tag }}" \
            minimal \
            --repo="${GITHUB_REPOSITORY}" \
            --title="${{ steps.release_info.outputs.name }}"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: "289724348228"
          workload_identity_provider: "projects/289724348228/locations/global/workloadIdentityPools/github/providers/gominimal"
      - name: Update shim config
        run: |
          echo '{"version": "${{ steps.release_info.outputs.short_sha }}"}' > config.json
          gcloud storage cp config.json gs://minimal-shim/config.json
