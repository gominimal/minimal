name: nightly

# Cut a release once a day and bless it onto the `nightly` distribution
# channel. This reuses release.yml verbatim (via workflow_call) to build,
# stage, smoke the shipped artifacts, and record the smoke against the staged
# row, then flips the `nightly` pointer inline — so promote.yml stays the
# gated, manual stable/unstable path and needs no nightly-specific carve-outs.
# After the channel flip it also publishes the nightly AUR package and
# Homebrew tap (synthetic PKGVER 0.YYYYMMDD.<run_number>, STAGE_VERSION =
# short sha) — not via publish-packages.yml, which stays stable-only.
#
# `nightly` is bleeding-edge like `unstable` (it's a once-a-day snapshot of
# HEAD's build), so it is intentionally ungated — no approval issue.
on:
    schedule:
        - cron: "0 10 * * *" # 10:00 UTC = 02:00 PST
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Build, sign, assemble, and smoke everything but publish nothing (no GCS upload, no GitHub release, no installer-bucket write, no nightly channel advance). Forces the build even when HEAD is already staged."
                type: boolean
                default: false
            skip_ci_verify:
                description: "Bypass release.yml's verify-ci gate that requires this commit's five lane aggregators to be green. Admin override for a commit whose checks are known-good but unreported."
                type: boolean
                default: false

# Least privilege at the top level; the elevated scopes the release cut needs
# are granted only on the jobs that need them (`release`, `promote-nightly`).
# A called workflow cannot hold a scope its caller's job doesn't grant, so the
# `release` job below re-grants contents/id-token/checks for release.yml.
permissions:
    contents: read

env:
  # Route package-cache reads through the R2 mirror. min binaries built
  # from branches predating minimal#1234 default the reader to gs:// and
  # bill GCS internet egress from the GHA runners (25-36 GB/day measured
  # 2026-08-18/19, gcs_access_logs). Harmless in jobs that never read the
  # package cache; the mutable index.shisha is edge-bypassed to live GCS.
  MINIMAL_REMOTE_CACHE_URL: https://cache.minimal.dev/

jobs:
    # Skip the build on no-op nights: a finished release stages an immutable
    # versions/<sha>/components manifest in gs://minimal-one, so if HEAD hasn't
    # moved since the last release that object already exists. When it does we
    # skip the (re)build but still run promote-nightly, so the `nightly` channel
    # always ends up pointing at HEAD's build whether or not we cut it tonight.
    # The bucket is public, so this is an unauthenticated HEAD — no GCS auth.
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            sha: ${{ steps.check.outputs.sha }}
            should_release: ${{ steps.check.outputs.should_release }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Determine whether HEAD is already staged
              id: check
              run: |
                  set -euo pipefail
                  SHA=$(git rev-parse --short=8 HEAD)
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  URL="https://storage.googleapis.com/minimal-one/versions/$SHA/components"
                  if curl -sf -o /dev/null -I "$URL"; then
                    echo "$SHA already staged; skipping build, will still point nightly at it."
                    echo "should_release=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "$SHA not staged; cutting a fresh release."
                    echo "should_release=true" >> "$GITHUB_OUTPUT"
                  fi

    release:
        needs: check
        # A dry_run dispatch forces the build even when HEAD is already staged
        # (a rehearsal that skips itself proves nothing). On schedule the
        # inputs context is empty, so both expressions fall back to the
        # unforced/real-release path.
        if: ${{ needs.check.outputs.should_release == 'true' || inputs.dry_run == true }}
        permissions:
            contents: write # release.yml cuts a GitHub release
            id-token: write # OIDC for the GCS staging auth
            checks: read # release.yml's verify-ci gate reads check-run conclusions
        uses: ./.github/workflows/release.yml
        with:
            dry_run: ${{ inputs.dry_run || false }}
            skip_ci_verify: ${{ inputs.skip_ci_verify || false }}
        secrets: inherit # zizmor: ignore[secrets-inherit] first-party same-repo reusable workflow needs the release/signing secrets

    promote-nightly:
        needs: [check, release]
        # Run whether release executed (success — which, being the whole of
        # release.yml, includes its shipped-artifact smokes and the provenance
        # marker) or was skipped as a no-op; bail only if it actually failed or
        # was cancelled. always() is needed so a skipped `release` doesn't
        # auto-skip this job. A dry_run dispatch never advances the channel —
        # a dry-run release stages nothing, and re-pointing nightly at a
        # previously staged HEAD would make the rehearsal publish.
        if: ${{ always() && needs.check.result == 'success' && needs.release.result != 'failure' && needs.release.result != 'cancelled' && !inputs.dry_run }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Authenticate to Google Cloud (installer bucket)
              # Same project + workload-identity pool as release.yml's
              # stage-installer job; grants write to gs://minimal-one.
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"
            - name: Verify the staged row was smoked
              # On a no-op night `release` is skipped because the row already
              # exists — but an earlier run may have staged it and then failed
              # its smoke or its recording. Staged is not smoked: the same gate
              # promote.yml applies (scripts/verify-smoked.sh) must pass here
              # before `nightly` can point at the row.
              env:
                  SHA: ${{ needs.check.outputs.sha }}
              run: scripts/verify-smoked.sh --version "$SHA" --bucket gs://minimal-one
            - name: Point nightly channel at this release
              # The SHA `check` computed is HEAD at this ref, i.e. exactly what
              # release.yml staged. set-channel.sh verifies versions/<sha>/ is
              # staged before flipping, so a missing stage fails loudly.
              env:
                  SHA: ${{ needs.check.outputs.sha }}
              run: |
                  scripts/set-channel.sh \
                    --channel nightly \
                    --version "$SHA" \
                    --bucket gs://minimal-one

    # Package publishers for the nightly channel. PKGVER is the synthetic
    # 0.YYYYMMDD.<run_number>; STAGE_VERSION is the smoked short-sha row the
    # channel just pointed at. Does NOT call publish-packages.yml (no draft
    # GitHub Release, no v-tag). Secrets: AUR_SSH_PRIVATE_KEY and
    # BREW_TAP_TOKEN — the same names as publish-packages.yml; the AUR bot
    # key must co-maintain minimal-bin-nightly and the PAT must write
    # gominimal/homebrew-minimal-nightly (create those remotes first).
    publish-nightly-dry:
        needs: [check, promote-nightly]
        if: ${{ needs.promote-nightly.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Dry-run AUR + Homebrew against the staged nightly row
              env:
                  SHA: ${{ needs.check.outputs.sha }}
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  set -euo pipefail
                  PKGVER="0.$(date -u +%Y%m%d).${RUN_NUMBER}"
                  # Local fixture remotes: dry-run only needs to clone something;
                  # the real destinations are exercised by the publish jobs.
                  aur="$(mktemp -d)/aur.git"
                  tap="$(mktemp -d)/tap.git"
                  git init -q --bare -b master "$aur"
                  git init -q --bare -b main "$tap"
                  seed="$(mktemp -d)/seed"
                  git clone -q "file://$aur" "$seed"
                  git -C "$seed" config user.email ci@example.com
                  git -C "$seed" config user.name ci
                  printf 'pkgname=minimal-bin-nightly\npkgver=0.0.0\n' >"$seed/PKGBUILD"
                  git -C "$seed" add -A && git -C "$seed" commit -q -m seed
                  git -C "$seed" push -q origin master
                  rm -rf "$seed"
                  seed="$(mktemp -d)/seed"
                  git clone -q "file://$tap" "$seed"
                  git -C "$seed" config user.email ci@example.com
                  git -C "$seed" config user.name ci
                  mkdir -p "$seed/Formula"
                  printf 'class MinimalNightly < Formula\n  version "0.0.0"\nend\n' >"$seed/Formula/minimal-nightly.rb"
                  git -C "$seed" add -A && git -C "$seed" commit -q -m seed
                  git -C "$seed" push -q origin main
                  env PKGVER="$PKGVER" STAGE_VERSION="$SHA" \
                      AUR_REPO_URL="file://$aur" \
                      scripts/publish-aur.sh --dry-run --channel nightly
                  env PKGVER="$PKGVER" STAGE_VERSION="$SHA" \
                      BREW_TAP_REPO="file://$tap" \
                      scripts/publish-brew.sh --dry-run --channel nightly

    publish-nightly-aur:
        needs: [check, publish-nightly-dry]
        if: ${{ needs.publish-nightly-dry.result == 'success' }}
        runs-on: ubuntu-latest
        container: archlinux:base-devel
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Install git and openssh
              run: pacman -Syu --noconfirm --needed git openssh
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Publish minimal-bin-nightly to the AUR
              env:
                  SHA: ${{ needs.check.outputs.sha }}
                  RUN_NUMBER: ${{ github.run_number }}
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  export PKGVER="0.$(date -u +%Y%m%d).${RUN_NUMBER}"
                  export STAGE_VERSION="$SHA"
                  scripts/publish-aur.sh --channel nightly

    publish-nightly-brew:
        needs: [check, publish-nightly-dry]
        if: ${{ needs.publish-nightly-dry.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Publish minimal-nightly to gominimal/homebrew-minimal-nightly
              env:
                  SHA: ${{ needs.check.outputs.sha }}
                  RUN_NUMBER: ${{ github.run_number }}
                  BREW_TAP_REPO: https://github.com/gominimal/homebrew-minimal-nightly.git
                  GITHUB_TOKEN: ${{ secrets.BREW_TAP_TOKEN }}
              run: |
                  set -euo pipefail
                  export PKGVER="0.$(date -u +%Y%m%d).${RUN_NUMBER}"
                  export STAGE_VERSION="$SHA"
                  scripts/publish-brew.sh --channel nightly
