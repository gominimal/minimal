name: promote-cli

on:
    workflow_dispatch:
        inputs:
            sha:
                description: "Staged version (short SHA) to promote (leave empty for latest staged in bucket)"
                required: false
                type: string
            target:
                description: "Channel to point at the version"
                required: true
                default: "stable"
                type: choice
                options:
                    - stable
                    - unstable
            dry_run:
                description: "Dry run — open issue + wait for approval but skip the GCS write"
                required: false
                type: boolean
                default: false
            override_provenance:
                description: "EMERGENCY ONLY — promote a version even if it was not built by the nightly workflow"
                required: false
                type: boolean
                default: false

env:
    # Single source of truth for the gate's approver allowlist.
    # Comma-separated, no spaces (the polling step splits on `,`).
    APPROVERS: bryan-minimal,evanspearman,jessie-minimal,jtnkminimal,Max-minimal,mitodrummer,msample,norrietaylor,twitchyliquid64

jobs:
    gate:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        # 6h matches the GitHub-hosted runner hard limit. A higher value is
        # misleading — `ubuntu-latest` jobs are killed at 6h regardless.
        timeout-minutes: 360
        outputs:
            issue_url: ${{ steps.issue.outputs.url }}
        steps:
            - name: Open approval issue
              id: issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  WORKFLOW: ${{ github.workflow }}
                  RUN_NUMBER: ${{ github.run_number }}
                  # triggering_actor (NOT actor) — actor is frozen on rerun, so a rerun
                  # by a different user would still let the original initiator self-approve.
                  ACTOR: ${{ github.triggering_actor }}
                  SERVER_URL: ${{ github.server_url }}
                  RUN_ID: ${{ github.run_id }}
                  SHA_INPUT: ${{ inputs.sha }}
                  TARGET_INPUT: ${{ inputs.target }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  OVERRIDE_PROVENANCE: ${{ inputs.override_provenance }}
              run: |
                  set -euo pipefail
                  BODY="**Repo:** \`${REPO}\`
                  **Workflow:** \`${WORKFLOW}\`
                  **Requested by:** @${ACTOR}
                  **Run:** ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}
                  **SHA input:** \`${SHA_INPUT:-<latest staged>}\`
                  **Target channel:** \`${TARGET_INPUT}\`
                  **Dry run:** \`${DRY_RUN}\`
                  **Nightly-provenance override (EMERGENCY):** \`${OVERRIDE_PROVENANCE}\`

                  Comment **\`approved\`** to proceed or **\`denied\`** to cancel.
                  Closing this issue without an approval comment counts as denial.

                  Approver list (initiator excluded at runtime):
                  ${APPROVERS//,/, }"

                  URL=$(gh issue create \
                    --repo "$REPO" \
                    --title "Promotion approval required: ${WORKFLOW} run ${RUN_NUMBER}" \
                    --label "promotion-approval" \
                    --body "$BODY")
                  NUM="${URL##*/}"
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "number=$NUM" >> "$GITHUB_OUTPUT"
                  echo "Opened approval issue: $URL"

            - name: Notify Slack — approval required
              continue-on-error: true
              timeout-minutes: 5
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                  webhook-type: incoming-webhook
                  payload: |
                      {
                        "text": "*Promotion approval required:* `${{ github.repository }}`\nRequested by: ${{ github.triggering_actor }}\nApprove here: ${{ steps.issue.outputs.url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }

            - name: Wait for approver decision
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
                  REPO: ${{ github.repository }}
                  # triggering_actor reflects the user who triggered THIS run (incl. reruns),
                  # so rerunning the workflow as a different user correctly excludes them.
                  INITIATOR: ${{ github.triggering_actor }}
                  POLL_INTERVAL: "30"
              run: |
                  set -euo pipefail

                  INITIATOR_LC=$(printf '%s' "$INITIATOR" | tr '[:upper:]' '[:lower:]')
                  ALLOWED_JSON=$(printf '%s' "$APPROVERS" | tr ',' '\n' \
                    | tr '[:upper:]' '[:lower:]' \
                    | grep -vx "$INITIATOR_LC" \
                    | jq -R . | jq -s .)

                  echo "Polling issue #${ISSUE_NUMBER}. Allowed approvers (initiator ${INITIATOR} excluded):"
                  echo "$ALLOWED_JSON" | jq -r '.[]'

                  while true; do
                    STATE=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.state')

                    DECISION=$(gh api --paginate "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
                      | jq -s 'add // []' \
                      | jq -c --argjson allowed "$ALLOWED_JSON" '
                          map(select(.user.login | ascii_downcase as $u | $allowed | index($u)))
                          | sort_by(.created_at)
                          | map(
                              (.body | ascii_downcase | gsub("[[:space:]]"; "")) as $b
                              | if   ($b | test("^(approved|approve|lgtm)$"))      then {decision: "approved", user: .user.login}
                                elif ($b | test("^(denied|deny|reject|rejected)$")) then {decision: "denied",   user: .user.login}
                                else empty end
                            )
                          | first // empty')

                    if [ -n "$DECISION" ] && [ "$DECISION" != "null" ]; then
                      DEC=$(echo "$DECISION" | jq -r '.decision')
                      USR=$(echo "$DECISION" | jq -r '.user')
                      if [ "$DEC" = "approved" ]; then
                        echo "Approved by @${USR}."
                        gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Approved by @${USR}. Proceeding." || true
                        exit 0
                      else
                        echo "Denied by @${USR}."
                        gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Denied by @${USR}. Cancelling promotion." || true
                        exit 1
                      fi
                    fi

                    if [ "$STATE" = "closed" ]; then
                      echo "Issue closed without an approval comment — treating as denial."
                      exit 1
                    fi

                    sleep "$POLL_INTERVAL"
                  done

    promote:
        needs: gate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: "read"
            id-token: "write"
            # verify-nightly-provenance.sh lists nightly workflow runs.
            actions: "read"
        steps:
            - uses: actions/checkout@v7
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"

            - name: Point channel at staged version
              id: promote
              env:
                  DRY_RUN: ${{ inputs.dry_run }}
                  # Pass dispatch inputs via env (NOT inline ${{ inputs.* }} in `run:`)
                  # to avoid shell template injection — see GitHub's hardening guide.
                  INPUT_SHA: ${{ inputs.sha }}
                  INPUT_TARGET: ${{ inputs.target }}
                  OVERRIDE_PROVENANCE: ${{ inputs.override_provenance }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  # Trim leading/trailing whitespace; users often paste SHAs with stray spaces.
                  SHA="$(printf '%s' "$INPUT_SHA" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  TARGET="$(printf '%s' "$INPUT_TARGET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

                  if [ -z "$SHA" ]; then
                    echo "No SHA provided; finding the most recently staged version in gs://minimal-one..."
                    # Each staged version has a versions/<sha>/components manifest;
                    # sort those by creation time (col 2 of `ls -l`) and take the newest.
                    # `|| true`: on an empty match `gcloud` errors and/or the
                    # `grep -v` emits nothing (exit 1), which under `pipefail`
                    # would abort via `set -e` before the emptiness check below.
                    LATEST=$(gcloud storage ls -l "gs://minimal-one/versions/*/components" \
                      | grep -v "^TOTAL:" \
                      | sort -k2 \
                      | tail -1 \
                      | awk '{print $NF}' || true)
                    if [ -z "$LATEST" ]; then
                      echo "ERROR: no staged versions found under gs://minimal-one/versions/"
                      exit 1
                    fi
                    # gs://minimal-one/versions/<sha>/components → <sha>
                    SHA="$(basename "$(dirname "$LATEST")")"
                    echo "Latest staged SHA: ${SHA}"
                  fi

                  # Only versions the nightly workflow actually built may be
                  # promoted; the override exists for emergency hotfixes and is
                  # surfaced in the approval issue above.
                  if [ "$OVERRIDE_PROVENANCE" = "true" ]; then
                    echo "WARNING: nightly-provenance check SKIPPED (override_provenance=true)."
                  else
                    scripts/verify-nightly-provenance.sh --sha "$SHA"
                  fi

                  # set-channel.sh verifies the version is actually staged before it
                  # flips the pointer, and validates the target/version charset.
                  DRY_FLAG=""
                  [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
                  scripts/set-channel.sh \
                    --channel "$TARGET" \
                    --version "$SHA" \
                    --bucket gs://minimal-one \
                    $DRY_FLAG

                  # Export resolved SHA for the docs-rebuild dispatch step below.
                  echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

            # Mint a short-lived token scoped to gominimal/docs via the
            # gominimal-aw-bot GitHub App (org standard — App tokens over PATs, see
            # gominimal/min-aw ADR-0002). The default GITHUB_TOKEN cannot dispatch
            # other repos; this token carries the App's contents:write permission
            # narrowed to the docs repo only.
            - name: Mint docs-repo token (gominimal-aw-bot)
              id: docs-token
              if: ${{ inputs.dry_run != true }}
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  app-id: ${{ vars.AW_BOT_APP_ID }}
                  private-key: ${{ secrets.AW_BOT_PRIVATE_KEY }}
                  owner: gominimal
                  repositories: docs

            - name: Trigger docs rebuild
              env:
                  GH_TOKEN: ${{ steps.docs-token.outputs.token }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  SHA: ${{ steps.promote.outputs.sha }}
              run: |
                  set -euo pipefail
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[dry-run] would dispatch reference-docs-promoted to gominimal/docs for ${SHA}"
                  else
                    gh api repos/gominimal/docs/dispatches \
                      -f event_type=reference-docs-promoted \
                      -F "client_payload[sha]=${SHA}"
                    echo "Dispatched reference-docs-promoted to gominimal/docs for ${SHA}"
                  fi
