name: promote-cli

# Point a channel at a staged, SMOKED version behind a human approval gate.
# Promoting a semver row to `stable` also publishes it: the draft GitHub
# Release the versioned build parked is published — which creates the
# v<semver> tag, last, on the already-smoked commit (the `publish` job).
on:
    workflow_dispatch:
        inputs:
            version:
                description: "Staged version to promote: a semver (0.6.0, from a versioned release build) or a nightly short SHA (unstable only). Leave empty for the latest staged nightly SHA (unstable only)."
                required: false
                type: string
            target:
                description: "Channel to point at the version"
                required: true
                default: "stable"
                type: choice
                options:
                    - stable
                    - unstable
            dry_run:
                description: "Dry run — open issue + wait for approval but skip the GCS write"
                required: false
                type: boolean
                default: false
            override_provenance:
                description: "EMERGENCY ONLY — promote a version whose staged bytes were never smoked by a release run (no versions/<version>/smoked marker, or one that no longer matches)"
                required: false
                type: boolean
                default: false
            rollback:
                description: "Move stable to a version below the current one, on purpose. Without this, a lower version is refused"
                required: false
                type: boolean
                default: false

env:
    # The gate's approvers are the members of this team of the repository's
    # owner, read once when the gate opens.
    APPROVER_TEAM: minimalists

jobs:
    gate:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        # 6h matches the GitHub-hosted runner hard limit. A higher value is
        # misleading — `ubuntu-latest` jobs are killed at 6h regardless.
        timeout-minutes: 360
        outputs:
            issue_url: ${{ steps.issue.outputs.url }}
        steps:
            # Reading a team's members needs the org `members` permission, which
            # the default GITHUB_TOKEN lacks. A short-lived gominimal-aw-bot
            # token carries only that permission (org standard — App tokens over
            # PATs, see gominimal/min-aw ADR-0002), and reaches this repository
            # only: without `repositories` the token covers every repository the
            # App is installed on. The org permission holds either way.
            - name: Mint team-read token (gominimal-aw-bot)
              id: team-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  app-id: ${{ vars.AW_BOT_APP_ID }}
                  private-key: ${{ secrets.AW_BOT_PRIVATE_KEY }}
                  owner: gominimal
                  repositories: ${{ github.event.repository.name }}
                  permission-members: read

            # Fails the gate when the team cannot be read or has no one else in
            # it: no approver list means no promotion.
            - name: Resolve approvers
              id: approvers
              env:
                  GH_TOKEN: ${{ steps.team-token.outputs.token }}
                  ORG: ${{ github.repository_owner }}
                  INITIATOR: ${{ github.triggering_actor }}
              run: |
                  set -euo pipefail
                  MEMBERS=$(gh api --paginate "orgs/${ORG}/teams/${APPROVER_TEAM}/members?per_page=100" --jq '.[].login' \
                    | tr '[:upper:]' '[:lower:]' | sort -u)
                  INITIATOR_LC=$(printf '%s' "$INITIATOR" | tr '[:upper:]' '[:lower:]')
                  LIST=$(printf '%s\n' "$MEMBERS" | grep -vx "$INITIATOR_LC" | paste -sd, - || true)
                  if [ -z "$LIST" ]; then
                    echo "::error::no approvers: @${ORG}/${APPROVER_TEAM} has no member besides the initiator"
                    exit 1
                  fi
                  echo "list=${LIST}" >> "$GITHUB_OUTPUT"

            - name: Open approval issue
              id: issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPROVERS: ${{ steps.approvers.outputs.list }}
                  REPO: ${{ github.repository }}
                  WORKFLOW: ${{ github.workflow }}
                  RUN_NUMBER: ${{ github.run_number }}
                  # triggering_actor (NOT actor) — actor is frozen on rerun, so a rerun
                  # by a different user would still let the original initiator self-approve.
                  ACTOR: ${{ github.triggering_actor }}
                  SERVER_URL: ${{ github.server_url }}
                  RUN_ID: ${{ github.run_id }}
                  VERSION_INPUT: ${{ inputs.version }}
                  TARGET_INPUT: ${{ inputs.target }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  OVERRIDE_PROVENANCE: ${{ inputs.override_provenance }}
                  ROLLBACK: ${{ inputs.rollback }}
              run: |
                  set -euo pipefail
                  BODY="**Repo:** \`${REPO}\`
                  **Workflow:** \`${WORKFLOW}\`
                  **Requested by:** @${ACTOR}
                  **Run:** ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}
                  **Version input:** \`${VERSION_INPUT:-<latest staged nightly sha>}\`
                  **Target channel:** \`${TARGET_INPUT}\`
                  **Dry run:** \`${DRY_RUN}\`
                  **Smoke-provenance override (EMERGENCY):** \`${OVERRIDE_PROVENANCE}\`
                  **Rollback:** \`${ROLLBACK}\`

                  Comment **\`approved\`** to proceed or **\`denied\`** to cancel.
                  Closing this issue without an approval comment counts as denial.

                  Approvers (members of @${REPO%%/*}/${APPROVER_TEAM}, initiator excluded):
                  ${APPROVERS//,/, }"

                  URL=$(gh issue create \
                    --repo "$REPO" \
                    --title "Promotion approval required: ${WORKFLOW} run ${RUN_NUMBER}" \
                    --label "promotion-approval" \
                    --body "$BODY")
                  NUM="${URL##*/}"
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "number=$NUM" >> "$GITHUB_OUTPUT"
                  echo "Opened approval issue: $URL"

            - name: Notify Slack — approval required
              continue-on-error: true
              timeout-minutes: 5
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                  webhook-type: incoming-webhook
                  payload: |
                      {
                        "text": "*Promotion approval required:* `${{ github.repository }}`\nRequested by: ${{ github.triggering_actor }}\nApprove here: ${{ steps.issue.outputs.url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }

            - name: Wait for approver decision
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPROVERS: ${{ steps.approvers.outputs.list }}
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
                  REPO: ${{ github.repository }}
                  # triggering_actor reflects the user who triggered THIS run (incl. reruns),
                  # so rerunning the workflow as a different user correctly excludes them.
                  INITIATOR: ${{ github.triggering_actor }}
                  POLL_INTERVAL: "30"
              run: |
                  set -euo pipefail

                  ALLOWED_JSON=$(printf '%s' "$APPROVERS" | tr ',' '\n' | jq -R . | jq -s .)

                  echo "Polling issue #${ISSUE_NUMBER}. Allowed approvers (initiator ${INITIATOR} excluded):"
                  echo "$ALLOWED_JSON" | jq -r '.[]'

                  while true; do
                    STATE=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.state')

                    DECISION=$(gh api --paginate "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
                      | jq -s 'add // []' \
                      | jq -c --argjson allowed "$ALLOWED_JSON" '
                          map(select(.user.login | ascii_downcase as $u | $allowed | index($u)))
                          | sort_by(.created_at)
                          | map(
                              (.body | ascii_downcase | gsub("[[:space:]]"; "")) as $b
                              | if   ($b | test("^(approved|approve|lgtm)$"))      then {decision: "approved", user: .user.login}
                                elif ($b | test("^(denied|deny|reject|rejected)$")) then {decision: "denied",   user: .user.login}
                                else empty end
                            )
                          | first // empty')

                    if [ -n "$DECISION" ] && [ "$DECISION" != "null" ]; then
                      DEC=$(echo "$DECISION" | jq -r '.decision')
                      USR=$(echo "$DECISION" | jq -r '.user')
                      if [ "$DEC" = "approved" ]; then
                        echo "Approved by @${USR}."
                        gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Approved by @${USR}. Proceeding." || true
                        exit 0
                      else
                        echo "Denied by @${USR}."
                        gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Denied by @${USR}. Cancelling promotion." || true
                        exit 1
                      fi
                    fi

                    if [ "$STATE" = "closed" ]; then
                      echo "Issue closed without an approval comment — treating as denial."
                      exit 1
                    fi

                    sleep "$POLL_INTERVAL"
                  done

    promote:
        needs: gate
        # One promotion per channel at a time, so two approved runs cannot
        # both read the same `stable`, pass the check, and write out of order.
        # Job-level, not workflow-level, so a run waiting at the gate holds
        # nothing. GitHub keeps one waiting run per group: a third run cancels
        # the waiting one before it writes anything, and that one must be
        # dispatched again. A dry run writes nothing, so it has its own group
        # and never cancels a real promotion.
        concurrency:
            group: promote-cli-${{ inputs.target }}${{ inputs.dry_run && '-dry-run' || '' }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: "read"
            id-token: "write"
        outputs:
            version: ${{ steps.promote.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"

            - name: Point channel at staged version
              id: promote
              env:
                  DRY_RUN: ${{ inputs.dry_run }}
                  # Pass dispatch inputs via env (NOT inline ${{ inputs.* }} in `run:`)
                  # to avoid shell template injection — see GitHub's hardening guide.
                  INPUT_VERSION: ${{ inputs.version }}
                  INPUT_TARGET: ${{ inputs.target }}
                  OVERRIDE_PROVENANCE: ${{ inputs.override_provenance }}
                  ROLLBACK: ${{ inputs.rollback }}
              run: |
                  set -euo pipefail
                  # Trim leading/trailing whitespace; users often paste versions with stray spaces.
                  VERSION="$(printf '%s' "$INPUT_VERSION" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  TARGET="$(printf '%s' "$INPUT_TARGET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

                  if [ -z "$VERSION" ]; then
                    echo "No version provided; finding the most recently staged nightly commit in gs://minimal-one..."
                    # The lookup lives in scripts/latest-staged-version.sh
                    # (tested by its _test.sh): it filters the rows to commit
                    # shas — a versioned (semver) row is promoted by name,
                    # deliberately, never as "whatever is newest".
                    VERSION="$(scripts/latest-staged-version.sh --bucket gs://minimal-one)"
                    echo "Latest staged SHA: ${VERSION}"
                  fi

                  # Checked here, after the approval, because `stable` can move
                  # while the gate waits. An unreadable `stable` stops the run.
                  if [ "$TARGET" = "stable" ]; then
                    CURRENT="$(gcloud storage cat gs://minimal-one/stable)"
                    ROLLBACK_FLAG=""
                    [ "$ROLLBACK" = "true" ] && ROLLBACK_FLAG="--rollback"
                    scripts/check-promotion.sh --version "$VERSION" --current "$CURRENT" $ROLLBACK_FLAG
                  fi

                  # Provenance gate: the row's bytes must be the bytes a
                  # release run smoked (scripts/verify-smoked.sh compares the
                  # live components manifest against the smoked marker). Runs
                  # on the default path; the override exists for documented
                  # emergencies only and is surfaced in the approval issue above.
                  if [ "$OVERRIDE_PROVENANCE" = "true" ]; then
                    echo "::warning::smoke-provenance check SKIPPED (override_provenance=true)."
                  else
                    scripts/verify-smoked.sh --version "$VERSION" --bucket gs://minimal-one
                  fi

                  # set-channel.sh verifies the version is actually staged before it
                  # flips the pointer, and validates the target/version charset.
                  DRY_FLAG=""
                  [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
                  scripts/set-channel.sh \
                    --channel "$TARGET" \
                    --version "$VERSION" \
                    --bucket gs://minimal-one \
                    $DRY_FLAG

                  # The commit behind the row, for the docs rebuild below
                  # (its contract is a commit sha, never a version): a
                  # nightly row IS its short sha; a versioned (semver) row
                  # records its commit in the smoked marker
                  # (scripts/record-smoked.sh --sha). Only an emergency
                  # override can reach here without a marker; then a semver
                  # has no commit to offer and the docs step skips itself.
                  if [[ "$VERSION" =~ ^[0-9a-f]{7,40}$ ]]; then
                    SHA="$VERSION"
                  else
                    SHA="$(gcloud storage cat "gs://minimal-one/versions/$VERSION/smoked" 2>/dev/null | jq -r '.sha // empty' || true)"
                    [ -n "$SHA" ] || echo "::warning::no commit recorded for versions/$VERSION (no smoked marker) — the docs rebuild will be skipped"
                  fi

                  # Export the resolved version and commit for the publish and
                  # docs steps below.
                  {
                    echo "version=${VERSION}"
                    echo "sha=${SHA}"
                  } >> "$GITHUB_OUTPUT"

            # Mint a short-lived token scoped to gominimal/webapp via the
            # gominimal-aw-bot GitHub App (org standard — App tokens over PATs, see
            # gominimal/min-aw ADR-0002). The default GITHUB_TOKEN cannot dispatch
            # other repos; this token carries the App's contents:write permission
            # narrowed to the webapp repo only. The standalone docs host was
            # collapsed into the webapp (gominimal/webapp#470), which now runs the
            # deploy-time docs sync, so promotions dispatch the rebuild there.
            - name: Mint webapp-repo token (gominimal-aw-bot)
              id: docs-token
              if: ${{ inputs.dry_run != true }}
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3 # zizmor: ignore[github-app] token scoped to owner+repositories:docs (ADR-0002)
              with:
                  app-id: ${{ vars.AW_BOT_APP_ID }}
                  private-key: ${{ secrets.AW_BOT_PRIVATE_KEY }}
                  owner: gominimal
                  repositories: webapp

            - name: Trigger docs rebuild
              # client_payload[sha] is a COMMIT sha (the webapp pins its docs
              # sync to it as MINIMAL_DOCS_SHA), resolved above; a version
              # string would not do.
              env:
                  GH_TOKEN: ${{ steps.docs-token.outputs.token }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  VERSION: ${{ steps.promote.outputs.version }}
                  SHA: ${{ steps.promote.outputs.sha }}
              run: |
                  set -euo pipefail
                  if [ -z "$SHA" ]; then
                    echo "::warning::no commit sha for ${VERSION}; not dispatching reference-docs-promoted (rerun docs-hotfix.yml by hand)"
                    exit 0
                  fi
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[dry-run] would dispatch reference-docs-promoted to gominimal/webapp for ${VERSION} (commit ${SHA})"
                  else
                     gh api repos/gominimal/webapp/dispatches \
                       -f event_type=reference-docs-promoted \
                       -F "client_payload[sha]=${SHA}"
                     echo "Dispatched reference-docs-promoted to gominimal/webapp for ${VERSION} (commit ${SHA})"
                   fi

    bump-line:
        # Open the PR that moves the line to the next patch, so the next
        # stage-release run needs no version PR of its own. It only acts when
        # the line still declares the version just promoted: on a rollback or
        # a rerun the line has moved on, or the PR's branch is already there.
        needs: [promote, publish]
        if: ${{ inputs.target == 'stable' && !inputs.dry_run }}
        # The minimal-backporter key lives in the `release` environment, which
        # only main and release/* can deploy to.
        environment: release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Find the line
              id: line
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.promote.outputs.version }}
              run: |
                  set -euo pipefail
                  if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                    echo "::notice::'$VERSION' is not a final version (a nightly sha); no line to bump"
                    exit 0
                  fi
                  line="release/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x"
                  next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
                  # Only a 404 means no line. Any other failure (rate limit,
                  # network) fails the job, so a rerun can still open the PR.
                  if ! err="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$line" --silent 2>&1)"; then
                    if [[ "$err" == *"HTTP 404"* ]]; then
                      echo "::notice::no $line branch; nothing to bump"
                      exit 0
                    fi
                    echo "::error::could not read $line: $err"
                    exit 1
                  fi
                  {
                    echo "line=$line"
                    echo "next=$next"
                  } >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: steps.line.outputs.line != ''
              with:
                  persist-credentials: false
            - name: Check out the line
              if: steps.line.outputs.line != ''
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ steps.line.outputs.line }}
                  path: line
                  persist-credentials: false
            # A PR opened with GITHUB_TOKEN starts no CI, and the line requires
            # the five aggregators.
            - name: Mint PR token (minimal-backporter)
              id: bump-token
              if: steps.line.outputs.line != ''
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  app-id: ${{ vars.MINIMAL_BACKPORTER_APP_ID }}
                  private-key: ${{ secrets.MINIMAL_BACKPORTER_PRIVATE_KEY }}
                  owner: gominimal
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
                  permission-pull-requests: write
            - name: Open the bump PR
              if: steps.line.outputs.line != ''
              env:
                  GH_TOKEN: ${{ steps.bump-token.outputs.token }}
                  APP_SLUG: ${{ steps.bump-token.outputs.app-slug }}
                  VERSION: ${{ needs.promote.outputs.version }}
                  LINE: ${{ steps.line.outputs.line }}
                  NEXT: ${{ steps.line.outputs.next }}
              run: |
                  set -euo pipefail
                  current="$(sed -n 's/^package\.version[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p' line/Cargo.toml | head -n 1)"
                  if [ "$current" != "$VERSION" ]; then
                    echo "::notice::$LINE declares $current, not $VERSION; leaving it as it is"
                    exit 0
                  fi
                  branch="chore/bump-$NEXT"
                  remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  title="chore(release): bump $LINE to $NEXT"
                  # ls-remote exits 2 when the branch is missing; anything else
                  # nonzero (128 on an auth failure) is an error, not "missing".
                  if git ls-remote --exit-code "$remote" "refs/heads/$branch" >/dev/null; then
                    # A rerun after `gh pr create` failed finds the branch with
                    # no PR, and opens the PR from it.
                    prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$LINE" --state all \
                      --json state --jq '[.[] | select(.state != "CLOSED")] | length')"
                    if [ "$prs" -gt 0 ]; then
                      echo "::notice::$branch already has a PR; leaving it as it is"
                      exit 0
                    fi
                    echo "::notice::$branch exists with no PR; opening one"
                  else
                    rc=$?
                    if [ "$rc" -ne 2 ]; then
                      echo "::error::git ls-remote failed (exit $rc) looking for $branch"
                      exit 1
                    fi
                    scripts/set-package-version.sh --repo line "$NEXT"
                    bot="${APP_SLUG}[bot]"
                    bot_id="$(gh api "users/$bot" --jq .id)"
                    git -C line switch -c "$branch"
                    git -C line -c user.name="$bot" -c user.email="$bot_id+$bot@users.noreply.github.com" \
                      commit -am "$title"
                    git -C line push "$remote" "HEAD:refs/heads/$branch"
                  fi
                  gh pr create --repo "$GITHUB_REPOSITORY" --base "$LINE" --head "$branch" --title "$title" \
                    --body "Moves $LINE to the next patch after $VERSION reached stable, so the next stage-release run needs no version PR. Opened by promote.yml."

    publish:
        # A stable promotion of a versioned (semver) row publishes the DRAFT
        # GitHub Release `v<semver>` the versioned release build parked
        # (release.yml). Publishing a draft is what creates the tag: v<semver>
        # lands on the commit the draft targets — already built, staged,
        # smoked, and promoted — and triggers no build. A release that is
        # already public (a re-run, or a rollback) is left as it is, once its
        # tag checks out. A promoted NIGHTLY sha (not a semver) has nothing
        # versioned to publish and skips with a notice. A rehearsal promotion
        # (dry_run) publishes nothing.
        needs: promote
        if: ${{ inputs.target == 'stable' && !inputs.dry_run }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # publishing the draft creates the tag
        steps:
            - name: Publish the draft GitHub Release (creates the tag)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.promote.outputs.version }}
              run: |
                  set -euo pipefail
                  case "$VERSION" in
                    [0-9]*.[0-9]*.[0-9]*) semver="$VERSION" ;;
                    *)
                      echo "::notice::promoted version '$VERSION' is not a semver (a nightly sha) — nothing versioned to publish"
                      exit 0 ;;
                  esac
                  tag="v$semver"
                  # The release must exist: the versioned release build parks a
                  # draft with the notes and every artifact attached. A missing
                  # release is a pipeline invariant broken upstream, not
                  # something to paper over here.
                  # Found by listing, never by tag: a draft has no tag yet, so
                  # `gh release view <tag>` and releases/tags/<tag> both answer
                  # 404 for exactly the release this job exists to publish.
                  matches="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                    --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft) \(.target_commitish)\"")"
                  count="$(printf '%s' "$matches" | grep -c . || true)"
                  [ "$count" -ge 1 ] \
                    || { echo "::error::no GitHub Release $tag — was $semver cut by a versioned release build (release.yml versioned: true)?"; exit 1; }
                  [ "$count" -eq 1 ] \
                    || { echo "::error::$count GitHub Releases carry $tag; delete the stale ones and re-run"; printf '%s\n' "$matches"; exit 1; }
                  read -r release_id is_draft target <<<"$matches"
                  if [ "$is_draft" != "true" ]; then
                    # Already public: a re-run, or a rollback. Leave the release
                    # as it is (no --latest, which would take the badge from a
                    # newer release), but only when its tag exists and sits on
                    # the commit the release targets. refs/tags/ so a branch
                    # that shares the tag's name never stands in for a missing
                    # tag.
                    tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha 2>/dev/null)" \
                      || { echo "::error::GitHub Release $tag is public but tag $tag does not exist"; exit 1; }
                    if [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
                      [ "$tagged" = "$target" ] \
                        || { echo "::error::tag $tag is at $tagged, but its GitHub Release targets $target"; exit 1; }
                    elif [[ "$semver" == 0.5.* ]]; then
                      # A tag-first release (0.5.x) targets a branch name; its
                      # tag is the only record of the commit it was built from.
                      # Every later release's draft is pinned to a commit.
                      echo "::notice::$tag targets '$target', not a commit; trusting the tag at $tagged"
                    else
                      echo "::error::GitHub Release $tag targets '$target', not a commit; cannot check its tag"
                      exit 1
                    fi
                    echo "::notice::GitHub Release $tag is already published at $tagged; leaving it as it is"
                    exit 0
                  fi
                  # A prerelease (a `-` tail, judged before any `+build`
                  # metadata) is published but never becomes "Latest".
                  make_latest=true
                  case "${semver%%+*}" in
                    *-*) make_latest=false
                         echo "::notice::$tag is a prerelease — published without the Latest badge" ;;
                  esac
                  # Published by id, with the tag named: publishing a draft
                  # without tag_name tags it with the draft's placeholder
                  # (untagged-<hex>) instead of $tag.
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                    -f tag_name="$tag" -f target_commitish="$target" \
                    -F draft=false -f make_latest="$make_latest" --jq .tag_name >/dev/null
                  # The tag now exists at the draft's target; say where.
                  tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
                  echo "published $tag at $tagged (draft targeted $target)"

    report-release:
        # Tell release-ops a version reached stable, so rotation.yaml `releases`
        # updates itself. Runs last: the release is out by now, so a red job
        # here means rerun this job, not roll back. release-ops ignores a
        # version it has already logged, so a rerun or a rollback changes nothing.
        needs: [promote, publish]
        if: ${{ inputs.target == 'stable' && !inputs.dry_run }}
        # The minimal-backporter key lives in the `release` environment, which
        # only main and release/* can deploy to.
        environment: release
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            # Same pattern as the webapp token above: contents:write is what
            # POST /repos/{owner}/{repo}/dispatches needs, and nothing else.
            - name: Mint release-ops token (minimal-backporter)
              id: ops-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  app-id: ${{ vars.MINIMAL_BACKPORTER_APP_ID }}
                  private-key: ${{ secrets.MINIMAL_BACKPORTER_PRIVATE_KEY }}
                  owner: gominimal
                  repositories: release-ops
                  permission-contents: write

            - name: Report the release
              env:
                  GH_TOKEN: ${{ steps.ops-token.outputs.token }}
                  VERSION: ${{ needs.promote.outputs.version }}
                  ACTOR: ${{ github.triggering_actor }}
              run: |
                  set -euo pipefail
                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::notice::'$VERSION' is not a final version (a nightly sha or a prerelease); not reported"
                    exit 0
                  fi
                  gh api repos/gominimal/release-ops/dispatches \
                    -f event_type=release-promoted \
                    -f "client_payload[version]=$VERSION" \
                    -f "client_payload[actor]=$ACTOR"
                  echo "reported $VERSION to gominimal/release-ops"
