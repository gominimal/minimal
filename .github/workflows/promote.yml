name: promote-cli

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Short SHA to promote (leave empty for latest in bucket)"
        required: false
        type: string
      platforms:
        description: "Comma-separated platform list or 'all'"
        required: false
        default: "amd64-linux,arm64-linux"
        type: string

jobs:
  notify-pending:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Slack — approval required
        continue-on-error: true
        timeout-minutes: 5
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Promotion approval required:* `${{ github.repository }}`\nWorkflow: `${{ github.workflow }}`\nRequested by: ${{ github.actor }}\nApprove: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  promote:
    needs: notify-pending
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: "289724348228"
          workload_identity_provider: "projects/289724348228/locations/global/workloadIdentityPools/github/providers/gominimal"

      - name: Promote CLI version
        run: |
          SHA="$(echo "${{ inputs.sha }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PLATFORMS="$(echo "${{ inputs.platforms }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ "$PLATFORMS" = "all" ]; then
            PLATFORMS="amd64-linux,arm64-linux"
          fi

          if [ -z "$SHA" ]; then
            echo "No SHA provided, finding latest CLI archive in bucket..."
            LATEST=$(gcloud storage ls -l "gs://minimal-shim/archives/cli-amd64-linux-*.tar.zst" \
              | grep -v "^TOTAL:" \
              | sort -k2 \
              | tail -1 \
              | awk '{print $NF}')
            if [ -z "$LATEST" ]; then
              echo "ERROR: No CLI archives found in bucket"
              exit 1
            fi
            # Extract SHA: archives/cli-amd64-linux-<sha>.tar.zst → <sha>
            SHA="$(basename "$LATEST" | sed 's/^cli-amd64-linux-//;s/\.tar\.zst$//')"
            echo "Latest SHA: ${SHA}"
          fi

          IFS=',' read -ra PLATFORM_LIST <<< "$PLATFORMS"
          for plat in "${PLATFORM_LIST[@]}"; do
            plat="$(echo "$plat" | tr -d ' ')"
            echo "Checking cli-${plat}-${SHA}.tar.zst exists..."
            if ! gcloud storage ls "gs://minimal-shim/archives/cli-${plat}-${SHA}.tar.zst" > /dev/null 2>&1; then
              echo "ERROR: cli-${plat}-${SHA}.tar.zst not found in bucket"
              exit 1
            fi
          done

          for plat in "${PLATFORM_LIST[@]}"; do
            plat="$(echo "$plat" | tr -d ' ')"
            echo "Promoting CLI to ${SHA} for ${plat}..."
            echo "{\"version\":\"${SHA}\"}" > "cli-${plat}.json"
            gcloud storage cp \
              --cache-control="max-age=300" \
              "cli-${plat}.json" \
              "gs://minimal-shim/config/cli-${plat}.json"
          done

          echo "CLI promoted to ${SHA} for platforms: ${PLATFORMS}"
