name: promote-cli

# Point a channel at a staged, SMOKED version behind a human approval gate.
# Promoting a semver row to `stable` also publishes it: the draft GitHub
# Release the versioned build parked is published — which creates the
# v<semver> tag, last, on the already-smoked commit (the `publish` job).
on:
    workflow_dispatch:
        inputs:
            version:
                description: "Staged version to promote: a semver (0.6.0, from a versioned release build) or a nightly short SHA. Leave empty for the latest staged nightly SHA."
                required: false
                type: string
            target:
                description: "Channel to point at the version"
                required: true
                default: "stable"
                type: choice
                options:
                    - stable
                    - unstable
            dry_run:
                description: "Dry run — open issue + wait for approval but skip the GCS write"
                required: false
                type: boolean
                default: false
            override_provenance:
                description: "EMERGENCY ONLY — promote a version whose staged bytes were never smoked by a release run (no versions/<version>/smoked marker, or one that no longer matches)"
                required: false
                type: boolean
                default: false

env:
    # Single source of truth for the gate's approver allowlist.
    # Comma-separated, no spaces (the polling step splits on `,`).
    APPROVERS: bryan-minimal,evanspearman,jessie-minimal,jtnkminimal,Max-minimal,mitodrummer,msample,norrietaylor,twitchyliquid64

jobs:
    gate:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        # 6h matches the GitHub-hosted runner hard limit. A higher value is
        # misleading — `ubuntu-latest` jobs are killed at 6h regardless.
        timeout-minutes: 360
        outputs:
            issue_url: ${{ steps.issue.outputs.url }}
        steps:
            - name: Open approval issue
              id: issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  WORKFLOW: ${{ github.workflow }}
                  RUN_NUMBER: ${{ github.run_number }}
                  # triggering_actor (NOT actor) — actor is frozen on rerun, so a rerun
                  # by a different user would still let the original initiator self-approve.
                  ACTOR: ${{ github.triggering_actor }}
                  SERVER_URL: ${{ github.server_url }}
                  RUN_ID: ${{ github.run_id }}
                  VERSION_INPUT: ${{ inputs.version }}
                  TARGET_INPUT: ${{ inputs.target }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  OVERRIDE_PROVENANCE: ${{ inputs.override_provenance }}
              run: |
                  set -euo pipefail
                  BODY="**Repo:** \`${REPO}\`
                  **Workflow:** \`${WORKFLOW}\`
                  **Requested by:** @${ACTOR}
                  **Run:** ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}
                  **Version input:** \`${VERSION_INPUT:-<latest staged nightly sha>}\`
                  **Target channel:** \`${TARGET_INPUT}\`
                  **Dry run:** \`${DRY_RUN}\`
                  **Smoke-provenance override (EMERGENCY):** \`${OVERRIDE_PROVENANCE}\`

                  Comment **\`approved\`** to proceed or **\`denied\`** to cancel.
                  Closing this issue without an approval comment counts as denial.

                  Approver list (initiator excluded at runtime):
                  ${APPROVERS//,/, }"

                  URL=$(gh issue create \
                    --repo "$REPO" \
                    --title "Promotion approval required: ${WORKFLOW} run ${RUN_NUMBER}" \
                    --label "promotion-approval" \
                    --body "$BODY")
                  NUM="${URL##*/}"
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "number=$NUM" >> "$GITHUB_OUTPUT"
                  echo "Opened approval issue: $URL"

            - name: Notify Slack — approval required
              continue-on-error: true
              timeout-minutes: 5
              uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
              with:
                  webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                  webhook-type: incoming-webhook
                  payload: |
                      {
                        "text": "*Promotion approval required:* `${{ github.repository }}`\nRequested by: ${{ github.triggering_actor }}\nApprove here: ${{ steps.issue.outputs.url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }

            - name: Wait for approver decision
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
                  REPO: ${{ github.repository }}
                  # triggering_actor reflects the user who triggered THIS run (incl. reruns),
                  # so rerunning the workflow as a different user correctly excludes them.
                  INITIATOR: ${{ github.triggering_actor }}
                  POLL_INTERVAL: "30"
              run: |
                  set -euo pipefail

                  INITIATOR_LC=$(printf '%s' "$INITIATOR" | tr '[:upper:]' '[:lower:]')
                  ALLOWED_JSON=$(printf '%s' "$APPROVERS" | tr ',' '\n' \
                    | tr '[:upper:]' '[:lower:]' \
                    | grep -vx "$INITIATOR_LC" \
                    | jq -R . | jq -s .)

                  echo "Polling issue #${ISSUE_NUMBER}. Allowed approvers (initiator ${INITIATOR} excluded):"
                  echo "$ALLOWED_JSON" | jq -r '.[]'

                  while true; do
                    STATE=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.state')

                    DECISION=$(gh api --paginate "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
                      | jq -s 'add // []' \
                      | jq -c --argjson allowed "$ALLOWED_JSON" '
                          map(select(.user.login | ascii_downcase as $u | $allowed | index($u)))
                          | sort_by(.created_at)
                          | map(
                              (.body | ascii_downcase | gsub("[[:space:]]"; "")) as $b
                              | if   ($b | test("^(approved|approve|lgtm)$"))      then {decision: "approved", user: .user.login}
                                elif ($b | test("^(denied|deny|reject|rejected)$")) then {decision: "denied",   user: .user.login}
                                else empty end
                            )
                          | first // empty')

                    if [ -n "$DECISION" ] && [ "$DECISION" != "null" ]; then
                      DEC=$(echo "$DECISION" | jq -r '.decision')
                      USR=$(echo "$DECISION" | jq -r '.user')
                      if [ "$DEC" = "approved" ]; then
                        echo "Approved by @${USR}."
                        gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Approved by @${USR}. Proceeding." || true
                        exit 0
                      else
                        echo "Denied by @${USR}."
                        gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Denied by @${USR}. Cancelling promotion." || true
                        exit 1
                      fi
                    fi

                    if [ "$STATE" = "closed" ]; then
                      echo "Issue closed without an approval comment — treating as denial."
                      exit 1
                    fi

                    sleep "$POLL_INTERVAL"
                  done

    promote:
        needs: gate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: "read"
            id-token: "write"
        outputs:
            version: ${{ steps.promote.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: "524228262772"
                  workload_identity_provider: "projects/524228262772/locations/global/workloadIdentityPools/github/providers/gominimal"

            - name: Point channel at staged version
              id: promote
              env:
                  DRY_RUN: ${{ inputs.dry_run }}
                  # Pass dispatch inputs via env (NOT inline ${{ inputs.* }} in `run:`)
                  # to avoid shell template injection — see GitHub's hardening guide.
                  INPUT_VERSION: ${{ inputs.version }}
                  INPUT_TARGET: ${{ inputs.target }}
                  OVERRIDE_PROVENANCE: ${{ inputs.override_provenance }}
              run: |
                  set -euo pipefail
                  # Trim leading/trailing whitespace; users often paste versions with stray spaces.
                  VERSION="$(printf '%s' "$INPUT_VERSION" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  TARGET="$(printf '%s' "$INPUT_TARGET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

                  if [ -z "$VERSION" ]; then
                    echo "No version provided; finding the most recently staged nightly commit in gs://minimal-one..."
                    # The lookup lives in scripts/latest-staged-version.sh
                    # (tested by its _test.sh): it filters the rows to commit
                    # shas — a versioned (semver) row is promoted by name,
                    # deliberately, never as "whatever is newest".
                    VERSION="$(scripts/latest-staged-version.sh --bucket gs://minimal-one)"
                    echo "Latest staged SHA: ${VERSION}"
                  fi

                  # Provenance gate: the row's bytes must be the bytes a
                  # release run smoked (scripts/verify-smoked.sh compares the
                  # live components manifest against the smoked marker). Runs
                  # on the default path; the override exists for documented
                  # emergencies only and is surfaced in the approval issue above.
                  if [ "$OVERRIDE_PROVENANCE" = "true" ]; then
                    echo "::warning::smoke-provenance check SKIPPED (override_provenance=true)."
                  else
                    scripts/verify-smoked.sh --version "$VERSION" --bucket gs://minimal-one
                  fi

                  # set-channel.sh verifies the version is actually staged before it
                  # flips the pointer, and validates the target/version charset.
                  DRY_FLAG=""
                  [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
                  scripts/set-channel.sh \
                    --channel "$TARGET" \
                    --version "$VERSION" \
                    --bucket gs://minimal-one \
                    $DRY_FLAG

                  # The commit behind the row, for the docs rebuild below
                  # (its contract is a commit sha, never a version): a
                  # nightly row IS its short sha; a versioned (semver) row
                  # records its commit in the smoked marker
                  # (scripts/record-smoked.sh --sha). Only an emergency
                  # override can reach here without a marker; then a semver
                  # has no commit to offer and the docs step skips itself.
                  if [[ "$VERSION" =~ ^[0-9a-f]{7,40}$ ]]; then
                    SHA="$VERSION"
                  else
                    SHA="$(gcloud storage cat "gs://minimal-one/versions/$VERSION/smoked" 2>/dev/null | jq -r '.sha // empty' || true)"
                    [ -n "$SHA" ] || echo "::warning::no commit recorded for versions/$VERSION (no smoked marker) — the docs rebuild will be skipped"
                  fi

                  # Export the resolved version and commit for the publish and
                  # docs steps below.
                  {
                    echo "version=${VERSION}"
                    echo "sha=${SHA}"
                  } >> "$GITHUB_OUTPUT"

            # Mint a short-lived token scoped to gominimal/webapp via the
            # gominimal-aw-bot GitHub App (org standard — App tokens over PATs, see
            # gominimal/min-aw ADR-0002). The default GITHUB_TOKEN cannot dispatch
            # other repos; this token carries the App's contents:write permission
            # narrowed to the webapp repo only. The standalone docs host was
            # collapsed into the webapp (gominimal/webapp#470), which now runs the
            # deploy-time docs sync, so promotions dispatch the rebuild there.
            - name: Mint webapp-repo token (gominimal-aw-bot)
              id: docs-token
              if: ${{ inputs.dry_run != true }}
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3 # zizmor: ignore[github-app] token scoped to owner+repositories:docs (ADR-0002)
              with:
                  app-id: ${{ vars.AW_BOT_APP_ID }}
                  private-key: ${{ secrets.AW_BOT_PRIVATE_KEY }}
                  owner: gominimal
                  repositories: webapp

            - name: Trigger docs rebuild
              # client_payload[sha] is a COMMIT sha (the webapp pins its docs
              # sync to it as MINIMAL_DOCS_SHA), resolved above; a version
              # string would not do.
              env:
                  GH_TOKEN: ${{ steps.docs-token.outputs.token }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  VERSION: ${{ steps.promote.outputs.version }}
                  SHA: ${{ steps.promote.outputs.sha }}
              run: |
                  set -euo pipefail
                  if [ -z "$SHA" ]; then
                    echo "::warning::no commit sha for ${VERSION}; not dispatching reference-docs-promoted (rerun docs-hotfix.yml by hand)"
                    exit 0
                  fi
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[dry-run] would dispatch reference-docs-promoted to gominimal/webapp for ${VERSION} (commit ${SHA})"
                  else
                     gh api repos/gominimal/webapp/dispatches \
                       -f event_type=reference-docs-promoted \
                       -F "client_payload[sha]=${SHA}"
                     echo "Dispatched reference-docs-promoted to gominimal/webapp for ${VERSION} (commit ${SHA})"
                   fi

    publish:
        # A stable promotion of a versioned (semver) row publishes the DRAFT
        # GitHub Release `v<semver>` the versioned release build parked
        # (release.yml). Publishing a draft is what creates the tag: v<semver>
        # lands on the commit the draft targets — already built, staged,
        # smoked, and promoted — and triggers no build. A release that is
        # already public (a re-run, or a rollback) is left as it is, once its
        # tag checks out. A promoted NIGHTLY sha (not a semver) has nothing
        # versioned to publish and skips with a notice. A rehearsal promotion
        # (dry_run) publishes nothing.
        needs: promote
        if: ${{ inputs.target == 'stable' && !inputs.dry_run }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # publishing the draft creates the tag
        steps:
            - name: Publish the draft GitHub Release (creates the tag)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.promote.outputs.version }}
              run: |
                  set -euo pipefail
                  case "$VERSION" in
                    [0-9]*.[0-9]*.[0-9]*) semver="$VERSION" ;;
                    *)
                      echo "::notice::promoted version '$VERSION' is not a semver (a nightly sha) — nothing versioned to publish"
                      exit 0 ;;
                  esac
                  tag="v$semver"
                  # The release must exist: the versioned release build parks a
                  # draft with the notes and every artifact attached. A missing
                  # release is a pipeline invariant broken upstream, not
                  # something to paper over here.
                  state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null)" \
                    || { echo "::error::no GitHub Release $tag — was $semver cut by a versioned release build (release.yml versioned: true)?"; exit 1; }
                  read -r is_draft target <<<"$state"
                  if [ "$is_draft" != "true" ]; then
                    # Already public: a re-run, or a rollback. Leave the release
                    # as it is (no --latest, which would take the badge from a
                    # newer release), but only when its tag exists and sits on
                    # the commit the release targets. refs/tags/ so a branch
                    # that shares the tag's name never stands in for a missing
                    # tag.
                    tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha 2>/dev/null)" \
                      || { echo "::error::GitHub Release $tag is public but tag $tag does not exist"; exit 1; }
                    if [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
                      [ "$tagged" = "$target" ] \
                        || { echo "::error::tag $tag is at $tagged, but its GitHub Release targets $target"; exit 1; }
                    elif [[ "$semver" == 0.5.* ]]; then
                      # A tag-first release (0.5.x) targets a branch name; its
                      # tag is the only record of the commit it was built from.
                      # Every later release's draft is pinned to a commit.
                      echo "::notice::$tag targets '$target', not a commit; trusting the tag at $tagged"
                    else
                      echo "::error::GitHub Release $tag targets '$target', not a commit; cannot check its tag"
                      exit 1
                    fi
                    echo "::notice::GitHub Release $tag is already published at $tagged; leaving it as it is"
                    exit 0
                  fi
                  # A prerelease (a `-` tail, judged before any `+build`
                  # metadata) is published but never becomes "Latest".
                  extra=()
                  case "${semver%%+*}" in
                    *-*) echo "::notice::$tag is a prerelease — published without the Latest badge" ;;
                    *)   extra+=(--latest) ;;
                  esac
                  gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${extra[@]}"
                  # The tag now exists at the draft's target; say where.
                  tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
                  echo "published $tag at $tagged (draft targeted $target)"
