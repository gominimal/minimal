name: Core Tests
description: >
  Set up the toolchain and run the core workspace test suite (nextest +
  doctests). Assumes the repository is already checked out. Feature-gated
  proofs behind non-default features (e.g. networking-proxy, networking-wg)
  are NOT run here — invoke those explicitly in the calling workflow.

inputs:
  shared-key:
    description: rust-cache shared-key, forwarded to setup-rust.
    required: false
    default: tests
  save-if:
    description: >
      Whether this job may write the cache, forwarded to setup-rust. Nightly
      canaries pass "false" so a throwaway beta/updated-deps build never
      consumes the shared pool the real lanes restore from.
    required: false
    default: ${{ github.ref == 'refs/heads/main' }}

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
    - name: Install nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Check Cargo.lock is up-to-date
      shell: bash
      run: cargo fetch --locked
    - name: Run tests
      shell: bash
      # --no-tests=fail: an empty selection is a broken filter or a dropped
      # target, not a pass.
      run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
    - name: Run doctests
      shell: bash
      run: cargo test --workspace --doc --locked
    - name: Publish test summary
      # Surface the nextest JUnit counts on the run page so per-PR test
      # evidence is visible without downloading artifacts. `always()` so a
      # failing run still reports. Best-effort parse of the testsuites root.
      if: always()
      shell: bash
      run: |
        junit="target/nextest/ci/junit.xml"
        [ -f "$junit" ] || exit 0
        line="$(grep -m1 '<testsuites' "$junit" || true)"
        attr() { printf '%s' "$line" | grep -oE "$1=\"[0-9.]+\"" | head -1 | grep -oE '[0-9.]+'; }
        {
          echo "### Workspace tests (nextest, profile ci)"
          echo ""
          echo "| tests | failures | errors | time |"
          echo "|---|---|---|---|"
          echo "| $(attr tests) | $(attr failures) | $(attr errors) | $(attr time)s |"
        } >> "$GITHUB_STEP_SUMMARY"
