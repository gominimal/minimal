name: Guest artifacts
description: >
  Materialize the guest microVM kernel (raw Image) and rootfs (ext4 image)
  for an arch via scripts/fetch-artifact.sh — cache pulls keyed by the pinned
  upstream commit, not builds, so any guest arch pulls fine on an x86_64
  runner. Assumes the repository is checked out and any cargo cache restore
  has already happened (the first pull builds the mip CLI that drives it).

inputs:
  arch:
    description: Kernel-style arch (x86_64 or aarch64)
    required: true
  kernel-dest:
    description: Destination path for the raw kernel Image
    required: true
  rootfs-dest:
    description: Destination path for the ext4 rootfs image
    required: true

runs:
  using: composite
  steps:
    - name: Materialize guest kernel (raw Image)
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        DEST: ${{ inputs.kernel-dest }}
      run: ./scripts/fetch-artifact.sh virtio-kernel "$DEST" "$ARCH"
    - name: Materialize guest rootfs (ext4 image)
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        DEST: ${{ inputs.rootfs-dest }}
      run: ./scripts/fetch-artifact.sh minvmd-rootfs "$DEST" "$ARCH"
